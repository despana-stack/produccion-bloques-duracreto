<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bloques DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{min-height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bloques DC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: banda negra de marca arriba; registro móvil en columna de 480px; dashboard en grilla de 12 col. */
:root{
  --ink:#12130F; --yellow:#F9D600; --orange:#F49A29; --brandgray:#A0A19F;
  --bg:#F4F4F1; --surface:#FFFFFF; --surface2:#ECECE7; --fg:#12130F; --muted:#66675F; --line:#DCDCD5;
  --accent:#F49A29; --accent-ink:#B5650A; --gold:#C9A800;
  --c-gra:#2a78d6; --c-bas:#eb6834; --c-cua:#1baf7a;
  --ok:#1F8A4C; --blue:#2563C9; --blue-bg:#E2ECFB; --warn:#C27C00; --bad:#C2372B; --ok-bg:#E3F3E9; --warn-bg:#FFF1D6; --bad-bg:#FBE3E0;
  --font:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --hero-a:#FFF0B8; --hero-b:#FFF9E3; --hero-c:#FFFFFF; --hero-line:#F1D96A; --hero-track:#EFE6C4; --hero-chip:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F100D; --surface:#1A1B17; --surface2:#24251F; --fg:#F2F2EE; --muted:#A3A49C; --line:#33342D;
  --accent:#F49A29; --accent-ink:#F7B867; --gold:#F9D600; --c-gra:#3987e5; --c-bas:#d95926; --c-cua:#199e70;
  --hero-a:#2E2913; --hero-b:#23211A; --hero-c:#1A1B17; --hero-line:#5A4E1C; --hero-track:#3A3626; --hero-chip:#24251F; --ok:#4CC27F; --blue:#6EA2F5; --blue-bg:#16253F; --warn:#F2B33D; --bad:#F06B5E; --ok-bg:#16301F; --warn-bg:#33270F; --bad-bg:#3A1A16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F100D; --surface:#1A1B17; --surface2:#24251F; --fg:#F2F2EE; --muted:#A3A49C; --line:#33342D;
  --accent:#F49A29; --accent-ink:#F7B867; --gold:#F9D600; --c-gra:#3987e5; --c-bas:#d95926; --c-cua:#199e70;
  --hero-a:#2E2913; --hero-b:#23211A; --hero-c:#1A1B17; --hero-line:#5A4E1C; --hero-track:#3A3626; --hero-chip:#24251F; --ok:#4CC27F; --blue:#6EA2F5; --blue-bg:#16253F; --warn:#F2B33D; --bad:#F06B5E; --ok-bg:#16301F; --warn-bg:#33270F; --bad-bg:#3A1A16; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{overscroll-behavior-y:contain;font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banda superior */
.top{background:#12130F;color:#F2F2EE;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:4px solid var(--yellow)}
.top .in{display:flex;align-items:center;gap:14px;padding-block:10px;max-width:1280px;margin:0 auto}
.top img{height:34px;width:auto;display:block}
.top .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.3;min-width:0}
.top .who b{display:block;font-size:13px;color:#F9D600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .out{background:transparent;border:1px solid #4a4b45;color:#F2F2EE;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:4px;max-width:1280px;margin:0 auto;overflow-x:auto;padding-bottom:0}
.tabs button{background:transparent;border:0;color:#B9BAB2;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#F9D600;border-bottom-color:#F9D600}

main{max-width:1280px;margin:0 auto;padding-block:20px 60px}
.col{max-width:480px;margin:0 auto}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .card{width:100%;max-width:400px;background:var(--surface);border-radius:20px;padding:28px 24px;border:1px solid var(--line)}
.login img{width:180px;display:block;margin:0 auto 22px}
.login h1{font-size:22px;text-align:center;margin-bottom:2px}
.login .eyebrow{text-align:center;margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.login p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lbl{font-weight:600;font-size:14px}
.field .hint{font-size:12px;color:var(--muted)}
.in-ctl{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font-size:17px}
.in-ctl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
select.in-ctl{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.in-ctl.bigNum{font-size:26px;font-weight:700;letter-spacing:.5px}
textarea.in-ctl{min-height:96px;resize:vertical}
.err .in-ctl,.err .choice-grid,.err .photo{border-color:var(--bad)!important}
.errmsg{color:var(--bad);font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;border:0;padding:0 20px;font-weight:700;font-size:16px;cursor:pointer}
.btn.primary{background:var(--yellow);color:#12130F;width:100%;font-size:18px;min-height:58px}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.small{min-height:38px;font-size:13px;padding:0 14px;border-radius:10px}
.btn:focus-visible,.tile:focus-visible,.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface2)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.fixedteam{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:12px;background:var(--surface2);padding:10px 14px;font-weight:600}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1.5px solid transparent;border-radius:14px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-height:58px;font-size:14px;font-weight:600;line-height:1.25}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);color:#12130F}
.choice[aria-pressed="true"] small{color:#3a3a33}
.choice.full{grid-column:1/-1}

.photo{border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.photo .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo img{border-radius:10px;max-height:220px;object-fit:cover;width:100%;display:block}
.fpw{position:relative}.scanov{display:none;position:absolute;inset:0;border-radius:10px;overflow:hidden;background:rgba(18,19,15,.38);background-image:linear-gradient(rgba(249,214,0,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(249,214,0,.13) 1px,transparent 1px);background-size:22px 22px}
.scanning .scanov{display:block}.scanning #fprev{filter:saturate(.6) brightness(.9)}
.scanov i{position:absolute;left:0;right:0;top:0;height:3px;background:#F9D600;box-shadow:0 0 22px 8px rgba(249,214,0,.65);animation:scanl 1.5s ease-in-out infinite alternate}
@keyframes scanl{from{top:2%}to{top:96%}}
.scanov b{position:absolute;width:26px;height:26px;border:3px solid #F9D600}.scanov .sc1{top:8px;left:8px;border-right:0;border-bottom:0}.scanov .sc2{top:8px;right:8px;border-left:0;border-bottom:0}.scanov .sc3{bottom:8px;left:8px;border-right:0;border-top:0}.scanov .sc4{bottom:8px;right:8px;border-left:0;border-top:0}
.scanov span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#12130F;color:#F9D600;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.scanov i{animation:none;top:50%}}
.verifbox{background:var(--bad-bg);color:var(--fg);border-radius:14px;padding:14px 16px;font-size:14px;margin-bottom:14px;border-left:5px solid var(--bad)}.verifbox.duda{background:var(--warn-bg);border-left-color:var(--warn)}.verifbox b.t{display:block;font-size:15.5px;margin-bottom:6px}.verifbox ul{margin:6px 0 4px;padding-left:18px}.verifbox li{margin:3px 0}.verifbox .note{font-size:12.5px}
.warnbox{background:var(--warn-bg);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;border-left:4px solid var(--warn)}

/* Inicio líder */
.hello{margin-bottom:18px}
.hello h2{font-size:22px}
.hello p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:16px;border:0;border-radius:18px;padding:18px;text-align:left;cursor:pointer;min-height:92px;background:var(--surface);border:1px solid var(--line)}
.tile .ic{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.tile .ic svg{width:30px;height:30px}
.tile b{display:block;font-size:17px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.t1{background:#12130F;color:#F2F2EE;border-color:#12130F}.tile.t1 span{color:#B9BAB2}.tile.t1 .ic{background:var(--yellow);color:#12130F}
.tile.t2 .ic{background:var(--orange);color:#12130F}
.tile.t3 .ic{background:var(--surface2);color:var(--fg)}
.tile.t4 .ic{background:var(--bad-bg);color:var(--bad)}
.tile.t5{background:#F9D600;color:#12130F;border-color:#F9D600}.tile.t5 span{color:#3d3a1f}.tile.t5 .ic{background:#12130F;color:#F9D600}
.uw{position:relative}.uw .in-ctl{padding-right:58px}.uw .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--muted);pointer-events:none}
.tolvas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tolvas .tv label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.tolvas select{font-size:14px;padding-left:8px;padding-right:22px}
@media(max-width:420px){.tolvas{grid-template-columns:1fr}}
.lch{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.lcbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:14px}
.lcrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:15px}.lcrow:last-child{border-bottom:0}.lcrow b{font-size:18px;white-space:nowrap}
.lcrow.duda{flex-direction:column;align-items:stretch;background:var(--warn-bg);margin:6px -14px;padding:12px 14px;border-radius:12px;border-bottom:0}.lcrow small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.lcrow .choice-grid{grid-template-columns:1fr 1fr;margin-top:8px}.lcrow .choice{text-align:center;font-size:17px;font-weight:800}
.lcfoto{width:100%;border-radius:14px;margin:0 0 14px;border:1px solid var(--line)}
.matgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.matgrid .field label{min-height:2.6em;display:flex;align-items:flex-end}
.recent{margin-top:26px}
.metacard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.metacard .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.metacard .mh .lbl{font-size:13px}
.mbar{position:relative;height:18px;border-radius:8px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:8px;transition:width .6s}
.mpct{font-size:42px;font-weight:800;line-height:1;margin:2px 0 12px}
.mf{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:16px;color:var(--muted)}
.mf b{color:var(--fg);font-size:22px}
.ncsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ncsum div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.ncsum b{display:block;font-size:22px}
.ncsum span{font-size:11.5px;color:var(--muted)}
.minibars{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:16px}
.minibars div{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.minibars b{text-align:right}
table.qc td{white-space:normal;vertical-align:middle}
.recent h3{font-size:14px;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.recent li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.recent ul{margin:0;padding:0}

.formhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.formhead button{border:0;background:var(--surface2);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:20px;flex:none}
.formhead h2{font-size:20px}
.formhead p{margin:0;color:var(--muted);font-size:12px}

/* Éxito */
.done{text-align:center;padding-block:30px}
.done .ok{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 16px;color:#fff}
.done h2{font-size:24px}
.done .folio{display:inline-block;margin:10px 0 18px;background:var(--surface2);border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;margin-bottom:18px}
.summary div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.summary div:last-child{border-bottom:0}
.gauge{margin:6px auto 20px;max-width:360px}
.gauge .big{font-size:56px;font-weight:800;line-height:1}
.pill{display:inline-block;white-space:nowrap;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* Dashboard */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:18px}
.filters .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.filters label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filters select,.filters input{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:14px}
.filters .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.msel{position:relative}.msel summary{list-style:none;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 34px 6px 10px;font-size:14px;cursor:pointer;white-space:nowrap;min-width:190px;position:relative}
.msel summary::-webkit-details-marker{display:none}.msel summary::after{content:'';position:absolute;right:12px;top:16px;border:5px solid transparent;border-top-color:var(--muted)}
.msel[open] summary{border-color:var(--fg)}
.msel .mp{position:absolute;z-index:30;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;min-width:260px}
.msel .ma{display:flex;gap:6px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}.msel .ma button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:8px;padding:7px 6px;font:600 12.5px var(--font);cursor:pointer}
.msel .mp label{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer}.msel .mp label:hover{background:var(--surface2)}
.msel .mp input{width:18px;height:18px;min-height:0;accent-color:#12130F;margin:0}
.dlg .btn+.btn{margin-top:8px}.dlg .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit}.dlg .opt b{display:block;font-size:15.5px}.dlg .opt span{font-size:13px;color:var(--muted)}.dlg .opt:hover{border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:15px;margin-bottom:2px}
.card .cap{font-size:12px;color:var(--muted);margin:0 0 12px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:980px){.s8,.s7,.s6,.s5{grid-column:span 12}.s4,.s3{grid-column:span 6}}
@media (max-width:560px){.s4,.s3{grid-column:span 12}}

.hero{background:linear-gradient(100deg,var(--hero-a) 0%,var(--hero-b) 45%,var(--hero-c) 100%);border:1px solid var(--hero-line);border-top:6px solid var(--yellow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px 40px;align-items:center}
.hero .hh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .kpi{font-size:clamp(38px,5vw,54px);font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:6px}
.hero .kpi small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero .st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .st div{background:var(--hero-chip);box-shadow:0 1px 0 var(--hero-line);border-radius:12px;padding:10px 14px;min-width:0}
.hero .st b{display:block;font-size:21px;font-weight:700;line-height:1.2}
.hero .st span{font-size:12px;color:var(--muted)}
.prog{grid-column:1/-1;position:relative;height:18px;border-radius:9px;background:var(--hero-track);margin:22px 0 22px}
.prog .fill{position:absolute;inset:0 auto 0 0;border-radius:9px}
.prog .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg)}
.prog .mk span{position:absolute;top:22px;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}
.prog .mk.top span{top:-20px;font-weight:600;color:var(--fg)}
.prog .mk.eq{background:var(--brandgray)}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.kc{border-top:4px solid var(--line)}
.kc .kt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pareto td{padding:7px 8px}.pareto .pb{width:45%;min-width:90px}
.gb{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.gb:last-of-type{border-bottom:0}
.gb .gt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gb .gt b{font-size:16px}

.mnu-p{position:absolute;top:0;bottom:0;left:0;width:min(86vw,330px);background:var(--surface);color:var(--fg);display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.3);animation:mnuS .2s ease;padding-top:env(safe-area-inset-top,0px)}
@keyframes mnuS{from{transform:translateX(-100%)}}@keyframes mnuF{from{opacity:0}}
.mnu-h{background:#12130F;color:#F2F2EE;padding:16px 14px 14px 16px;border-bottom:4px solid var(--mc,#F9D600);display:flex;align-items:flex-start;gap:10px}
.mnu-h b{display:block;font-size:15px}.mnu-h span{display:block;font-size:12px;color:#B9BAB2}
.mnu-x{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #4a4b45;background:transparent;color:#F2F2EE;font-size:20px;line-height:1;cursor:pointer}
.mnu-b{flex:1;overflow-y:auto;padding:6px 10px 10px;overscroll-behavior:contain}
.mnu-lb{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 8px 7px}
.neg-cur{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.neg-cur b{display:block;font-size:14.5px}.neg-cur small{display:block;font-size:11px;color:var(--muted)}
.neg-cur .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.neg-cur[aria-expanded="true"]{border-color:var(--orange);border-radius:12px 12px 0 0}.neg-cur[aria-expanded="true"] .chev{transform:rotate(180deg)}
.neg-list{border:1.5px solid var(--orange);border-top:0;border-radius:0 0 12px 12px;padding:6px;background:var(--surface)}
.neg-opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:transparent;border:0;border-radius:10px;padding:8px;cursor:pointer;margin-top:4px}
.neg-opt:first-child{margin-top:0}
.neg-opt b{display:block;font-size:14px}.neg-opt small{display:block;font-size:11px;color:var(--muted)}
.neg-opt.on{background:var(--hero-a)}.neg-opt.on b{font-weight:800}.neg-opt .chk{margin-left:auto;color:var(--ok);font-weight:800}
.neg-opt.px{opacity:.92}.neg-opt.px .bz{filter:saturate(.75)}
.neg-opt.px:not(:first-child){margin-top:14px}
.prox{position:absolute;right:8px;top:-9px;background:#12130F;color:#F9D600;font-size:9.5px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:proxB 2.4s ease-in-out infinite;pointer-events:none}
.prox::after{content:"";position:absolute;left:14px;bottom:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#12130F}
:root[data-theme="dark"] .prox{background:#F9D600;color:#12130F}:root[data-theme="dark"] .prox::after{border-top-color:#F9D600}
@keyframes proxB{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:500;color:var(--fg);background:transparent;border:0;border-radius:10px;padding:10px 10px;cursor:pointer}
.mi svg{width:19px;height:19px;color:var(--muted);flex:none}
.mi[aria-current="page"]{background:var(--hero-a);font-weight:700;box-shadow:inset 3px 0 0 var(--orange)}.mi[aria-current="page"] svg{color:var(--fg)}
.mi .badge{position:static;margin-left:auto}
.mi .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 9px}
.mi .st{margin-left:auto;font-size:12px;color:var(--muted)}
.mi .sw{margin-left:auto;width:36px;height:21px;border-radius:999px;background:var(--surface2);position:relative;flex:none;border:1px solid var(--line)}
.mi .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.mi .sw.on{background:var(--ok);border-color:var(--ok)}.mi .sw.on::after{left:17px}
.mi.out,.mi.out svg{color:var(--bad)}
.mnu-sep{height:1px;background:var(--line);margin:10px 6px}
.mnu-f{font-size:11px;color:var(--muted);text-align:center;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px))}
:root[data-theme="dark"] .bz{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.prox-dlg .av{width:150px;height:150px;margin:-6px auto 8px}.prox-dlg .av svg{width:100%;height:100%;display:block}
.prox-dlg .pt{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:8px;background:var(--mc);color:var(--mci)}
.prox-dlg p{color:var(--fg)}.prox-dlg .firma{font-size:12px;color:var(--muted);margin:-8px 0 16px}
/* ===== Escritorio: encabezado de una fila y menú fijo ===== */
.top .brand,.top .crumb-d,.top .ini{display:none}
@media (min-width:1024px){
 .top .in{max-width:none;padding:10px 24px;gap:16px;min-height:68px}
 .top .in>img{height:46px}
 .top .brand{display:flex;flex-direction:column;justify-content:center;padding-left:16px;border-left:1px solid #3a3b34;line-height:1.2;white-space:nowrap}
 .top .brand b{font-size:15px;color:#fff;letter-spacing:.01em}.top .brand span{font-size:11.5px;color:#9FA098}
 .top .crumb-d{display:flex;align-items:center;gap:10px;margin-left:12px;padding:6px 6px 6px 6px;background:#1d1e19;border:1px solid #2e2f29;border-radius:999px;color:#B9BAB2;font-size:13px;min-width:0}
 .top .crumb-d b{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
 .top .crumb-d .mchip{font-size:12.5px;padding:3px 12px 3px 4px}.top .crumb-d .mchip .bz{width:20px;height:20px}
 .top .ini{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--mc,#F9D600);color:#12130F;font-weight:800;font-size:14px}
 .top .who{font-size:12.5px}.top .who b{font-size:13.5px}
 .top+.crumb,.crumb{display:none}
 html.mnu-fijo{--sbw:288px}
 html.mnu-fijo #app{padding-left:var(--sbw)}
 html.mnu-fijo #app>header.top{margin-left:calc(-1*var(--sbw))}
 html.mnu-fijo .mnu{inset:auto;top:var(--hh,68px);left:0;bottom:0;width:var(--sbw);z-index:15}
 html.mnu-fijo .mnu-sh{display:none}
 html.mnu-fijo .mnu-p{position:static;width:100%;height:100%;box-shadow:none;border-right:1px solid var(--line);animation:none;padding-top:0}
 html.mnu-fijo .mnu-h{border-bottom-width:1px;border-bottom-color:#2e2f29;padding:14px 12px 12px 16px}
 html.mnu-fijo .hb{background:#2b2c26;border-color:#5a5b54}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function initCat(){CFG=SEED.config;if(CFG.descansoDespuesDe==null)CFG.descansoDespuesDe=4;UMBRAL={bueno:CFG.umbralOptimo,aceptable:CFG.umbralMejorar};EQ=Object.fromEntries(SEED.equipos.map(e=>[e.id,e]));PR=Object.fromEntries(SEED.productos.map(p=>[p.id,p]));CA=Object.fromEntries(SEED.causas.map(c=>[c.id,c]));aplicarRotacion()}
/* Rotación semanal de turnos (lunes 6:00 am): A → B → C → A. Semana base 12-oct-2026: Grupo 1 = C, Grupo 2 = A, Grupo 3 = B */
const ROT={base:'2026-10-12',orden:['A','B','C'],ini:{E1:'C',E2:'A',E3:'B'}};
function semanaRot(d=new Date()){const x=new Date(d.getTime()-6*3600e3);const b=new Date(ROT.base+'T00:00:00');const lun=new Date(x.getFullYear(),x.getMonth(),x.getDate()-((x.getDay()+6)%7));return Math.round((lun-b)/(7*864e5))}
function turnoRot(id,d){const i0=ROT.orden.indexOf(ROT.ini[id]);if(i0<0)return null;const w=semanaRot(d);return ROT.orden[(((i0+w)%3)+3)%3]}
function aplicarRotacion(){Object.values(EQ).forEach(e=>{const t=turnoRot(e.id);if(t)e.turno=t})}

function limpiezaAntes(r){const fin=relT(r.turno,r.hora);let t=0;DB.paros.forEach(p=>{if(p.fecha!==r.fecha||p.turno!==r.turno||p.equipo!==r.equipo||(p.causaRev||p.causa)!=='MAN')return;const a=relT(p.turno,p.inicio),b=a+(+p.minutos||0);t+=Math.max(0,Math.min(b,fin)-a)});return Math.min(LIMP_MAX,t)}

function calc(){
  const ym=F.mes,dias=diasMes(ym),hab=dias.filter(habil),share=(F.eq||F.tu)?1/3:1;
  const meta=metaMes(ym)*share,equi=CFG.equilibrio*share,metaDia=meta/hab.length;
  const P=DB.produccion.filter(r=>inF(r)),Pm=DB.produccion.filter(r=>r.fecha.slice(0,7)===ym&&(!F.eq||r.equipo===F.eq)&&(!F.tu||r.turno===F.tu));
  const tot=Pm.reduce((s,r)=>s+eqv(r),0),totSel=P.reduce((s,r)=>s+eqv(r),0),realSel=P.reduce((s,r)=>s+r.unidades,0),cicSel=P.reduce((s,r)=>s+r.ciclos,0);
  const t=todayISO(),lim=t.slice(0,7)===ym?t:(t>ym?dias.slice(-1)[0]:dias[0]);const conDato=Pm.map(r=>r.fecha).filter(d=>d<=lim).sort();const corte=conDato.length?conDato[conDato.length-1]:lim;
  const habTrans=hab.filter(d=>d<=corte).length,habRest=hab.filter(d=>d>corte).length;
  const ritmo=habTrans?tot/habTrans:0,proy=ritmo*hab.length;
  const reqDia=habRest?Math.max(0,meta-tot)/habRest:0;
  const turnos=P.length,idx=turnos?cicSel/(turnos*CFG.ciclosHora*CFG.horasTurno):0;
  return {ym,dias,hab,meta,equi,metaDia,P,Pm,tot,totSel,realSel,cicSel,habTrans,habRest,ritmo,proy,reqDia,idx,turnos,corte,share};
}

function groupBars(c){
  const habR=c.hab.filter(d=>d>=F.desde&&d<=F.hasta&&d<=c.corte).length,espG=metaMes(c.ym)/3/c.hab.length*habR;
  const rows=SEED.equipos.filter(e=>!F.eq||F.eq===e.id).map(e=>{const P=c.P.filter(r=>r.equipo===e.id),v=P.reduce((s,r)=>s+eqv(r),0),cy=P.reduce((s,r)=>s+r.ciclos,0);
   const N=ncIn(e.id,F.desde,F.hasta),sg=N.filter(r=>r.clase==='Segunda').reduce((s,r)=>s+r.cantidad,0),ds=N.filter(r=>r.clase==='Desecho').reduce((s,r)=>s+r.cantidad,0);
   const pa=DB.paros.filter(r=>r.equipo===e.id&&r.fecha>=F.desde&&r.fecha<=F.hasta&&(!F.tu||r.turno===F.tu)).reduce((s,r)=>s+r.minutos,0);
   return {e,v,sg,ds,pa,idx:P.length?cy/(P.length*1260):0,prim:Math.max(0,v-sg-ds)}});
  const mx=Math.max(espG,...rows.map(r=>r.v))*1.08||1;
  return rows.map(r=>{const [ic]=nivel(r.idx);return `<div class="gb"><div class="gt"><b>${r.e.nombre}</b><span class="num"><b>${fmt(r.v)}</b> u · ${pct(espG?r.v/espG:0)} de lo esperado</span></div>
   <div class="gbar" role="img" aria-label="${r.e.nombre}: ${fmt(r.v)} de ${fmt(espG)} esperadas"><i style="width:${r.prim/mx*100}%;background:var(--fg)"></i><i style="width:${r.sg/mx*100}%;background:var(--gold)"></i><span class="pm" style="left:${espG/mx*100}%"></span></div>
   <div class="gs num"><span>Segunda <b>${fmt(r.sg)}</b></span><span>Desecho <b>${pct(r.v?r.ds/r.v:0,2)}</b></span><span>Paro <b>${(r.pa/60).toFixed(1)} h</b></span><span>Índice <b style="color:var(--${ic})">${pct(r.idx,1)}</b></span></div></div>`}).join('')+`<p class="note" style="margin:8px 0 0">Esperado a la fecha por grupo: ${fmt(espG)} (${fmt(metaTurnoU())} por turno × días hábiles).</p>`}
function pareto(PA){const by={};PA.forEach(r=>{const k=r.causaRev||r.causa;by[k]=(by[k]||0)+r.minutos});const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]),tot=ks.reduce((s,k)=>s+by[k],0),mx=by[ks[0]]||1;let acc=0;

function teamCards(c){return SEED.equipos.map(e=>{const okD=r=>r.fecha>=F.desde&&r.fecha<=F.hasta&&(!F.tu||r.turno===F.tu)&&(!F.eq||F.eq===e.id);const P=DB.produccion.filter(r=>r.equipo===e.id&&okD(r));const u=P.reduce((s,r)=>s+eqv(r),0),cy=P.reduce((s,r)=>s+r.ciclos,0),idx=P.length?cy/(P.length*1260):0;

function corteToca(){if(!S||!can('corte')||!S.equipo||!EQ[S.equipo])return null;const t=turnoAhora();if(EQ[S.equipo].turno!==t)return null;
  const rel=relT(t,nowHM()),fecha=fechaJornada(t);
  for(const k of [2,4,6]){const T=k*60;if(rel>=T-REC_ANTES&&rel<=T+REC_DESPUES){
    const hecho=DB.cortes.some(c=>c.equipo===S.equipo&&c.fecha===fecha&&c.turno===t&&relT(t,c.hora)>=T-30);
    if(hecho)return null;const st={A:6,B:14,C:22}[t],h=(st+k)%24;return {id:fecha+t+k,hora:pad(h)+':00',faltan:T-rel,turno:t}}}

    try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(g=>g.showNotification('Recordatorio de corte',{body:`Corte de las ${r.hora} · ${EQ[S.equipo].nombre}`,icon:'icons/icon-192.png',tag:'corte-'+r.id}))}catch(e){}}}

const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const SUG_FALLA=/problema|danad|dano|falla|quebr|revent|roto|rompi|cambi(o|ar|ando) de (sensor|banda|balinera|cadena|pieza)|sold|repar|trab|fuga|desajust|no funciona|sin funcionar/;

 ['ELE',/\b(luz|enee|generador|apagon|energia|electricidad|voltaje|planta electrica)\b/],

 ['TRA',/cargadora|multiforca|montacarga|llanta|ponchad|bandejas? caidas? en (el )?tunel|tunel \d/],
 ['MAT',/\b(cemento|arena|grava|aditivo|adiblock)\b|agregado contaminado|piedra|tolvas? vacias?|falta de (material|materia|rampla|rampa|tarima|bandeja|agregado)|cisterna|sin material/],
 ['PER',/reunion|capacitacion|ausencia|falta de personal|accidente|personal/],

 ['MEC',/molde|pin\b|pines|piston|volteador|voltiador|sprocket|banda|freno|skip|sky|cono|sensor|sonda|motor|balinera|cadena|cajon|mesa|fuga|sold|rodo|rodillo|ascensor|descensor|desensor|inyector|contactor|paletizador|mezcladora|prensa|vibra|reductor|tornillo|una\b|unas\b|pata|contramolde|contra molde|guia|cable|rampa|brazo|eje\b|agitador|tope|cilindro|hidraul|compresor|valvula|manguera|bomba|faja|polea|rueda|parrilla|tolva|danad|quebr|revent|falla|averia|corto ?circuito/]

function mpDia(d){const mp=SEED.mp;const imp=mp.diario.filter(r=>r.fecha===d);const fac=vig(mp.factores,d)||{arenaSJ:1600,arenaSE:1600,grava:1550,aditivo:3.785};const cos=vig(mp.costos,d);

  if(imp.length){fuente='Bodega';imp.forEach(r=>{const o=prods[r.producto]=prods[r.producto]||{u:0,real:{}};o.u+=r.unidades;MPM.forEach(([k])=>o.real[k]=(o.real[k]||0)+(+r[k]||0))})}
  else{const C=DB.consumos.filter(r=>r.fecha===d);const P=DB.produccion.filter(r=>r.fecha===d);if(!C.length&&!P.length)return null;fuente='App';
    C.forEach(r=>{const o=prods[r.producto]=prods[r.producto]||{u:0,real:{},kg:{}};o.real.cemento=(o.real.cemento||0)+(+r.cemento||0);
      ['arenaSJ','arenaSE','grava'].forEach(k=>{o.kg[k]=(o.kg[k]||0)+(+r[k]||0);o.real[k]=(o.real[k]||0)+(+r[k]||0)/fac[k]});o.real.aditivo=(o.real.aditivo||0)+(+r.aditivo||0)/(fac.aditivo||3.785)});
    const tc=new Set(C.map(r=>r.turno+'|'+r.producto));P.forEach(r=>{if(tc.has(r.turno+'|'+r.producto))prods[r.producto].u+=r.unidades;else if(!falta.includes(r.turno))falta.push(r.turno)});
    if(!C.length){return {d,fuente,falta,sinCons:true,prods:{},real:{},ficha:{},u:P.reduce((s,r)=>s+r.unidades,0)}}}
  const real={},ficha={},sinFicha=[],pp={};let u=0;
  Object.entries(prods).forEach(([p,o])=>{const f=vig(mp.ficha,d,r=>r.producto===p);if(!f||f.cemento==null){sinFicha.push(p);return}u+=o.u;
    MPM.forEach(([k])=>{real[k]=(real[k]||0)+(o.real[k]||0);ficha[k]=(ficha[k]||0)+o.u*(+f[k]||0)});
    if(cos)pp[p]={u:o.u,cR:MPM.reduce((s,[k])=>s+(o.real[k]||0)*(+cos[k]||0),0),cF:MPM.reduce((s,[k])=>s+o.u*(+f[k]||0)*(+cos[k]||0),0)}});
  const cR=cos?MPM.reduce((s,[k])=>s+(real[k]||0)*(+cos[k]||0),0):null,cF=cos?MPM.reduce((s,[k])=>s+(ficha[k]||0)*(+cos[k]||0),0):null;
  return {d,fuente,falta,sinFicha,prods,real,ficha,u,cos,fac,cR,cF,pp}}
const lpu=n=>(n==null||!isFinite(n))?'–':(n<0?'−':'')+'L '+Math.abs(n).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=n=>n>0.0005?'+':'';
let mpChU=false;

  m.innerHTML=`<div class="mp">${sub}<div id="mpb"></div></div>`;
  document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{mpTab=b.dataset.mt;renderMP()});

     <section class="card"><span class="lbl">Costo según ficha</span><b class="num">${lps(T.cF)}</b><span class="note">Lo que debió costar con la ficha vigente</span></section>

   <section class="card" style="margin-top:16px"><h3>Variación por material</h3><p class="cap">Real − ficha. Rojo: se consumió más de lo que indica la ficha; verde: menos.</p><div class="tbl"><table><thead><tr><th>Material</th><th class="r">Real</th><th class="r">Ficha</th><th class="r">Variación</th><th class="r">%</th><th class="r">Costo unitario</th><th class="r">Impacto</th></tr></thead><tbody>
     ${MPM.map(([k,n,u])=>{const r=T.real[k]||0,f=T.ficha[k]||0,v=r-f,p=f?v/f:0,i=imp(k);return `<tr><td><b>${n}</b> <span class="note">(${u})</span></td><td class="r num">${qf(r,u)}</td><td class="r num">${qf(f,u)}</td><td class="r num ${cls(p)}">${v>0?'+':''}${qf(v,u)}</td><td class="r num ${cls(p)}">${f?(p>0?'+':'')+pct(p,1):'–'}</td><td class="r num">${cosAct?lps(+cosAct[k])+' / '+u:'–'}</td><td class="r num ${cls(i)}"><b>${i>0?'+':''}${lps(i)}</b></td></tr>`}).join('')}
     <tr class="tot"><td><b>Total</b></td><td></td><td></td><td></td><td class="r num ${cls(dp)}">${(dp>0?'+':'')+pct(dp,1)}</td><td></td><td class="r num ${cls(dv)}"><b>${dv>0?'+':''}${lps(dv)}</b></td></tr></tbody></table></div></section>
   <div class="grid" style="margin-top:16px">
   <section class="card s6"${window.Chart?'':' hidden'}><div class="mph"><h3>Variación diaria</h3><div class="seg"><button data-cu="0" aria-pressed="${!mpChU}">Total del día</button><button data-cu="1" aria-pressed="${mpChU}">Por unidad</button></div></div><p class="cap">${mpChU?'Lempiras de más o de menos por cada unidad producida.':'Lempiras de más o de menos en el día.'} Arriba de cero: sobrecosto. Abajo: ahorro.</p><div style="height:240px"><canvas id="chMP"></canvas></div></section>

        +(rows.length>1?`<tr class="tot"><td><b>Todos</b></td><td class="r num">${fmt(T.u)}</td><td class="r num">${lpu(T.cR/T.u)}</td><td class="r num">${lpu(T.cF/T.u)}</td><td class="r num ${cls(dp)}"><b>${sg(T.cR/T.u-T.cF/T.u)}${lpu(T.cR/T.u-T.cF/T.u)}</b></td><td class="r num ${cls(dp)}">${(dp>0?'+':'')+pct(dp,1)}</td></tr>`:'')})()}

function renderMPpar(){const box=$('#mpb'),mp=SEED.mp,hoy=todayISO();const ed=mp.editar;

/* ===================== Exportar ===================== */
function elegirExcel(){const md=$('#modal');const desc=`${dmy(F.desde)} a ${dmy(F.hasta)} · ${F.eq?EQ[F.eq].nombre:'todos los grupos'} · ${F.tu?'Turno '+F.tu:'todos los turnos'}${F.cat?' · paros: '+catLabel().toLowerCase():''}`;
  md.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="xT" style="text-align:left"><h2 id="xT" style="text-align:center">Descargar Excel</h2><p style="text-align:center">¿Qué información quiere descargar?</p>
   <button class="opt" id="xF"><b>Solo lo filtrado</b><span>${esc(desc)}</span></button>
   <button class="opt" id="xA"><b>Toda la base de datos</b><span>Todos los registros de producción, cortes, no conformes, consumos y paros, sin filtros</span></button>
   <button class="btn ghost" id="xX">Cancelar</button></div>`;
  md.hidden=false;md.onclick=e=>{if(e.target===md)md.hidden=true};$('#xX').onclick=()=>md.hidden=true;
  $('#xF').onclick=()=>{md.hidden=true;exportXLSX('filtrado')};$('#xA').onclick=()=>{md.hidden=true;exportXLSX('todo')}}
async function exportXLSX(modo='filtrado'){
  if(!window.XLSX){toast('No se pudo cargar el generador de Excel.');return}
  const todo=modo==='todo';
  const wb=XLSX.utils.book_new(),c=todo?(()=>{const k=F;F={...F,desde:F.mes+'-01',hasta:diasMes(F.mes).slice(-1)[0],eq:'',tu:'',cat:null};const r=calc();F=k;return r})():calc();
  const res=[['DURACRETO · Control de Producción de Bloques'],['Periodo',dmy(F.desde)+' a '+dmy(F.hasta)],['Grupo',F.eq?EQ[F.eq].nombre:'Todos'],['Turno',F.tu||'Todos'],[],
   ['Indicador','Valor'],['Meta del mes (eq. B6")',Math.round(c.meta)],['Punto de equilibrio (eq. B6")',Math.round(c.equi)],['Producción acumulada del mes (eq. B6")',c.tot],['Cumplimiento de meta',+(c.tot/c.meta).toFixed(4)],['Proyección al cierre',Math.round(c.proy)],['Requerido por día hábil',Math.round(c.reqDia)],['Unidades producidas en el periodo',c.realSel],['Ciclos en el periodo',c.cicSel],['Índice de productividad',+c.idx.toFixed(4)]];
  if(todo){res.splice(1,3,['Contenido','Toda la base de datos (sin filtros)'],['Generado',dmy(todayISO())+' '+nowHM()],['Resumen de indicadores',`Mes de ${MESES[+F.mes.slice(5)-1].toLowerCase()} ${F.mes.slice(0,4)}, planta completa`])}
  else if(F.cat)res.splice(4,0,['Categorías de paro',catLabel()]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),'Resumen');
  for(const [k,d] of Object.entries(BDDEF)){const rows=todo?DB[k].slice().sort((a,b)=>a.registro.localeCompare(b.registro)):DB[k].filter(r=>inBD(k,r));const aoa=[d.cols.map(c=>c[0]),...rows.map(r=>d.cols.map(c=>c[1]==='foto'?(r.fotoData?'Foto adjunta':r.foto):c[1]==='cierre'?cierreTxt(r):cell(r,c)))];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),d.n)}
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'}),name=todo?`Produccion_Bloques_BD_completa_${todayISO()}.xlsx`:`Produccion_Bloques_${F.desde}_a_${F.hasta}.xlsx`;
  let dl=null;try{dl=window.claude?.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:new Blob([buf])});toast('Excel descargado.')}catch(e){if(e?.code!=='declined')toast('No se pudo descargar el archivo en esta vista.')}}
  else{try{XLSX.writeFile(wb,name)}catch(e){toast('La descarga no está disponible en esta vista.')}}
}
boot();
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>

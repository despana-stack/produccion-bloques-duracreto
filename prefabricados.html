<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prefabricados · Duracreto 360</title>
<meta name="theme-color" content="#12130F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<!--
  DURACRETO 360 · Módulo PREFABRICADOS (página propia, como ruta.html)
  Estado 17-nov-2026: primera versión completa (chat «Prefabricados»). Decisiones: claude/decisiones-prefabricados.md
  Reglas de plataforma (no cambiar sin el chat de Núcleo):
   - Misma sesión que Duracreto 360 (localStorage «dc_bloques_sesion_v2»): sin sesión o sin rol en Prefabricados → vuelve a ./
   - Rol del módulo = S.negocios.prefabricados (no S.rol, que es el de Bloques). Planta = S.plantas.prefabricados
   - Backend: mismo API_URL; acciones con prefijo «pref_» (Prefabricados.gs). Base propia: BD_Control_Prefabricados
   - Tema: «dc_bloques_tema». Marca: Poppins, #F9D600, #F49A29, #12130F. Estilos copiados de index.html (Bloques) para que se vea igual.
-->
<style>

/* Layout: banda negra de marca arriba; registro móvil en columna de 480px; dashboard en grilla de 12 col. */
:root{
  --ink:#12130F; --yellow:#F9D600; --orange:#F49A29; --brandgray:#A0A19F;
  --bg:#F4F4F1; --surface:#FFFFFF; --surface2:#ECECE7; --fg:#12130F; --muted:#66675F; --line:#DCDCD5;
  --accent:#F49A29; --accent-ink:#B5650A; --gold:#C9A800;
  --c-gra:#2a78d6; --c-bas:#eb6834; --c-cua:#1baf7a;
  --ok:#1F8A4C; --blue:#2563C9; --blue-bg:#E2ECFB; --warn:#C27C00; --bad:#C2372B; --ok-bg:#E3F3E9; --warn-bg:#FFF1D6; --bad-bg:#FBE3E0;
  --font:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --hero-a:#FFF0B8; --hero-b:#FFF9E3; --hero-c:#FFFFFF; --hero-line:#F1D96A; --hero-track:#EFE6C4; --hero-chip:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F100D; --surface:#1A1B17; --surface2:#24251F; --fg:#F2F2EE; --muted:#A3A49C; --line:#33342D;
  --accent:#F49A29; --accent-ink:#F7B867; --gold:#F9D600; --c-gra:#3987e5; --c-bas:#d95926; --c-cua:#199e70;
  --hero-a:#2E2913; --hero-b:#23211A; --hero-c:#1A1B17; --hero-line:#5A4E1C; --hero-track:#3A3626; --hero-chip:#24251F; --ok:#4CC27F; --blue:#6EA2F5; --blue-bg:#16253F; --warn:#F2B33D; --bad:#F06B5E; --ok-bg:#16301F; --warn-bg:#33270F; --bad-bg:#3A1A16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F100D; --surface:#1A1B17; --surface2:#24251F; --fg:#F2F2EE; --muted:#A3A49C; --line:#33342D;
  --accent:#F49A29; --accent-ink:#F7B867; --gold:#F9D600; --c-gra:#3987e5; --c-bas:#d95926; --c-cua:#199e70;
  --hero-a:#2E2913; --hero-b:#23211A; --hero-c:#1A1B17; --hero-line:#5A4E1C; --hero-track:#3A3626; --hero-chip:#24251F; --ok:#4CC27F; --blue:#6EA2F5; --blue-bg:#16253F; --warn:#F2B33D; --bad:#F06B5E; --ok-bg:#16301F; --warn-bg:#33270F; --bad-bg:#3A1A16; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{overscroll-behavior-y:contain;font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banda superior */
.top{background:#12130F;color:#F2F2EE;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:4px solid var(--yellow)}
.top .in{display:flex;align-items:center;gap:14px;padding-block:10px;max-width:1280px;margin:0 auto}
.top img{height:34px;width:auto;display:block}
.top .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.3;min-width:0}
.top .who b{display:block;font-size:13px;color:#F9D600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .out{background:transparent;border:1px solid #4a4b45;color:#F2F2EE;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:4px;max-width:1280px;margin:0 auto;overflow-x:auto;padding-bottom:0}
.tabs button{background:transparent;border:0;color:#B9BAB2;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#F9D600;border-bottom-color:#F9D600}

main{max-width:1280px;margin:0 auto;padding-block:20px 60px}
.col{max-width:480px;margin:0 auto}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .card{width:100%;max-width:400px;background:var(--surface);border-radius:20px;padding:28px 24px;border:1px solid var(--line)}
.login img{width:180px;display:block;margin:0 auto 22px}
.login h1{font-size:22px;text-align:center;margin-bottom:2px}
.login .eyebrow{text-align:center;margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.login p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lbl{font-weight:600;font-size:14px}
.field .hint{font-size:12px;color:var(--muted)}
.in-ctl{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font-size:17px}
.in-ctl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
select.in-ctl{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.in-ctl.bigNum{font-size:26px;font-weight:700;letter-spacing:.5px}
textarea.in-ctl{min-height:96px;resize:vertical}
.err .in-ctl,.err .choice-grid,.err .photo{border-color:var(--bad)!important}
.errmsg{color:var(--bad);font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;border:0;padding:0 20px;font-weight:700;font-size:16px;cursor:pointer}
.btn.primary{background:var(--yellow);color:#12130F;width:100%;font-size:18px;min-height:58px}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.small{min-height:38px;font-size:13px;padding:0 14px;border-radius:10px}
.btn:focus-visible,.tile:focus-visible,.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface2)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.fixedteam{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:12px;background:var(--surface2);padding:10px 14px;font-weight:600}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1.5px solid transparent;border-radius:14px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-height:58px;font-size:14px;font-weight:600;line-height:1.25}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);color:#12130F}
.choice[aria-pressed="true"] small{color:#3a3a33}
.choice.full{grid-column:1/-1}

.photo{border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.photo .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo img{border-radius:10px;max-height:220px;object-fit:cover;width:100%;display:block}
.fpw{position:relative}.scanov{display:none;position:absolute;inset:0;border-radius:10px;overflow:hidden;background:rgba(18,19,15,.38);background-image:linear-gradient(rgba(249,214,0,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(249,214,0,.13) 1px,transparent 1px);background-size:22px 22px}
.scanning .scanov{display:block}.scanning #fprev{filter:saturate(.6) brightness(.9)}
.scanov i{position:absolute;left:0;right:0;top:0;height:3px;background:#F9D600;box-shadow:0 0 22px 8px rgba(249,214,0,.65);animation:scanl 1.5s ease-in-out infinite alternate}
@keyframes scanl{from{top:2%}to{top:96%}}
.scanov b{position:absolute;width:26px;height:26px;border:3px solid #F9D600}.scanov .sc1{top:8px;left:8px;border-right:0;border-bottom:0}.scanov .sc2{top:8px;right:8px;border-left:0;border-bottom:0}.scanov .sc3{bottom:8px;left:8px;border-right:0;border-top:0}.scanov .sc4{bottom:8px;right:8px;border-left:0;border-top:0}
.scanov span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#12130F;color:#F9D600;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.scanov i{animation:none;top:50%}}
.verifbox{background:var(--bad-bg);color:var(--fg);border-radius:14px;padding:14px 16px;font-size:14px;margin-bottom:14px;border-left:5px solid var(--bad)}.verifbox.duda{background:var(--warn-bg);border-left-color:var(--warn)}.verifbox b.t{display:block;font-size:15.5px;margin-bottom:6px}.verifbox ul{margin:6px 0 4px;padding-left:18px}.verifbox li{margin:3px 0}.verifbox .note{font-size:12.5px}
.warnbox{background:var(--warn-bg);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;border-left:4px solid var(--warn)}

/* Inicio líder */
.hello{margin-bottom:18px}
.hello h2{font-size:22px}
.hello p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:16px;border:0;border-radius:18px;padding:18px;text-align:left;cursor:pointer;min-height:92px;background:var(--surface);border:1px solid var(--line)}
.tile .ic{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.tile .ic svg{width:30px;height:30px}
.tile b{display:block;font-size:17px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.t1{background:#12130F;color:#F2F2EE;border-color:#12130F}.tile.t1 span{color:#B9BAB2}.tile.t1 .ic{background:var(--yellow);color:#12130F}
.tile.t2 .ic{background:var(--orange);color:#12130F}
.tile.t3 .ic{background:var(--surface2);color:var(--fg)}
.tile.t4 .ic{background:var(--bad-bg);color:var(--bad)}
.tile.t5{background:#F9D600;color:#12130F;border-color:#F9D600}.tile.t5 span{color:#3d3a1f}.tile.t5 .ic{background:#12130F;color:#F9D600}
.uw{position:relative}.uw .in-ctl{padding-right:58px}.uw .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--muted);pointer-events:none}
.tolvas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tolvas .tv label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.tolvas select{font-size:14px;padding-left:8px;padding-right:22px}
@media(max-width:420px){.tolvas{grid-template-columns:1fr}}
.lch{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.lcbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:14px}
.lcrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:15px}.lcrow:last-child{border-bottom:0}.lcrow b{font-size:18px;white-space:nowrap}
.lcrow.duda{flex-direction:column;align-items:stretch;background:var(--warn-bg);margin:6px -14px;padding:12px 14px;border-radius:12px;border-bottom:0}.lcrow small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.lcrow .choice-grid{grid-template-columns:1fr 1fr;margin-top:8px}.lcrow .choice{text-align:center;font-size:17px;font-weight:800}
.lcfoto{width:100%;border-radius:14px;margin:0 0 14px;border:1px solid var(--line)}
.matgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.matgrid .field label{min-height:2.6em;display:flex;align-items:flex-end}
.recent{margin-top:26px}
.metacard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.metacard .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.metacard .mh .lbl{font-size:13px}
.mbar{position:relative;height:18px;border-radius:8px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:8px;transition:width .6s}
.mpct{font-size:42px;font-weight:800;line-height:1;margin:2px 0 12px}
.mf{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:16px;color:var(--muted)}
.mf b{color:var(--fg);font-size:22px}
.ncsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ncsum div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.ncsum b{display:block;font-size:22px}
.ncsum span{font-size:11.5px;color:var(--muted)}
.minibars{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:16px}
.minibars div{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.minibars b{text-align:right}
table.qc td{white-space:normal;vertical-align:middle}
.recent h3{font-size:14px;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.recent li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.recent ul{margin:0;padding:0}

.formhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.formhead button{border:0;background:var(--surface2);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:20px;flex:none}
.formhead h2{font-size:20px}
.formhead p{margin:0;color:var(--muted);font-size:12px}

/* Éxito */
.done{text-align:center;padding-block:30px}
.done .ok{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 16px;color:#fff}
.done h2{font-size:24px}
.done .folio{display:inline-block;margin:10px 0 18px;background:var(--surface2);border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;margin-bottom:18px}
.summary div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.summary div:last-child{border-bottom:0}
.gauge{margin:6px auto 20px;max-width:360px}
.gauge .big{font-size:56px;font-weight:800;line-height:1}
.pill{display:inline-block;white-space:nowrap;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* Dashboard */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:18px}
.filters .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.filters label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filters select,.filters input{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:14px}
.filters .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.msel{position:relative}.msel summary{list-style:none;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 34px 6px 10px;font-size:14px;cursor:pointer;white-space:nowrap;min-width:190px;position:relative}
.msel summary::-webkit-details-marker{display:none}.msel summary::after{content:'';position:absolute;right:12px;top:16px;border:5px solid transparent;border-top-color:var(--muted)}
.msel[open] summary{border-color:var(--fg)}
.msel .mp{position:absolute;z-index:30;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;min-width:260px}
.msel .ma{display:flex;gap:6px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}.msel .ma button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:8px;padding:7px 6px;font:600 12.5px var(--font);cursor:pointer}
.msel .mp label{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer}.msel .mp label:hover{background:var(--surface2)}
.msel .mp input{width:18px;height:18px;min-height:0;accent-color:#12130F;margin:0}
.dlg .btn+.btn{margin-top:8px}.dlg .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit}.dlg .opt b{display:block;font-size:15.5px}.dlg .opt span{font-size:13px;color:var(--muted)}.dlg .opt:hover{border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:15px;margin-bottom:2px}
.card .cap{font-size:12px;color:var(--muted);margin:0 0 12px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:980px){.s8,.s7,.s6,.s5{grid-column:span 12}.s4,.s3{grid-column:span 6}}
@media (max-width:560px){.s4,.s3{grid-column:span 12}}

.hero{background:linear-gradient(100deg,var(--hero-a) 0%,var(--hero-b) 45%,var(--hero-c) 100%);border:1px solid var(--hero-line);border-top:6px solid var(--yellow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px 40px;align-items:center}
.hero .hh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .kpi{font-size:clamp(38px,5vw,54px);font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:6px}
.hero .kpi small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero .st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .st div{background:var(--hero-chip);box-shadow:0 1px 0 var(--hero-line);border-radius:12px;padding:10px 14px;min-width:0}
.hero .st b{display:block;font-size:21px;font-weight:700;line-height:1.2}
.hero .st span{font-size:12px;color:var(--muted)}
.prog{grid-column:1/-1;position:relative;height:18px;border-radius:9px;background:var(--hero-track);margin:22px 0 22px}
.prog .fill{position:absolute;inset:0 auto 0 0;border-radius:9px}
.prog .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg)}
.prog .mk span{position:absolute;top:22px;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}

.ment{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
.ment .tm{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.ment .tm i{width:12px;height:12px;border-radius:50%;flex:none}
.ment .card{display:flex;flex-direction:column;gap:6px}
.ment .mh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ment .mh svg{width:18px;height:18px;color:var(--accent-ink)}
.ment b.v{font-size:22px}
/* Botón de información */
.ih{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative}
.ih h3{margin:0}
.info{position:relative;display:inline-block}
.info summary{list-style:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:12px;font-weight:700;font-style:italic;font-family:Georgia,serif;display:grid;place-items:center;cursor:pointer;user-select:none}
.info summary::-webkit-details-marker{display:none}
.info[open] summary{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.info .ib{position:absolute;left:-8px;top:28px;z-index:15;width:min(340px,80vw);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.demo-flag{background:var(--warn-bg);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:14px}
/* ===== Plataforma: menú ☰, negocio actual y «Próximamente» ===== */
.top{border-bottom-color:var(--mc,#F9D600)}
.hb{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid #4a4b45;background:transparent;color:#F2F2EE;display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.hb svg{width:20px;height:20px}.hb .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #12130F}
.crumb{background:#1d1e19;color:#B9BAB2;font-size:12.5px}
.crumb .in2{display:flex;align-items:center;gap:8px;padding-block:7px;max-width:1280px;margin:0 auto;min-width:0}
.crumb b{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--mc,#F9D600);color:var(--mci,#12130F);font:inherit;font-weight:700;font-size:11.5px;border:0;border-radius:999px;padding:2px 10px 2px 3px;cursor:default}
.mchip.sel{cursor:pointer}.mchip .bz{width:18px;height:18px;border-radius:50%;font-size:10px;background:rgba(255,255,255,.55);color:#12130F}
.bz{display:inline-grid;place-items:center;flex:none;border-radius:9px;font-weight:800;font-size:13px;width:32px;height:32px}
.mnu{position:fixed;inset:0;z-index:50}
.mnu-sh{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:mnuF .18s ease}
.mnu-p{position:absolute;top:0;bottom:0;left:0;width:min(86vw,330px);background:var(--surface);color:var(--fg);display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.3);animation:mnuS .2s ease;padding-top:env(safe-area-inset-top,0px)}
@keyframes mnuS{from{transform:translateX(-100%)}}@keyframes mnuF{from{opacity:0}}
.mnu-h{background:#12130F;color:#F2F2EE;padding:16px 14px 14px 16px;border-bottom:4px solid var(--mc,#F9D600);display:flex;align-items:flex-start;gap:10px}
.mnu-h b{display:block;font-size:15px}.mnu-h span{display:block;font-size:12px;color:#B9BAB2}
.mnu-x{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #4a4b45;background:transparent;color:#F2F2EE;font-size:20px;line-height:1;cursor:pointer}
.mnu-b{flex:1;overflow-y:auto;padding:6px 10px 10px;overscroll-behavior:contain}
.mnu-lb{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 8px 7px}
.neg-cur{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.neg-cur b{display:block;font-size:14.5px}.neg-cur small{display:block;font-size:11px;color:var(--muted)}
.neg-cur .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.neg-cur[aria-expanded="true"]{border-color:var(--orange);border-radius:12px 12px 0 0}.neg-cur[aria-expanded="true"] .chev{transform:rotate(180deg)}
.neg-list{border:1.5px solid var(--orange);border-top:0;border-radius:0 0 12px 12px;padding:6px;background:var(--surface)}
.neg-opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:transparent;border:0;border-radius:10px;padding:8px;cursor:pointer;margin-top:4px}
.neg-opt:first-child{margin-top:0}
.neg-opt b{display:block;font-size:14px}.neg-opt small{display:block;font-size:11px;color:var(--muted)}
.neg-opt.on{background:var(--hero-a)}.neg-opt.on b{font-weight:800}.neg-opt .chk{margin-left:auto;color:var(--ok);font-weight:800}
.neg-opt.px{opacity:.92}.neg-opt.px .bz{filter:saturate(.75)}
.neg-opt.px:not(:first-child){margin-top:14px}
.prox{position:absolute;right:8px;top:-9px;background:#12130F;color:#F9D600;font-size:9.5px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:proxB 2.4s ease-in-out infinite;pointer-events:none}
.prox::after{content:"";position:absolute;left:14px;bottom:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#12130F}
:root[data-theme="dark"] .prox{background:#F9D600;color:#12130F}:root[data-theme="dark"] .prox::after{border-top-color:#F9D600}
@keyframes proxB{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:500;color:var(--fg);background:transparent;border:0;border-radius:10px;padding:10px 10px;cursor:pointer}
.mi svg{width:19px;height:19px;color:var(--muted);flex:none}
.mi[aria-current="page"]{background:var(--hero-a);font-weight:700;box-shadow:inset 3px 0 0 var(--orange)}.mi[aria-current="page"] svg{color:var(--fg)}
.mi .badge{position:static;margin-left:auto}
.mi .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 9px}
.mi .st{margin-left:auto;font-size:12px;color:var(--muted)}
.mi .sw{margin-left:auto;width:36px;height:21px;border-radius:999px;background:var(--surface2);position:relative;flex:none;border:1px solid var(--line)}
.mi .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.mi .sw.on{background:var(--ok);border-color:var(--ok)}.mi .sw.on::after{left:17px}
.mi.out,.mi.out svg{color:var(--bad)}
.mnu-sep{height:1px;background:var(--line);margin:10px 6px}
.mnu-f{font-size:11px;color:var(--muted);text-align:center;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px))}
:root[data-theme="dark"] .bz{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.prox-dlg .av{width:150px;height:150px;margin:-6px auto 8px}.prox-dlg .av svg{width:100%;height:100%;display:block}
.prox-dlg .pt{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:8px;background:var(--mc);color:var(--mci)}
.prox-dlg p{color:var(--fg)}.prox-dlg .firma{font-size:12px;color:var(--muted);margin:-8px 0 16px}
/* ===== Escritorio: encabezado de una fila y menú fijo ===== */
.top .brand,.top .crumb-d,.top .ini{display:none}
@media (min-width:1024px){
 .top .in{max-width:none;padding:10px 24px;gap:16px;min-height:68px}
 .top .in>img{height:46px}
 .top .brand{display:flex;flex-direction:column;justify-content:center;padding-left:16px;border-left:1px solid #3a3b34;line-height:1.2;white-space:nowrap}
 .top .brand b{font-size:15px;color:#fff;letter-spacing:.01em}.top .brand span{font-size:11.5px;color:#9FA098}
 .top .crumb-d{display:flex;align-items:center;gap:10px;margin-left:12px;padding:6px 6px 6px 6px;background:#1d1e19;border:1px solid #2e2f29;border-radius:999px;color:#B9BAB2;font-size:13px;min-width:0}
 .top .crumb-d b{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
 .top .crumb-d .mchip{font-size:12.5px;padding:3px 12px 3px 4px}.top .crumb-d .mchip .bz{width:20px;height:20px}
 .top .ini{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--mc,#F9D600);color:#12130F;font-weight:800;font-size:14px}
 .top .who{font-size:12.5px}.top .who b{font-size:13.5px}
 .top+.crumb,.crumb{display:none}
 html.mnu-fijo{--sbw:288px}
 html.mnu-fijo #app{padding-left:var(--sbw)}
 html.mnu-fijo #app>header.top{margin-left:calc(-1*var(--sbw))}
 html.mnu-fijo .mnu{inset:auto;top:var(--hh,68px);left:0;bottom:0;width:var(--sbw);z-index:15}
 html.mnu-fijo .mnu-sh{display:none}
 html.mnu-fijo .mnu-p{position:static;width:100%;height:100%;box-shadow:none;border-right:1px solid var(--line);animation:none;padding-top:0}
 html.mnu-fijo .mnu-h{border-bottom-width:1px;border-bottom-color:#2e2f29;padding:14px 12px 12px 16px}
 html.mnu-fijo .hb{background:#2b2c26;border-color:#5a5b54}
}
.dlg.mig{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px}
.mig .app360{width:58px;height:58px;border-radius:14px;margin:0 auto 8px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mig h2{font-size:18px}.mig p{color:var(--fg);font-size:13.5px;margin-bottom:12px}
.mig ol{text-align:left;margin:0 0 14px;padding-left:22px;font-size:13.5px;line-height:1.4}.mig li{margin:0 0 5px}
.mig .url{display:block;font-size:12.5px;background:var(--surface2);border-radius:10px;padding:8px 10px;margin:0 0 10px;word-break:break-all;color:var(--fg);user-select:all;-webkit-user-select:all}
.mig .cred{background:var(--hero-a);border-radius:10px;padding:2px 8px;font-weight:700}
.mig .btn+.btn{margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Agregados del módulo Prefabricados (mismo lenguaje visual que Bloques) ===== */
.fam{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.fam>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:15px}
.fam>summary::-webkit-details-marker{display:none}
.fam>summary .n{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.fam>summary .chev{color:var(--muted);transition:transform .15s}.fam[open]>summary .chev{transform:rotate(180deg)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.prow b{display:block;font-weight:600;font-size:14.5px}.prow small{display:block;font-size:11.5px;color:var(--muted)}
.prow .in-ctl{min-height:46px;text-align:center;font-weight:700;font-size:18px;padding:8px}
.prow.has{background:color-mix(in srgb,var(--yellow) 12%,var(--surface))}
.totbar{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:8px}
.totbar .tt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:13px;color:var(--muted)}
.totbar .tt b{font-size:22px;color:var(--fg)}
.plsel{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.plsel button{border:0;background:transparent;font:inherit;font-weight:600;font-size:13px;color:var(--muted);border-radius:9px;padding:8px 14px;cursor:pointer}
.plsel button.on{background:#12130F;color:#F9D600}
html[data-theme="dark"] .plsel button.on{background:#F9D600;color:#12130F}
.lib{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.lib div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--surface)}
.lib div.hoy{border:2px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,var(--surface))}
.lib b{display:block;font-size:20px}.lib span{font-size:11px;color:var(--muted);display:block}
@media(max-width:560px){.lib{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pbars .r{display:grid;grid-template-columns:170px minmax(0,1fr) 84px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.pbars .r:last-child{border-bottom:0}
.pbars .tr{display:flex;flex-direction:column;gap:3px}.pbars .tr i{display:block;height:9px;border-radius:0 4px 4px 0;min-width:1px}
@media(max-width:560px){.pbars .r{grid-template-columns:105px minmax(0,1fr) 70px}}
.dcols{display:flex;align-items:flex-end;gap:4px;height:240px;padding-top:16px;overflow-x:auto}
.dcols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:14px}
.dcols .c i{width:100%;max-width:30px;background:var(--yellow);border-radius:5px 5px 0 0}
.dcols .c.z i{background:var(--line)}
.dcols .c span{font-size:10px;color:var(--muted)}.dcols .c em{font-style:normal;font-size:10px;font-weight:700}
.inc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.inc .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.inc p{margin:6px 0 0;font-size:13.5px}.inc .segt{display:block;white-space:pre-line;font-size:12.5px;color:var(--muted);margin-top:8px;border-left:3px solid var(--line);padding-left:10px}
.dlg.form{text-align:left;max-width:440px}
.dlg.form .field{margin-bottom:12px}
@media(max-width:560px){.hm{display:none}}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.lnk{color:var(--accent-ink);font-weight:600;text-decoration:none}
@media print{.top,.mnu,.dnav,.no-print,#toast{display:none!important}html.mnu-fijo #app{padding-left:0}body{background:#fff}.card{break-inside:avoid}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SS='dc_bloques_sesion_v2',THM='dc_bloques_tema',MOD='dc_plataforma_modulo',MFIJO='dc_plataforma_menu_fijo',NEG='prefabricados',TABK='dc_pref_tab',PLK='dc_pref_planta';
const API_URL=String(window.API_URL||'').trim();
let S=store.get(SS);
const ROL=()=>String((S&&S.negocios&&S.negocios[NEG])||'');
if(!S||!S.token||!ROL())location.replace('./');
async function api(action,payload={}){let r;
  try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:S&&S.token},payload))})}catch(e){throw new Error('Sin conexión. Revise el internet e intente de nuevo.')}
  let j;try{j=await r.json()}catch(e){throw new Error('El servidor no respondió bien. Intente de nuevo.')}
  if(!j.ok&&j.error==='sesion'){store.del(SS);location.replace('./');throw new Error('sesion')}return j}

const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const pct=(a,b)=>b?(a/b*100):0;
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dOf=iso=>{const p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(iso,n)=>{const d=dOf(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const dmy=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const dm=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
const diaN=iso=>DIAS[dOf(iso).getDay()];
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mesN=ym=>cap1(MESES[Number(ym.slice(5,7))-1])+' '+ym.slice(0,4);
const finMes=ym=>isoOf(new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0,12));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3600)}
function temaActual(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function aplicarTema(){const t=store.get(THM);if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
aplicarTema();

const bz=(l,bg,c)=>`<span class="bz" style="background:${bg};color:${c}" aria-hidden="true">${l}</span>`;

/* ===================== Datos derivados ===================== */
function prodDe(f0,f1,pl,{ins=false,fam=''}={}){const M=CATM();return D.prod.filter(r=>r.f>=f0&&r.f<=f1&&enPlanta(r.pl,pl)&&M[r.id]&&!!M[r.id].ins===ins&&(!fam||M[r.id].f===fam))}
const suma=(a,k='q')=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
function enCurado(dia,pl){const M=CATM();return D.prod.filter(r=>M[r.id]&&!M[r.id].ins&&enPlanta(r.pl,pl)&&r.f<=dia&&r.lib>dia)}
function liberadoEl(dia,pl){const M=CATM();return D.prod.filter(r=>M[r.id]&&!M[r.id].ins&&enPlanta(r.pl,pl)&&r.lib===dia)}
function agrupar(arr,k='id'){const o={};arr.forEach(r=>o[r[k]]=(o[r[k]]||0)+r.q);return o}
function ultimoDiaHabil(hoy){let d=addD(hoy,-1);while(dOf(d).getDay()===0)d=addD(d,-1);return d}

/* ===================== Armazón (igual que Bloques) ===================== */
function tabs(){const t=[];if(can('prod')||can('nc')||can('inc'))t.push(['registro','Registro','reg']);if(can('rep'))t.push(['rep','Reporte del día','rep']);if(can('dash'))t.push(['dash','Dashboard','dash']);if(can('plan')||can('seg'))t.push(['plan','Plan correctivo','plan']);if(can('bd'))t.push(['bd','Bases de datos','bd']);return t}
function menuFijo(){return escritorio()&&store.get(MFIJO)!==false}
function negociosMenu(){const n=Object.assign({},S.negocios||{}),out=[];
  if(n.bloques||S.rol)out.push({id:'bloques',nom:'Bloques',l:'B',bg:'#F9D600',c:'#12130F',ir:()=>{store.set(MOD,'bloques');location.href='./'}});
  out.push({id:'prefabricados',nom:'Prefabricados',l:'P',bg:'#12130F',c:'#F9D600',cur:true});
  if(n.trituracion)out.push({id:'trituracion',nom:'Trituración',l:'T',bg:'#F49A29',c:'#12130F',prox:true});
  if(n.concreto)out.push({id:'concreto',nom:'Concreto',l:'C',bg:'#A0A19F',c:'#12130F',prox:true});
  if(S.ruta)out.push({id:'ruta',nom:'Ruta 360',l:'R',bg:'#F49A29',c:'#12130F',ir:()=>{location.href='ruta.html'}});
  return out}

  const chip=`<button class="mchip sel" data-mchip style="--mc:#12130F;--mci:#F9D600;box-shadow:0 0 0 1px #F9D600 inset" aria-label="Negocio actual: Prefabricados. Cambiar de negocio">${bz('P','#12130F','#F9D600')}Prefabricados ▾</button>`;

  document.documentElement.classList.toggle('mnu-fijo',fijo);
  $('#app').innerHTML=`<header class="top"><div class="in wrap"><button class="hb" id="hb" aria-label="Abrir menú" aria-controls="mnu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button><img src="${LOGO_D}" alt="Duracreto"><div class="brand"><b>Duracreto 360</b><span>Plataforma de operaciones</span></div><div class="crumb-d">${chip}<span aria-hidden="true">›</span><b>${secc}</b></div><div class="who"><b>${esc(grupo)}</b>${esc(S.nombre||'')}</div><span class="ini" aria-hidden="true" style="background:#F9D600">${esc(String(S.nombre||'?').trim()[0]||'?')}</span><button class="thm ref" id="refb" aria-label="Actualizar" title="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg></button></div>
  <div class="crumb"><div class="in2 wrap">${chip}<span aria-hidden="true">›</span><b>${secc}</b></div></div></header>
  <div class="mnu" id="mnu" ${fijo||menuAbierto?'':'hidden'}><div class="mnu-sh" data-mclose></div><nav class="mnu-p" aria-label="Menú">
   <div class="mnu-h" style="--mc:#12130F"><div><b>${esc(S.nombre||'')}</b><span>${esc(S.cargo||ROLNOM[D.rol]||'')}${plantaUsr()?' · '+esc(plantaUsr()):''}</span></div><button class="mnu-x" data-mclose aria-label="Cerrar menú" title="Cerrar menú">×</button></div>
   <div class="mnu-b"><div class="mnu-lb">Negocio</div><button class="neg-cur" id="negCur" aria-expanded="false" aria-controls="negList">${bz('P','#12130F','#F9D600')}<span><b>Prefabricados</b><small>Cambiar de negocio</small></span><span class="chev" aria-hidden="true">▾</span></button>
   <div class="neg-list" id="negList" hidden>${negs.map((m,i)=>`<button class="neg-opt ${m.cur?'on':''} ${m.prox?'px':''}" data-neg="${i}" ${m.cur?'aria-current="true"':''}>${bz(m.l,m.bg,m.c)}<span><b>${m.nom}</b><small>${m.cur?'Está aquí':m.prox?'En construcción':'Abrir'}</small></span>${m.cur?'<span class="chk">✓</span>':m.prox?'<span class="prox">Próximamente</span>':''}</button>`).join('')}</div>
   <div class="mnu-lb">Secciones de Prefabricados</div>
   ${T.map(([id,n,ic])=>`<button class="mi" data-tab="${id}" ${id===tab?'aria-current="page"':''}>${IC[ic]}<span>${n}</span></button>`).join('')}
   <div class="mnu-sep"></div>
   <button class="mi" id="mThm" role="switch" aria-checked="${temaActual()==='dark'}">${IC.moon}<span>Modo oscuro</span><span class="sw ${temaActual()==='dark'?'on':''}" aria-hidden="true"></span></button>
   <button class="mi" id="mHome">${IC.home}<span>Inicio de Duracreto 360</span></button>

  <main class="wrap" id="main"></main>`;
  document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');
  conectarMenu();
  ({registro:renderRegistro,rep:renderRep,dash:renderDash,plan:renderPlan,bd:renderBD})[tab]();
  if(menuAbierto&&!escritorio())document.body.style.overflow='hidden';else{document.body.style.overflow='';window.scrollTo(0,0)}
}
function abrirMenu(si){if(escritorio()){store.set(MFIJO,si);menuAbierto=false;render();return}menuAbierto=si;$('#mnu').hidden=!si;document.body.style.overflow=si?'hidden':''}
function conectarMenu(){
  $('#hb').onclick=()=>abrirMenu(escritorio()?!menuFijo():true);
  document.querySelectorAll('[data-mclose]').forEach(b=>b.onclick=()=>abrirMenu(false));
  document.querySelectorAll('[data-mchip]').forEach(c=>c.onclick=()=>{if(escritorio()&&!menuFijo())store.set(MFIJO,true);menuAbierto=!escritorio();render();$('#negList').hidden=false;$('#negCur').setAttribute('aria-expanded','true')});
  $('#negCur').onclick=()=>{const l=$('#negList');l.hidden=!l.hidden;$('#negCur').setAttribute('aria-expanded',String(!l.hidden))};
  const negs=negociosMenu();document.querySelectorAll('[data-neg]').forEach(b=>b.onclick=()=>{const m=negs[Number(b.dataset.neg)];if(m.cur){$('#negList').hidden=true;return}if(m.prox){toast(m.nom+' está en construcción.');return}m.ir()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{menuAbierto=false;tab=b.dataset.tab;view='home';render()});
  $('#mThm').onclick=()=>{store.set(THM,temaActual()==='dark'?'light':'dark');aplicarTema();render()};
  $('#mHome').onclick=()=>{location.href='./'};
  $('#mOut').onclick=()=>{api('logout').catch(()=>{});store.del(SS);location.replace('./')};
  $('#refb').onclick=async()=>{if(view!=='home'&&!confirm('Se borrará lo que lleva escrito en el formulario. ¿Actualizar?'))return;$('#refb').classList.add('spin');await recargar();render()};
}
let _esc=escritorio();addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(()=>{if(!D||escritorio()===_esc)return;_esc=escritorio();menuAbierto=false;if(view==='home')render();else document.documentElement.classList.toggle('mnu-fijo',menuFijo())},200)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)cerrarModal();else if(menuAbierto&&!escritorio())abrirMenu(false)}});

const plantaSel=(fn,todas=true)=>`<div class="plsel" role="group" aria-label="Planta">${D.plantas.map(p=>`<button class="${PL===p?'on':''}" data-pl="${esc(p)}">${esc(p)}</button>`).join('')}${todas?`<button class="${PL===''?'on':''}" data-pl="">Ambas</button>`:''}</div>`;
function conectarPlanta(fn){document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{PL=b.dataset.pl;store.set(PLK,PL);fn()})}
const plTxt=()=>PL||'Ambas plantas';

/* ===================== Registro ===================== */
function renderRegistro(){
  if(view==='prod')return formProd();if(view==='nc')return formNC();if(view==='inc')return formInc();
  const h=new Date().getHours(),pl=plantaUsr(),hoy=D.hoy;
  const reps=D.rep.filter(r=>enPlanta(r.pl,pl)).sort((a,b)=>b.f.localeCompare(a.f)).slice(0,3);
  const ult=ultimoDiaHabil(hoy),falta=can('prod')&&pl&&!D.rep.some(r=>r.pl===pl&&r.f===ult);
  const libHoy=suma(liberadoEl(hoy,pl)),libMan=suma(liberadoEl(addD(hoy,1),pl)),cur=suma(enCurado(hoy,pl));
  $('#main').innerHTML=`<div class="col"><div class="hello"><h2>${h<12?'Buenos días':h<18?'Buenas tardes':'Buenas noches'}, ${esc(String(S.nombre||'').split(/\s+/)[0])}</h2>
   <p>Prefabricados · ${esc(pl||'todas las plantas')} · ${diaN(hoy)} ${dmy(hoy)}</p></div>
   ${falta?`<div class="warnbox">Falta el reporte de producción del ${diaN(ult)} ${dmy(ult)}.</div>`:''}
   <div class="tiles">
    ${can('prod')?`<button class="tile t1" data-f="prod"><div class="ic">${IC.prod}</div><div><b>Reporte de producción</b><span>Totales del día por producto, según la hoja del personal</span></div></button>`:''}
    ${can('inc')?`<button class="tile t4" data-f="inc"><div class="ic">${IC.inc}</div><div><b>Registrar incidencia</b><span>Moldes, equipo, materiales, energía o personal</span></div></button>`:''}
    ${can('nc')?`<button class="tile t3" data-f="nc"><div class="ic">${IC.nc}</div><div><b>Producto no conforme</b><span>Mandar a segunda o desechar piezas</span></div></button>`:''}
   </div>
   <div class="recent"><h3>Producción · últimos reportes</h3><ul>${reps.length?reps.map(r=>`<li><span>${dmy(r.f)} · ${diaN(r.f)}${pl?'':' · '+corto(r.pl)}</span><b class="num">${fmt(r.q)} piezas</b></li>`).join(''):'<li><span>Todavía no hay reportes.</span></li>'}</ul>
   <h3 style="margin-top:18px">Liberación para despacho</h3><ul><li><span>Hoy ${dm(hoy)}</span><b class="num">${fmt(libHoy)} piezas</b></li><li><span>Mañana ${dm(addD(hoy,1))}</span><b class="num">${fmt(libMan)} piezas</b></li><li><span>Quedan en curado</span><b class="num">${fmt(cur)} piezas</b></li></ul></div></div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view=b.dataset.f;render()});
}
function formHead(t,s){return`<div class="formhead"><button id="back" type="button" aria-label="Volver">←</button><div><h2>${t}</h2><p>${s}</p></div></div>`}
function campoPlanta(id){const pl=plantaUsr();if(pl&&!can('todas'))return`<div class="field"><span class="lbl">Planta</span><div class="fixedteam"><span class="chip"><span class="dot" style="background:#12130F;box-shadow:0 0 0 2px #F9D600"></span>Prefabricados ${esc(pl)}</span><span class="note">Reporta: ${esc(S.nombre||'')}</span></div></div>`;
  return`<div class="field" data-k="planta"><label for="${id}">Planta</label><select class="in-ctl" id="${id}">${D.plantas.map(p=>`<option ${p===(pl||PL)?'selected':''}>${esc(p)}</option>`).join('')}</select></div>`}
const plantaForm=id=>{const e=$('#'+id);return e?e.value:plantaUsr()};
const minFecha=()=>can('todas')||D.rol==='SUPERVISOR'?'':addD(D.hoy,-D.diasLider);
function volver(){view='home';render()}
function marcarErr(k,msg){const f=document.querySelector(`[data-k="${k}"]`);if(f){f.classList.add('err');f.scrollIntoView({behavior:'smooth',block:'center'})}toast(msg)}
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('.field.err');if(f)f.classList.remove('err')});
async function enviar(btn,accion,rec,ok){btn.disabled=true;const t=btn.textContent;btn.textContent='Cargando…';
  try{const j=await api(accion,{rec});if(!j.ok)throw new Error(j.error||'No se pudo cargar');await recargar();view='home';render();toast(ok(j))}
  catch(e){if(e.message!=='sesion'){toast(e.message);btn.disabled=false;btn.textContent=t}}}

function formProd(){
  const pl0=plantaUsr()||PL||D.plantas[0];
  $('#main').innerHTML=`<div class="col">${formHead('Reporte de producción','Totales del día')}<form id="ff" novalidate>
   <div class="field" data-k="fecha"><label for="fecha">Fecha de producción</label><input class="in-ctl" type="date" id="fecha" value="${D.hoy}" max="${D.hoy}" ${minFecha()?`min="${minFecha()}"`:''}><span class="hint">Cada producto queda «en curado» y pasa a disponible en Ruta 360 cuando cumple sus días de curado.</span></div>
   ${campoPlanta('planta')}<div id="aviso"></div>
   <div class="field" style="margin-bottom:8px"><span class="lbl">Piezas producidas</span><span class="hint">Escriba solo lo que se produjo; lo demás se deja vacío.</span></div>
   <div id="fams"></div>
   <div class="field" style="margin-top:6px"><span class="lbl">Foto de la hoja de producción (opcional)</span>${fotoHTML('La hoja que entrega el personal, como respaldo.')}</div>
   <div class="field"><label for="obs">Observación (opcional)</label><textarea class="in-ctl" id="obs" placeholder="Ej. se armaron mallas para el tubo de 30&quot; de mañana"></textarea></div>
   <div class="totbar"><div class="tt"><span id="totk">Total del día</span><b class="num" id="tot">0 piezas</b></div><button class="btn primary" type="submit" id="send">Cargar</button></div></form></div>`;
  $('#back').onclick=volver;conectarFoto();
  const pintar=()=>{const f=$('#fecha').value,pl=plantaForm('planta');
    const prev=D.rep.find(r=>r.f===f&&r.pl===pl),vals=prev?agrupar(D.prod.filter(r=>r.r===prev.r)):{};
    $('#aviso').innerHTML=prev?`<div class="warnbox">Ya hay un reporte del ${dmy(f)} (${fmt(prev.q)} piezas, cargado por ${esc(prev.n)} el ${dmy(prev.ts.slice(0,10))} ${prev.ts.slice(11)}). Abajo están sus cantidades: si carga de nuevo, <b>lo reemplaza</b>.</div>`:'';
    if(prev&&prev.obs&&!$('#obs').value)$('#obs').value=prev.obs;
    const fams=[];CAT().forEach(c=>{let g=fams.find(x=>x.f===c.f);if(!g)fams.push(g={f:c.f,ins:c.ins,it:[]});g.it.push(c)});
    fams.sort((a,b)=>a.ins-b.ins);
    $('#fams').innerHTML=fams.map(g=>{const t=suma(g.it.map(c=>({q:vals[c.id]||0})));
      return`<details class="fam" ${t||(!prev&&g.f!=='Pretensados'&&!g.ins)?'open':''}><summary>${esc(g.f)}<span class="n">${g.ins?'insumo · no suma':t?fmt(t)+' piezas':'—'}</span><span class="chev">▾</span></summary>

  <div class="grid">
   <section class="card hero s12"><div><div class="hh"><h3>Producción · ${DS.mes?mesN(DS.mes):dmy(DS.desde)+' al '+dmy(DS.hasta)}</h3><span class="pill blue">Meta por definir</span></div>
    <p class="cap" style="margin:2px 0 0">${esc(plTxt())}${DS.fam?' · '+esc(DS.fam):''} · piezas terminadas, sin mallas · del ${dmy(DS.desde)} al ${dmy(DS.hasta)}</p>
    <div class="kpi num">${fmt(tot)} <small>piezas en ${nd} día${nd===1?'':'s'} de producción</small></div></div>
    <div class="st num"><div><b>${nd?fmt(tot/nd):'–'}</b><span>Promedio por día producido</span></div><div><b>${verDesp?fmt(totD):'–'}</b><span>${verDesp?'Despachado (Ruta 360)':'Despachado: Ruta 360 aún no separa planta'}</span></div>
    <div><b style="color:${!verDesp||!totD?'inherit':tot<totD?'var(--accent-ink)':'var(--ok)'}">${verDesp&&totD?Math.round(pct(tot,totD))+'%':'–'}</b><span>Producido ÷ despachado</span></div><div><b>${fmt(cur)}</b><span>En curado hoy</span></div></div></section>
   <div class="card s3 tile-k kc"><div class="kt"><span class="l">Piezas producidas</span></div><span class="v num">${fmt(tot)}</span><span class="l">${nd} días · ${Object.keys(pp).length} productos</span></div>

   <div class="card s3 tile-k kc"><div class="kt"><span class="l">Mallas armadas</span></div><span class="v num">${fmt(suma(mallas))}</span><span class="l">Insumo de tubería · no suma</span></div>
   <section class="card s7"><h3>Producción diaria</h3><p class="cap">Piezas terminadas por día. Domingos en gris.</p>
    <div class="dcols">${serie.map(([d,v])=>`<div class="c ${v?'':'z'}" title="${dmy(d)}: ${fmt(v)}"><em class="num">${v?fmt(v):''}</em><i style="height:${v?Math.max(3,v/smx*190):3}px;${dOf(d).getDay()===0?'opacity:.35':''}"></i><span>${+d.slice(8)}</span></div>`).join('')}</div></section>
   <section class="card s5"><h3>Por familia</h3><p class="cap">Piezas en el periodo · producido / despachado</p>
    <div class="legend"><span><i style="background:var(--fg);height:10px;width:10px"></i>Producido</span>${verDesp?'<span><i style="background:var(--orange);height:10px;width:10px"></i>Despachado</span>':''}</div>
    ${Object.keys(famT).length?Object.entries(famT).sort((a,b)=>b[1][0]-a[1][0]).map(([f,[p,d]])=>`<div class="gb"><div class="gt"><b>${esc(f.replace('Prefabricados menores','Menores'))}</b><span class="num"><b>${fmt(p)}</b>${verDesp?' / '+fmt(d):''}</span></div>
     <div class="gbar"><i style="width:${p/fx*100}%;background:var(--fg)"></i></div>${verDesp?`<div class="gbar" style="height:8px"><i style="width:${d/fx*100}%;background:var(--orange)"></i></div>`:''}</div>`).join(''):'<p class="note">Sin producción en el periodo.</p>'}</section>
   <section class="card s7"><h3>Producido vs despachado por producto</h3><p class="cap">${verDesp?'Lo despachado de más sale del inventario que ya había (Ruta 360 no separa planta todavía)':'Despachado: Ruta 360 aún no separa Tegucigalpa'}</p>
    <div class="legend"><span><i style="background:var(--fg);height:10px;width:10px"></i>Producido</span>${verDesp?'<span><i style="background:var(--orange);height:10px;width:10px"></i>Despachado</span>':''}</div>
    ${ids.length?`<div class="pbars">${ids.map(id=>`<div class="r"><span>${esc(M[id].n)}</span><div class="tr"><i style="width:${(pp[id]||0)/px*100}%;background:var(--fg)"></i>${verDesp?`<i style="width:${(pd[id]||0)/px*100}%;background:var(--orange)"></i>`:''}</div><span class="num note" style="text-align:right">${fmt(pp[id]||0)}${verDesp?' / '+fmt(pd[id]||0):''}</span></div>`).join('')}</div>`:'<p class="note">Sin datos en el periodo.</p>'}</section>

    ${czs.length?`<div class="tbl"><table class="pareto"><tbody>${czs.map(([c,n])=>{const ini=acc;acc+=n;const roja=ini/czT<0.8;return`<tr><td>${esc(causaN(c))}</td><td class="pb"><div class="bar" style="height:10px"><i style="width:${n/czs[0][1]*100}%;background:${roja?'var(--bad)':'var(--brandgray)'}"></i></div></td><td class="num" style="text-align:right"><b>${n}</b></td></tr>`}).join('')}</tbody></table></div>`:'<p class="note">Sin incidencias en el periodo.</p>'}</section>
   <section class="card s12"><h3>Calendario de liberación</h3><p class="cap">Piezas que pasan a disponible en Ruta 360 cada día · ${esc(plTxt())}</p>
    <div class="lib">${cal.map(([d,v])=>`<div class="${d===D.hoy?'hoy':''}"><span>${diaN(d).slice(0,3)} ${dm(d)}</span><b class="num">${fmt(v)}</b><span>${d<D.hoy?'liberado':d===D.hoy?'hoy':'en curado'}</span></div>`).join('')}</div></section>
  </div>`;
  const ir=()=>{CACHE.x=0;renderDash()};
  $('#fm').onchange=e=>{DS.mes=e.target.value;DS.desde=DS.mes+'-01';const fm=finMes(DS.mes);DS.hasta=fm>D.hoy?D.hoy:fm;ir()};
  $('#fd').onchange=e=>{if(e.target.value){DS.desde=e.target.value;if(DS.hasta<DS.desde)DS.hasta=DS.desde;DS.mes=DS.desde.slice(0,7)===DS.hasta.slice(0,7)&&DS.desde.endsWith('-01')?DS.desde.slice(0,7):'';ir()}};
  $('#fh').onchange=e=>{if(e.target.value){DS.hasta=e.target.value;if(DS.desde>DS.hasta)DS.desde=DS.hasta;DS.mes=DS.desde.slice(0,7)===DS.hasta.slice(0,7)&&DS.desde.endsWith('-01')?DS.desde.slice(0,7):'';ir()}};
  $('#fp').onchange=e=>{PL=e.target.value;store.set(PLK,PL);ir()};$('#ff2').onchange=e=>{DS.fam=e.target.value;ir()};
  $('#fclr').onclick=()=>{DS={mes:'',desde:'',hasta:'',fam:''};ir()};
  $('#xls').onclick=()=>excel(`Prefabricados_${corto(PL||'Ambas')}_${DS.desde}_${DS.hasta}.xlsx`,[
    ['Produccion',[['Fecha','Planta','Familia','Producto','Código SAP','Piezas','Insumo','Fecha de liberación']].concat(P.sort((a,b)=>a.f.localeCompare(b.f)||M[a.id].o-M[b.id].o).map(r=>[r.f,r.pl,M[r.id].f,M[r.id].n,M[r.id].sap,r.q,M[r.id].ins?'Sí':'No',r.lib]))],

    ['NoConformes',[['Fecha registro','Fecha producción','Planta','Producto','Cantidad','Clasificación','Registró','Observación']].concat(nc.map(r=>[r.f,r.fp,r.pl,(M[r.p]||{n:r.p}).n,r.q,r.c,r.n,r.obs]))],
    ['Incidencias',[['Fecha','Planta','Causa','Qué pasó','Afectó','Piezas no hechas','Horas','Estado','Registró']].concat(inc.map(r=>[r.f,r.pl,causaN(r.c),r.t,r.a?'Sí':'No',r.pz||'',r.h||'',r.e,r.n]))]]);

let XLSXP=null;
function cargarXLSX(){return XLSXP||(XLSXP=new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>{XLSXP=null;ko(new Error('No se pudo cargar el generador de Excel'))};document.head.appendChild(s)}))}
async function excel(nombre,hojas){try{await cargarXLSX();const wb=XLSX.utils.book_new();hojas.forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n.slice(0,31)));XLSX.writeFile(wb,nombre);toast('Excel descargado')}catch(e){toast(e.message)}}

/* ===================== Plan correctivo ===================== */
let planF='abiertas';
function renderPlan(){
  const inc=D.inc.filter(x=>enPlanta(x.pl,PL)),M={};
  const lista=inc.filter(x=>planF==='todas'||(planF==='abiertas'?x.e!=='Cerrada':x.e==='Cerrada')).sort((a,b)=>b.f.localeCompare(a.f));
  const g={};inc.forEach(x=>{const k=x.c;(g[k]=g[k]||{n:0,h:0,pz:0,ab:0});g[k].n++;g[k].h+=x.h;g[k].pz+=x.pz;if(x.e!=='Cerrada')g[k].ab++});
  const gs=Object.entries(g).sort((a,b)=>b[1].n-a[1].n||b[1].h-a[1].h);
  const pillE=e=>`<span class="pill ${e==='Cerrada'?'ok':e==='En seguimiento'?'warn':'bad'}">${e}</span>`;
  $('#main').innerHTML=`<div class="dnav no-print">${plantaSel()}</div><div class="grid">
   <section class="card s12"><h3>Fallas que más se repiten</h3><p class="cap">Incidencias por causa, de mayor a menor · ${esc(plTxt())} · desde que se usa el registro</p>
    ${gs.length?`<div class="tbl"><table><thead><tr><th>Causa</th><th style="text-align:right">Veces</th><th style="text-align:right">Abiertas</th><th style="text-align:right">Horas</th><th style="text-align:right">Piezas no hechas</th></tr></thead><tbody>${gs.map(([c,v])=>`<tr><td><b>${esc(causaN(c))}</b></td><td class="num" style="text-align:right">${v.n}</td><td class="num" style="text-align:right">${v.ab}</td><td class="num" style="text-align:right">${fmt(v.h)}</td><td class="num" style="text-align:right">${fmt(v.pz)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Todavía no hay incidencias. Cuando se registren, aquí se agrupan por causa para armar el plan correctivo, igual que en Bloques.</p>'}</section>
   <section class="card s12"><div class="kt" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3>Incidencias</h3><div class="plsel">${[['abiertas','Abiertas'],['cerradas','Cerradas'],['todas','Todas']].map(([v,t])=>`<button class="${planF===v?'on':''}" data-pf="${v}">${t}</button>`).join('')}</div></div>
    <div style="margin-top:12px">${lista.length?lista.map(x=>`<div class="inc"><div class="h"><span><b>${esc(causaN(x.c))}</b> <span class="note">· ${dmy(x.f)} · ${esc(corto(x.pl))} · ${esc(x.n)}</span></span><span style="display:flex;gap:6px;align-items:center">${x.a?'<span class="pill bad">Afectó</span>':''}${pillE(x.e)}${can('seg')?`<button class="btn small ghost" data-seg="${x.id}">Seguimiento</button>`:''}</span></div>
     <p>${esc(x.t)}</p>${x.pz||x.h||x.foto?`<span class="note">${x.pz?fmt(x.pz)+' piezas no hechas':''}${x.pz&&x.h?' · ':''}${x.h?x.h+' h':''}${x.foto?` · <a class="lnk" href="${esc(x.foto)}" target="_blank" rel="noopener">foto</a>`:''}</span>`:''}${x.s?`<div class="segt">${esc(x.s)}</div>`:''}</div>`).join(''):`<p class="note">No hay incidencias ${planF==='todas'?'':planF}.</p>`}</div></section></div>`;
  conectarPlanta(renderPlan);document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{planF=b.dataset.pf;renderPlan()});
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>dlgSeg(D.inc.find(x=>x.id===b.dataset.seg)));
}
function cerrarModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
function dlgSeg(x){const m=$('#modal');
  m.innerHTML=`<div class="dlg form" role="dialog" aria-modal="true"><h2>Seguimiento</h2><p>${esc(causaN(x.c))} · ${dmy(x.f)} · ${esc(corto(x.pl))}<br>${esc(x.t)}</p>
   <div class="field"><span class="lbl">Estado</span>${choice('est',[['Abierta','Abierta','Sin acción todavía'],['En seguimiento','En seguimiento','Hay una acción en curso'],['Cerrada','Cerrada','Resuelta de forma definitiva']])}</div>
   <div class="field"><label for="segt">Acción o comentario</label><textarea class="in-ctl" id="segt" placeholder="Ej. se mandó a soldar el molde; queda listo el jueves"></textarea></div>
   <button class="btn primary" id="segok">Guardar</button><button class="btn ghost" id="segx" style="margin-top:8px">Cancelar</button></div>`;
  m.hidden=false;conectarChoice();const b=document.querySelector(`#est .choice[data-v="${x.e}"]`);if(b)b.setAttribute('aria-pressed','true');
  $('#segx').onclick=cerrarModal;m.onclick=e=>{if(e.target===m)cerrarModal()};
  $('#segok').onclick=async()=>{const btn=$('#segok');btn.disabled=true;btn.textContent='Guardando…';
    try{const j=await api('pref_seg',{rec:{id:x.id,estado:elegido('est'),texto:$('#segt').value}});if(!j.ok)throw new Error(j.error);cerrarModal();await recargar();render();toast('Seguimiento guardado')}
    catch(e){if(e.message!=='sesion'){toast(e.message);btn.disabled=false;btn.textContent='Guardar'}}};
}

/* ===================== Bases de datos ===================== */
const BDH=[['Produccion','Una fila por producto y día: fecha, planta, producto, código SAP, piezas, fecha de liberación, quién reportó'],['Reportes','Un reporte por día y planta: total, foto de la hoja y observación'],['NoConformes','Piezas a segunda o desecho, con fecha de producción, foto y quién clasificó'],['Incidencias','Fecha, planta, causa, qué pasó, piezas y horas afectadas, foto y seguimiento'],['Productos','Catálogo: nombre de planta ↔ código SAP, familia, días de curado y capacidad'],['Totales','Totales diarios por planta para el Resumen Duracreto']];
let bdVer='';const BDC={};
async function renderBD(){
  $('#main').innerHTML=`<div class="grid"><section class="card s12"><h3>Bases de datos · BD_Control_Prefabricados</h3><p class="cap">Solo lectura · vea cada hoja o descárguela en Excel</p><div class="tbl"><table><thead><tr><th>Hoja</th><th>Qué guarda</th><th></th></tr></thead><tbody>
   ${BDH.map(r=>`<tr><td><b>${r[0]}</b></td><td class="note">${r[1]}</td><td style="text-align:right;white-space:nowrap"><button class="btn small ghost" data-ver="${r[0]}">Ver</button> <button class="btn small ghost" data-xl="${r[0]}">Excel</button></td></tr>`).join('')}</tbody></table></div></section>
   <section class="card s12" id="bdv" ${bdVer?'':'hidden'}></section></div>`;
  const leer=async n=>{if(BDC[n])return BDC[n];const j=await api('pref_bd',{hoja:n});if(!j.ok)throw new Error(j.error);return BDC[n]=j.filas};
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=async()=>{bdVer=b.dataset.ver;const v=$('#bdv');v.hidden=false;v.innerHTML='<p class="note">Cargando…</p>';
    try{const f=await leer(bdVer);const n=f.length-1;v.innerHTML=`<h3>${bdVer}</h3><p class="cap">${fmt(n)} filas${n>300?' · se muestran las últimas 300':''}</p><div class="tbl"><table><thead><tr>${f[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${f.slice(1).slice(-300).reverse().map(r=>`<tr>${r.map(c=>`<td>${/^https?:/.test(c)?`<a class="lnk" href="${esc(c)}" target="_blank" rel="noopener">abrir</a>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;v.scrollIntoView({behavior:'smooth'})}
    catch(e){if(e.message!=='sesion')v.innerHTML=`<p class="note">${esc(e.message)}</p>`}});
  document.querySelectorAll('[data-xl]').forEach(b=>b.onclick=async()=>{try{const f=await leer(b.dataset.xl);excel(`BD_Prefabricados_${b.dataset.xl}_${D.hoy}.xlsx`,[[b.dataset.xl,f]])}catch(e){if(e.message!=='sesion')toast(e.message)}});
}

/* ===================== Arranque ===================== */
async function recargar(){const j=await api('pref_data');if(!j.ok)throw new Error(j.error||'No se pudo leer Prefabricados');D=j;Object.keys(CACHE).forEach(k=>delete CACHE[k]);Object.keys(BDC).forEach(k=>delete BDC[k]);
  if(PL===null){const g=store.get(PLK);PL=D.planta||(g!==null&&(g===''||D.plantas.includes(g))?g:D.plantas[0])}}
async function boot(){pantallaCarga('Cargando Prefabricados…');
  try{await recargar();render()}
  catch(e){if(e.message!=='sesion')$('#app').innerHTML=`<div class="wrap" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><img src="${temaActual()==='dark'?LOGO_D:LOGO_L}" alt="Duracreto" style="width:200px;max-width:60vw;margin:0 auto 18px;display:block"><p>${esc(e.message)}</p><button class="btn small ghost" onclick="location.reload()">Reintentar</button> <a class="btn small ghost" href="./" style="text-decoration:none">Volver a Duracreto 360</a></div></div>`}}
if(S&&S.token&&ROL())boot();
</script>

<style>
:root{--neg:#12130F;--am:#F9D600;--nar:#F49A29;--gris:#A0A19F;--hueso:#F2F2EE;
--bg:#F4F4F1;--card:#fff;--tx:#1d1e1a;--mut:#6b6c68;--bd:#e3e3de;--soft:#F4F4F1;--hov:#fafaf6;
--ok:#2E9B57;--warn:#E08A00;--bad:#D64534;--info:#3A6EA5;--biz:#F9D600}
body.dark{--bg:#121310;--card:#1c1d19;--tx:#ECECE6;--mut:#a3a49e;--bd:#30312c;--soft:#25261f;--hov:#23241f}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13.5px}
button{font-family:inherit}
/* header */
.hdr{background:var(--neg);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:4px solid var(--biz);position:sticky;top:0;z-index:30}
.ib{width:38px;height:38px;border-radius:10px;border:0;background:#ffffff14;color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib:hover{background:#ffffff26}
.logo{font-weight:700;font-size:17px;letter-spacing:.4px;line-height:1.1}.logo span{color:var(--am)}.logo small{display:block;font-weight:400;font-size:10.5px;color:#cfcfc9;letter-spacing:0}
.sp{flex:1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;color:#cfcfc9;padding:9px 11px;border-radius:9px;font-size:12.5px;white-space:nowrap;cursor:pointer;position:relative;font-weight:500}
.nav button:hover{background:#ffffff12;color:#fff}.nav button.on{background:#ffffff1c;color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 var(--biz)}
.nav .bd{background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;margin-left:5px;font-weight:600}
.bizw{position:relative}.bizdd{display:none;position:absolute;top:36px;left:0;background:var(--card);color:var(--tx);border-radius:12px;box-shadow:0 10px 30px #0005;padding:6px;min-width:230px;z-index:40}
.bizdd.on{display:block}.bizdd div{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}.bizdd div:hover{background:var(--soft)}.bizdd div.dis{opacity:.5;cursor:default}.bizdd div.on{font-weight:600}
.demosel{background:#ffffff14;color:#fff;border:1px solid #ffffff2a;font-size:11.5px;padding:7px 8px;border-radius:9px;max-width:210px}.demosel option{color:#1d1e1a}
@media(max-width:1560px){.hdr .logo small{display:none}.demosel{max-width:150px}}
@media(max-width:1300px){.hdr{flex-wrap:wrap}.nav{order:10;flex-basis:100%;padding-top:4px}}
.strip{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd);font-size:12.5px;position:sticky;top:62px;z-index:29}
.bchip{padding:3px 10px;border-radius:20px;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent}
.bchip.B{background:#F9D600;color:#12130F}.bchip.P{background:#12130F;color:#F2F2EE;border-color:#555}
.demo-user{margin-left:auto;font-size:11.5px;color:var(--mut)}
/* drawer menu */
.mnu{position:fixed;top:0;left:-320px;width:300px;height:100%;background:var(--card);z-index:60;transition:left .22s;box-shadow:6px 0 30px #0004;overflow-y:auto;display:flex;flex-direction:column}
.mnu.on{left:0}.ovl{position:fixed;inset:0;background:#0006;z-index:55;display:none}.ovl.on{display:block}
.mnu .who{background:var(--neg);color:#fff;padding:18px 16px;border-bottom:4px solid var(--biz)}.mnu .who b{display:block;font-size:15px}.mnu .who span{font-size:11.5px;color:#cfcfc9}
.mnu h6{margin:14px 16px 6px;font-size:10.5px;letter-spacing:.8px;color:var(--mut);text-transform:uppercase}
.mi{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;border-left:4px solid transparent}
.mi:hover{background:var(--hov)}.mi.on{border-left-color:var(--biz);background:var(--soft);font-weight:600}
.mi .ico{width:22px;text-align:center}.mi .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px;font-weight:600}
.mi.dis{opacity:.5;cursor:default}.pro{margin-left:auto;font-size:10px;background:var(--soft);padding:2px 6px;border-radius:6px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #8885}
.mnu select{margin:0 16px 10px;width:calc(100% - 32px)}
/* layout */
main{padding:16px;max-width:1400px;margin:auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mut);font-size:11.5px}
h2{font-size:17px;margin:2px 0 12px}
.demo{background:#FFF8CC;color:#4a4100;border:1px solid #F0DC6A;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:14px}
body.dark .demo{background:#3a3510;color:#f5e9a8;border-color:#5b5320}
.kpi{border-top:4px solid var(--biz)}.kpi .l{font-size:11.5px;color:var(--mut)}.kpi .v{font-size:23px;font-weight:700;margin:2px 0}.kpi .s{font-size:11.5px}
.up{color:var(--ok)}.dn{color:var(--bad)}.muted{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--hov)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:nowrap}
.s-prog{background:#E9E9E4;color:#555}.s-cal{background:#ECE3F7;color:#6a3fa0}.s-lib{background:#E3ECF7;color:#2f5d8f}.s-par{background:#FFE9C7;color:#9a5b00}
.s-ent{background:#DDF2E4;color:#237a44}.s-no{background:#FBDCD8;color:#b23a2b}.s-rech{background:#FBDCD8;color:#b23a2b}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--mut);white-space:nowrap}.tag.pl{background:#12130F;color:#F9D600}
.btn{border:0;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;background:var(--am);color:#12130F;font-size:12.5px}
.btn.sec{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.dk{background:#12130F;color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:5px 9px;font-size:11.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,textarea{font-family:inherit;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:12.5px}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datebar input{font-weight:600}
/* calendar */
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calg .h{font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.cell{border:1px solid var(--bd);border-radius:9px;min-height:78px;padding:6px;font-size:11px;cursor:pointer;background:var(--card);position:relative}
.cell.out{opacity:.35}.cell.sel{outline:3px solid var(--biz);outline-offset:-1px}.cell.today .n{background:var(--neg);color:#fff;border-radius:6px;padding:0 5px}
.cell .n{font-weight:600;display:inline-block}.cell .q{font-weight:700;font-size:12.5px;margin-top:3px}
.cell .m{height:6px;border-radius:4px;background:var(--soft);margin-top:4px;overflow:hidden}.cell .m i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--bd)}
.chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.chk.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}.chk.half .bx{background:var(--nar);border-color:var(--nar);color:#fff}.chk.no .bx{background:var(--bad);border-color:var(--bad);color:#fff}
.chk.done .t{text-decoration:line-through;color:var(--mut)}.chk .t b{font-weight:600}.chk .t small{display:block;color:var(--mut);font-size:11px}
.pbar{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;margin:4px 0 10px}.pbar i{display:block;height:100%;background:var(--ok)}
.hbar{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.alert{display:flex;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:7px;align-items:center;border:1px solid var(--bd);background:var(--soft)}
.alert .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.alert b{display:block;font-size:12.5px}.alert span{font-size:11.5px;color:var(--mut)}
/* list cards for despachador */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.tabs button.on{background:#12130F;color:#F9D600;border-color:#12130F}.tabs button b{background:var(--bad);color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;font-size:10px}
.dl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.di{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;border-left:5px solid var(--gris)}
.di:hover{box-shadow:0 4px 14px #0001}.di .top{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut)}
.di .c{font-weight:600;font-size:14px;margin:4px 0 2px}.di .p{font-size:12.5px}.di .ft{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.di.lib{border-left-color:var(--info)}.di.cal{border-left-color:#8a63c7}.di.par{border-left-color:var(--nar)}.di.ent{border-left-color:var(--ok)}.di.no{border-left-color:var(--bad)}
/* modal */
.mod{position:fixed;inset:0;background:#0007;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto}.mod.on{display:flex}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:620px;box-shadow:0 20px 50px #0005;overflow:hidden}
.mbox.w{max-width:900px}
.mhd{background:#12130F;color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--biz)}.mhd b{font-size:15px}
.mhd .x{margin-left:auto;background:#ffffff1c;border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.mbd{padding:16px}
.fld{margin-bottom:11px}.fld label{display:block;font-size:11.5px;font-weight:600;margin-bottom:4px}.fld input,.fld select,.fld textarea{width:100%}
.fld .h{font-size:10.5px;color:var(--mut);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}}
.auto{position:relative}.sug{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 20px #0003;z-index:5;max-height:240px;overflow:auto;display:none}
.sug div{padding:7px 10px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:6px}.sug div:hover{background:var(--soft)}.sug small{color:var(--mut)}
.ro{background:var(--soft)!important}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);color:var(--tx);padding:9px;cursor:pointer;font-size:12px}
.seg button.on{background:#12130F;color:#F9D600;font-weight:600}
.check{border-radius:10px;padding:10px 12px;font-size:12px;margin:4px 0 12px}
.check.ok{background:#E3F5EA;border:1px solid #BFE6CD;color:#1d5a35}.check.no{background:#FDEEEC;border:1px solid #F3C4BD;color:#8f2a1f}.check.wa{background:#FFF4E2;border:1px solid #F4D7A6;color:#7a4b00}
.info{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.info b{font-weight:600}
.mini{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:6px}
.mini div{border-radius:6px;padding:4px 0;text-align:center;font-size:10px;cursor:pointer;color:#fff;font-weight:600;line-height:1.2}.mini div small{display:block;font-weight:400;font-size:9px;opacity:.9}
.mini div.sel{outline:3px solid var(--tx);outline-offset:1px}
.trips{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:12px}
.trips table td{padding:4px}.trips input{padding:5px 6px;width:100%}
.photo{border:2px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.photo img{max-width:100%;max-height:200px;border-radius:8px;display:block;margin:0 auto 6px}
.clock{font-weight:700;font-size:15px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12130F;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-size:12.5px;display:none;border-left:4px solid var(--am);max-width:90%}
.rc canvas{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:10px;box-shadow:0 4px 18px #0002}
.share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wa{background:#25D366;color:#fff}.ml{background:#3A6EA5;color:#fff}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.subtabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.subtabs button.on{background:#12130F;color:#F9D600;border-color:#12130F}
.pill{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#FDEEEC;color:#b23a2b;font-weight:600}.pill.g{background:#DDF2E4;color:#237a44}.pill.o{background:#FFF1D6;color:#8a5600}
.empty{padding:30px;text-align:center;color:var(--mut)}
a{color:var(--info)}body.dark a{color:#8db8ea}
.grid>*{min-width:0}html,body{overflow-x:hidden}
@media(max-width:600px){main{padding:10px}.card{padding:12px}.logo small{display:none}.demosel{max-width:120px}
.cell{min-height:54px;padding:3px;font-size:9.5px;border-radius:7px}.cell .q{font-size:10px}.cell .muted{display:none}.calg{gap:3px}
.kpi .v{font-size:19px}.hbar{grid-template-columns:100px 1fr 38px}.strip{top:58px}.mini{grid-template-columns:repeat(7,1fr)}
table{display:block;overflow-x:auto}.info{grid-template-columns:1fr}}
.who{color:#cfcfc9;font-size:11.5px;text-align:right;line-height:1.25;white-space:nowrap}.who b{color:#fff;display:block;font-size:12px}
.ib.on::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.ib.off::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
body.busy{cursor:progress}body.busy .mbox,body.busy main{opacity:.55;pointer-events:none}
.carga{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;text-align:center;color:var(--mut)}.carga img{width:84px;border-radius:18px;margin-bottom:12px}
@media(max-width:700px){.who{display:none}}
</style>

<script>
const _now=new Date();const TODAY=_now.getDate()+'/'+(_now.getMonth()+1)+'/'+_now.getFullYear();
const asesAct=()=>ASES.filter(a=>a.act).map(a=>a.n);
const fechaLarga=()=>{const d=new Date();return DIAS[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+' de '+d.getFullYear()};
const $=s=>document.querySelector(s);
const fmt=n=>n===Infinity?'sin límite':Math.round(n||0).toLocaleString('es-HN');
const pct=x=>isFinite(x)?Math.round(x*100)+' %':'—';
const pd=s=>{const[d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d)};
const fd=d=>d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
const iso=s=>{const d=pd(s);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromIso=v=>{const[y,m,d]=v.split('-').map(Number);return d+'/'+m+'/'+y};
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const largo=s=>{const d=pd(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd(d)};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===================== Conexión con Duracreto 360 (misma sesión, mismos usuarios) ===================== */
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SS='dc_bloques_sesion_v2',THM='dc_bloques_tema',RBIZ='dc_ruta_negocio',RSEC='dc_ruta_seccion';
const API_URL=String(window.API_URL||'').trim();
let SES=store.get(SS);
if(!SES||!SES.token||!SES.ruta){location.replace('./')}
async function api(action,payload={}){let r;
 try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:SES&&SES.token},payload))})}catch(e){throw new Error('Sin conexión. Revise el internet e intente de nuevo.')}
 const j=await r.json();if(!j.ok&&j.error==='sesion'){store.del(SS);location.replace('./');throw new Error('sesion')}return j}
const D={B:[],P:[],cli:[],eqs:[],capB:[],capP:[],prodB:[],prodP:[],invB:[],invP:[],prodD:[],conteo:{B:'',P:''},cau:[],bit:[]};
const AUT={B:[],P:[]};let ASES=[],CFG={tolerancia:.1,capB:28000,capP:6},CARGADO=0;
const ST={Programado:'prog',Parcial:'par',Entregado:'ent','No realizado':'no','Saldo cerrado':'ent'};
const RQ={Pendiente:'pend',Aprobada:'ok',Rechazada:'rech'};
const isoDMY=v=>v?fromIso(String(v).slice(0,10)):'';
function conv(x){const o=Object.assign({},x);o.f=isoDMY(x.f);o.cerr=x.st==='Saldo cerrado';o.st=ST[x.st]||'prog';o.req=RQ[x.req]||'';
 o.entregas=(x.entregas||[]).map(e=>Object.assign({},e,{fe:isoDMY(e.fe)}));o.sol=o.st==='par'&&o.cant>o.ent;
 if(o.cal)o.cal=Object.assign({},o.cal,{fe:isoDMY(o.cal.fe)});return o}
const letras=t=>(/bloq/i.test(t)?'B':'')+(/prefa/i.test(t)?'P':'')||'B';
async function cargarNeg(b){const j=await api('ruta_data',{neg:b});if(!j.ok)throw new Error(j.error||'No se pudo leer '+BIZ[b].n);
 D[b]=j.despachos.map(conv);AUT[b]=j.autorizaciones||[];CFG=Object.assign(CFG,j.cfg||{});
 const c=j.cat;D['cap'+b]=c.capacidades;D['prod'+b]=c.productos.map(p=>p.p);D['inv'+b]=j.inventario.items;D.conteo[b]=j.inventario.conteo||'';
 if(b==='B')D.prodD=(j.inventario.produccion||[]).map(p=>({f:isoDMY(p.f),p:p.p,u:p.u}));
 D.cli=c.clientes.map(k=>Object.assign({},k,{b:letras(k.b),k:0}));D.eqs=c.equipos;D.cau=c.causas;D.bit=c.bitacora||[];
 ASES=c.asesores.map(a=>({n:a.n,act:a.act}));
 if(SES.ruta.rol!==j.rol||String(SES.ruta.negocios)!==String(j.negocios)){SES.ruta={rol:j.rol,negocios:j.negocios};store.set(SS,SES)}}
/* Mientras Fernando no cargue sus catálogos: asesores y clientes salen también del historial de despachos */
const NO_ASES=['','sin asesor','kenneth romero'];
function completarCatalogos(){const todos=D.B.concat(D.P).slice().sort((a,b)=>pd(a.f)-pd(b.f));
 const ya=new Set(ASES.map(a=>nz(a.n)));
 todos.concat(D.cli.map(c=>({ase:c.a}))).forEach(x=>{const n=String(x.ase||'').trim();if(!NO_ASES.includes(nz(n))&&!ya.has(nz(n))){ya.add(nz(n));ASES.push({n,act:true})}});
 ASES.sort((a,b)=>a.n.localeCompare(b.n,'es'));
 const cli=new Map(D.cli.map(c=>[nz(c.n),c]));
 todos.forEach(x=>{const n=String(x.cli||'').trim();if(!n)return;const k=nz(n);const b=D.B.includes(x)?'B':'P';let c=cli.get(k);
  if(!c){c={n,alias:'',t:x.tipo||'Distribuidor',a:'',tr:x.tr||'C',b:'',k:0,hist:1};cli.set(k,c);D.cli.push(c)}
  if(c.hist){if(x.ase&&!NO_ASES.includes(nz(x.ase)))c.a=x.ase;if(x.tipo)c.t=x.tipo;c.tr=x.tr||c.tr}
  if(!c.b.includes(b))c.b+=b});
 D.cli.sort((a,b)=>a.n.localeCompare(b.n,'es'))}
async function cargarTodo(){await Promise.all(S.user.biz.map(cargarNeg));
 completarCatalogos();
 const k={};D.B.concat(D.P).forEach(x=>{const n=nz(x.cli);k[n]=(k[n]||0)+1});D.cli.forEach(c=>c.k=k[nz(c.n)]||0);CARGADO=Date.now()}
async function guardar(action,payload,okMsg){const b=$('#mbox button.dk,#mbox button.ok,#mbox button.no');
 document.body.classList.add('busy');try{const j=await api(action,Object.assign({neg:S.biz},payload));
  if(!j.ok){if(j.pendiente){espera(j.error)}else toast('✖ '+esc(j.error||'No se pudo guardar'));return null}
  await cargarTodo();if(okMsg)toast(okMsg);return j}
 catch(e){toast('✖ '+esc(e.message));return null}finally{document.body.classList.remove('busy')}}
function espera(msg){render();modal('Debe esperar autorización',`<div class="check wa" style="font-size:13px">⏳ <b>${esc(msg)}</b></div><p class="muted" style="font-size:12px">Fernando Murillo recibió el aviso. Cuando lo apruebe le llegará una notificación: vuelva a abrir este despacho y registre la misma cantidad. Si lo rechaza, despache como máximo el saldo.</p><button class="btn dk" style="width:100%" onclick="closeModal()">Entendido</button>`)}
const autDe=id=>AUT[S.biz].find(a=>a.desp===id);
/* Foto: se reduce en el teléfono antes de enviarla (máx. 1280 px) */
function reducirFoto(dataUrl){return new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=()=>ok(dataUrl);im.src=dataUrl})}
/* Notificaciones push (mismo proyecto Firebase que Duracreto 360) */
const PTK='dc_bloques_push_token';let fbMsg=null;
const esIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSoportado=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const pushActivo=()=>pushSoportado()&&Notification.permission==='granted'&&!!store.get(PTK);
function cargarScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar Firebase'));document.head.appendChild(s)})}
async function firebaseMsg(){if(fbMsg)return fbMsg;const v='10.12.5';await cargarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await cargarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-messaging-compat.js`);if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE);fbMsg=firebase.messaging();return fbMsg}
async function tokenPush(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;const m=await firebaseMsg();return m.getToken({vapidKey:window.FIREBASE_VAPID,serviceWorkerRegistration:reg})}
const nombreDisp=()=>{const u=navigator.userAgent;return (esIOS?'iPhone/iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Otro')+(instalada()?' · app instalada':' · navegador')};
async function panelPush(){if(pushActivo()){toast('Los avisos ya están activados en este dispositivo.');return}
 if(esIOS&&!instalada()){modal('Activar avisos',`<p style="margin-top:0">En iPhone los avisos llegan solo con la app instalada: toque <b>Compartir</b> › <b>Agregar a pantalla de inicio</b>, ábrala desde el ícono y vuelva a tocar la campana.</p>`);return}
 if(!pushSoportado()){toast('Este navegador no permite avisos');return}
 try{const p=await Notification.requestPermission();if(p!=='granted'){toast('No se dio permiso para los avisos');return}
  const tk=await tokenPush();const j=await api('suscribir',{pushToken:tk,disp:nombreDisp()});if(!j.ok)throw new Error(j.error);store.set(PTK,tk);try{await api('probarPush')}catch(e){}
  toast('Avisos activados en este dispositivo');renderShell()}catch(e){toast('No se pudieron activar los avisos: '+esc(e.message))}}

function toast(t){const e=$('#toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}

/* ---------- usuarios y permisos (demo) ---------- */
const ROLN={ADMIN:'Administrador',PROGRAMADOR:'Programador de despachos',DESPACHO:'Despachador',CALIDAD:'Control de Calidad',CONSULTA:'Consulta'};
const BIZ={B:{n:'Bloques',c:'#F9D600',u:'unid.',cap:28000,capL:'28,000 unid./día'},P:{n:'Prefabricados',c:'#F2F2EE',u:'piezas',cap:6,capL:'6 viajes/día'}};
const SECS=[
 {k:'tab',n:'Tablero',i:'▦',r:['ADMIN','PROGRAMADOR','CONSULTA','DESPACHO','CALIDAD']},
 {k:'prog',n:'Programación',i:'🗓',r:['ADMIN','PROGRAMADOR']},
 {k:'sal',n:'Saldos y solicitudes',i:'↺',r:['ADMIN','PROGRAMADOR'],badge:()=>pendSol().length+pendReq().length+AUT[S.biz].length},
 {k:'cal',n:'Calidad',i:'✔',r:['ADMIN','CALIDAD'],only:'P',badge:()=>recs().filter(x=>x.f===TODAY&&needsCal(x)).length},
 {k:'eje',n:'Ejecutar despachos',i:'🚚',r:['ADMIN','PROGRAMADOR','DESPACHO'],badge:()=>recs().filter(x=>x.f===TODAY&&saldo(x)>0&&x.st!=='no'&&x.req!=='pend').length},
 {k:'inv',n:'Inventario',i:'▤',r:['ADMIN','PROGRAMADOR','CONSULTA']},
 {k:'rep',n:'Reportes',i:'⬇',r:['ADMIN','PROGRAMADOR','CONSULTA']},
 {k:'bd',n:'Bases de datos',i:'🔒',r:['ADMIN','PROGRAMADOR']}];
let S={user:{u:SES&&SES.u,n:SES&&SES.nombre,rol:SES&&SES.ruta&&SES.ruta.rol,biz:(SES&&SES.ruta&&SES.ruta.negocios)||['B']},biz:'B',sec:'tab',date:TODAY,ejeTab:'hoy',bdTab:'cli',repT:'cumF'};
{const b=store.get(RBIZ);S.biz=S.user.biz.includes(b)?b:S.user.biz[0];S.sec=store.get(RSEC)||({DESPACHO:'eje',CALIDAD:'cal'}[S.user.rol]||'tab')}

/* ---------- datos ---------- */
const recs=(b=S.biz)=>b==='B'?D.B:D.P;
const saldo=x=>Math.max(0,x.cant-x.ent);
const needsCal=x=>S.biz==='P'&&!x.cal&&x.st!=='no'&&saldo(x)>0;
const pendSol=()=>recs().filter(x=>x.sol&&saldo(x)>0);
const pendReq=()=>recs().filter(x=>x.req==='pend');
const caps=()=>S.biz==='B'?D.capB:D.capP;
const prods=()=>{const p=S.biz==='B'?D.prodB:D.prodP;return p.length?p:caps().map(c=>c.p)};
const EQT=()=>S.biz==='B'?['Camión plataforma','Rastra 2 ejes','Rastra 3 ejes']:['Camión plataforma','Rastra'];
function capOf(prod,eqT){const c=caps().find(c=>c.p===prod);if(!c)return null;return {'Camión plataforma':c.cam,'Rastra':c.ras,'Rastra 2 ejes':c.r2,'Rastra 3 ejes':c.r3}[eqT]||null}
function viajes(x){const c=capOf(x.prod,x.eqT||'Camión plataforma')||capOf(x.prod,S.biz==='B'?'Rastra 2 ejes':'Rastra')||10;return Math.ceil(x.cant/c)}
function cap(){return S.biz==='B'?(+CFG.capB||28000):(+CFG.capP||6)}
function carga(f){const r=recs().filter(x=>x.f===f);return S.biz==='B'?r.reduce((s,x)=>s+x.cant,0):r.reduce((s,x)=>s+viajes(x),0)}
const satCol=r=>r===0?'var(--soft)':r>1?'#D64534':r>.85?'#F49A29':'#2E9B57';
function stInfo(x){
 if(x.st==='ent')return[x.cerr?'Saldo cerrado':'Entregado','s-ent','ent'];
 if(x.st==='no')return['No realizado','s-no','no'];
 if(x.cal&&!x.cal.ok)return['Rechazado por calidad','s-rech','no'];
 if(x.st==='par')return['Parcial · saldo '+fmt(saldo(x)),'s-par','par'];
 if(S.biz==='P'&&!x.cal)return['Espera calidad','s-cal','cal'];
 if(S.biz==='P')return['Liberado por calidad','s-lib','lib'];
 return['Pendiente','s-prog','prog']}
const st=x=>{const i=stInfo(x);return `<span class="st ${i[1]}">${i[0]}</span>`};
const trTxt=x=>x.tr==='P'?`<span class="tag pl">Platino${x.eqT?' · '+x.eqT:''}</span>`:'<span class="tag">Transporte del cliente</span>';
function invLibre(prod,hasta){if(!D.conteo[S.biz])return Infinity;const i=(S.biz==='B'?D.invB:D.invP).find(i=>i.p===prod);if(!i)return Infinity;
 const comp=recs().filter(x=>x.prod===prod&&pd(x.f)>=pd(TODAY)&&pd(x.f)<=pd(hasta)&&x.req!=='pend'&&x.req!=='rech'&&(x.st==='prog'||x.st==='par')).reduce((s,x)=>s+saldo(x),0);
 return i.disp+(pd(hasta)>=pd(addD(TODAY,1))?i.cur:0)-comp}

/* ---------- equipos en taller ---------- */
const enTaller=e=>/taller/i.test(e.e||'');
const BIT=[];
const eqTipo=e=>e.t==='Rastra'&&S.biz==='B'?'Rastra '+(e.ejes||2)+' ejes':e.t;
function eqOpts(tipo,sel){const base=tipo?tipo.split(' ')[0]:'';return D.eqs.filter(e=>!base||e.t.split(' ')[0]===base).sort((a,b)=>(eqTipo(b)===tipo)-(eqTipo(a)===tipo)).map(e=>`<option value="${e.c}" ${e.c===sel?'selected':''}>${e.c} · ${eqTipo(e)} · ${e.m||'sin motorista'}${enTaller(e)?' · ⚠ en taller':''}</option>`).join('')}
function wireEq(selId,warnId,onOk){const s=$('#'+selId);s.dataset.ok='1';
 const chk=()=>{const e=D.eqs.find(q=>q.c===s.value);const w=$('#'+warnId);
  if(e&&enTaller(e)){s.dataset.ok='';w.innerHTML=`<div class="check wa">⚠ <b>${e.c} figura «${e.e}» en el configurador.</b> ¿Ya está habilitado?<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn sm" id="${warnId}Y">Sí, ya está habilitado · usarlo</button><button type="button" class="btn sec sm" id="${warnId}N">Elegir otro equipo</button></div></div>`;
   $('#'+warnId+'Y').onclick=()=>{e.e='Activa';s.dataset.ok='1';s.dataset.hab='1';
    w.innerHTML=`<div class="check ok">✔ <b>${e.c}</b> quedará habilitado en el configurador al guardar${S.user.rol==='DESPACHO'?' y se avisará a Fernando Murillo':''}.</div>`;
    s.innerHTML='<option value="">— Selecciona —</option>'+eqOpts(s.dataset.tipo,e.c);onOk&&onOk(e)};
   $('#'+warnId+'N').onclick=()=>{s.value='';w.innerHTML='';s.dataset.ok='1';s.focus()}}
  else{w.innerHTML='';s.dataset.ok='1';if(e&&onOk)onOk(e)}};
 s.onchange=chk;if(s.value)chk()}

 $('#sBiz').onclick=e=>{e.stopPropagation();if(multi)$('#bizdd').classList.toggle('on')};
 document.querySelectorAll('#bizdd [data-biz]').forEach(e=>e.onclick=()=>{S.biz=e.dataset.biz;store.set(RBIZ,S.biz);$('#bizdd').classList.remove('on');if(!allowed().find(s=>s.k===S.sec))S.sec=allowed()[0].k;render()});
 $('#nav').innerHTML=allowed().map(s=>{const b=s.badge?s.badge():0;return `<button class="${S.sec===s.k?'on':''}" data-sec="${s.k}">${s.n}${b?`<span class="bd">${b}</span>`:''}</button>`}).join('');

}

/* ========== TABLERO ========== */
function calendarHTML(sel,onclickFn){
 const d=pd(sel),first=new Date(d.getFullYear(),d.getMonth(),1);let start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 let h=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="h">${x}</div>`).join('');
 for(let i=0;i<42;i++){const c=new Date(start);c.setDate(start.getDate()+i);const k=fd(c);const r=recs().filter(x=>x.f===k);const q=carga(k),rt=q/cap();
  const ent=r.filter(x=>x.st==='ent').length;
  h+=`<div class="cell ${c.getMonth()!==d.getMonth()?'out':''} ${k===sel?'sel':''} ${k===TODAY?'today':''}" onclick="${onclickFn}('${k}')"><span class="n">${c.getDate()}</span>${r.length?`<div class="q">${S.biz==='B'?fmt(q):q+' viajes'}</div><div class="muted">${r.length} prog.${pd(k)<=pd(TODAY)?' · '+ent+' ✓':''}</div><div class="m"><i style="width:${Math.min(rt,1)*100}%;background:${satCol(rt)}"></i></div>`:''}</div>`}
 return h}
function vTab(){
 const f=S.date,r=recs().filter(x=>x.f===f).sort((a,b)=>a.h.localeCompare(b.h)),p=r.reduce((s,x)=>s+x.cant,0),e=r.reduce((s,x)=>s+x.ent,0);
 const done=r.filter(x=>x.st==='ent').length;const d=pd(f);
 $('#main').innerHTML=`
 <div class="tools"><div class="datebar"><button class="btn sec sm" onclick="goDay(-1)">◀</button><input type="date" value="${iso(f)}" onchange="S.date=fromIso(this.value);render()"><button class="btn sec sm" onclick="goDay(1)">▶</button>${f!==TODAY?'<button class="btn sm" onclick="S.date=TODAY;render()">Hoy</button>':''}</div>
 <b style="font-size:15px;text-transform:capitalize">${largo(f)}</b><span class="sp"></span>${['ADMIN','PROGRAMADOR'].includes(S.user.rol)?'<button class="btn" onclick="formProg()">+ Nueva programación</button>':''}</div>
 <div class="grid g4" style="margin-bottom:14px">
  <div class="card kpi"><div class="l">Programado</div><div class="v">${fmt(p)}</div><div class="s">${r.length} despachos${S.biz==='P'?' · '+r.reduce((s,x)=>s+viajes(x),0)+' viajes':''}</div></div>
  <div class="card kpi"><div class="l">Entregado</div><div class="v">${fmt(e)}</div><div class="s ${p&&e/p>=.95?'up':'dn'}">${pct(p?e/p:NaN)} de lo programado</div></div>
  <div class="card kpi"><div class="l">Pendiente del día</div><div class="v">${fmt(p-e)}</div><div class="s">${r.filter(x=>saldo(x)>0&&x.st!=='no').length} por completar</div></div>
  <div class="card kpi"><div class="l">Solicitudes de saldo</div><div class="v">${pendSol().length}</div><div class="s">${allowed().some(s=>s.k==='sal')?`<a href="#" onclick="S.sec='sal';render();return false">Definir próxima entrega ›</a>`:'Los define Fernando'}</div></div>
 </div>
 <div class="grid g2">
  <div class="card"><h3>Calendario de despachos <small>${MES[d.getMonth()]} ${d.getFullYear()} · saturación vs. capacidad (${BIZ[S.biz].capL})</small></h3>
   <div class="calg">${calendarHTML(f,'pickDay')}</div>
   <div class="legend"><span><i style="background:#2E9B57"></i>Holgado (≤ 85 %)</span><span><i style="background:#F49A29"></i>Ajustado (85–100 %)</span><span><i style="background:#D64534"></i>Saturado (> 100 %)</span><span>Toca un día para verlo</span></div></div>
  <div class="card"><h3>Pendientes del día <small>${done} de ${r.length} completos</small></h3>
   <div class="pbar"><i style="width:${r.length?done/r.length*100:0}%"></i></div>
   <div style="max-height:470px;overflow:auto">${r.length?r.map(x=>{const i=stInfo(x)[2];const cls=i==='ent'?'done':i==='par'?'half':i==='no'?'no':'';return `<div class="chk ${cls}" onclick="detalle('${x.id}')" style="cursor:pointer"><div class="bx">${cls==='done'?'✓':cls==='half'?'½':cls==='no'?'✕':''}</div><div class="t"><b>${x.h} · ${esc(x.cli)}</b><small>${x.prod} · ${fmt(x.cant)} ${BIZ[S.biz].u} · ${x.tr==='P'?'Platino':'Cliente'} · ${esc(x.ase)}</small></div><div style="margin-left:auto">${st(x)}</div></div>`}).join(''):'<div class="empty">Sin despachos programados.</div>'}</div></div>
 </div>
 <div class="grid g3" style="margin-top:14px">
  <div class="card"><h3>Atención <small>del día</small></h3>${alertas(f)}</div>
  <div class="card"><h3>Cumplimiento por asesor <small>del día</small></h3>${asesorBars(f)}</div>
  <div class="card"><h3>Causas de incumplimiento <small>del día</small></h3>${causas(f)}</div>
 </div>`}
function goDay(n){S.date=addD(S.date,n);render()}
function pickDay(k){S.date=k;render()}
function alertas(f){const a=[];const r=recs().filter(x=>x.f===f);
 const sol=pendSol();if(sol.length)a.push(['#D64534','↺',`${sol.length} saldo${sol.length>1?'s esperan':' espera'} nueva fecha`,'Despachos parciales: el cliente retiró una parte']);
 if(S.biz==='P'){const c=r.filter(needsCal);if(c.length)a.push(['#8a63c7','✔',`${c.length} despachos esperan validación de Calidad`,'Sin validación no se pueden despachar'])}
 const rt=carga(addD(f,1))/cap();if(rt>.85)a.push(['#F49A29','▲',`Mañana está al ${pct(rt)} de la capacidad`,'Considera mover programaciones a otro día']);
 const nr=recs().filter(x=>x.st==='no'&&pd(x.f)<pd(f)&&pd(x.f)>=pd(addD(f,-7))&&!x.rep);if(nr.length)a.push(['#D64534','✕',`${nr.length} no realizados en los últimos 7 días`,'Reprogramar o cerrar con el asesor']);
 if(!D.conteo[S.biz])a.push(['#A0A19F','▤','Inventario sin conteo inicial','Mientras no se cargue el conteo físico, la programación no se bloquea por inventario']);
 if(S.biz==='B'&&D.conteo.B){const lo=D.invB.filter(i=>i.disp<10000&&i.disp>0&&recs().some(x=>x.prod===i.p&&pd(x.f)>=pd(addD(f,-30))));lo.forEach(i=>a.push(['#F49A29','▼',`${i.p}: quedan ${fmt(i.disp)} en patio`,'Coordinar producción con planta']))}
 if(AUT[S.biz].length)a.unshift(['#F49A29','!',`${AUT[S.biz].length} despacho${AUT[S.biz].length>1?'s':''} por encima del saldo esperan autorización`,'Hasta 10 % más · ve a Saldos y solicitudes']);
 const rq=pendReq();if(rq.length)a.unshift(['#3A6EA5','＋',`${rq.length} despacho${rq.length>1?'s':''} sin programar por aprobar`,'Clientes que llegaron por pocas unidades · ve a Saldos y solicitudes']);
 return a.length?a.map(x=>`<div class="alert"><div class="ic" style="background:${x[0]}">${x[1]}</div><div><b>${x[2]}</b><span>${x[3]}</span></div></div>`).join(''):'<div class="empty">Sin alertas.</div>'}
function asesorBars(f){const r=recs().filter(x=>x.f===f);const g={};
 r.forEach(x=>{g[x.ase]=g[x.ase]||[0,0];g[x.ase][0]+=x.cant;g[x.ase][1]+=x.ent});
 const a=Object.entries(g).sort((a,b)=>b[1][0]-a[1][0]).slice(0,9);if(!a.length)return '<div class="empty">Sin datos.</div>';
 return a.map(([n,[p,e]])=>{const v=p?e/p:0;return `<div class="hbar"><span>${n}</span><div class="bar"><i style="width:${v*100}%;background:${v>=.85?'#2E9B57':v>=.7?'#F49A29':'#D64534'}"></i></div><span class="num">${pct(v)}</span></div>`}).join('')}
function causas(f){const g={};recs().filter(x=>x.f===f&&x.causa).forEach(x=>g[x.causa]=(g[x.causa]||0)+1);
 const a=Object.entries(g).sort((a,b)=>b[1]-a[1]);if(!a.length)return '<div class="empty">Sin incumplimientos.</div>';const m=a[0][1];
 return a.map(([c,n])=>`<div class="hbar" style="grid-template-columns:150px 1fr 26px"><span>${c}</span><div class="bar"><i style="width:${n/m*100}%;background:var(--tx)"></i></div><span class="num">${n}</span></div>`).join('')}
function detalle(id){const x=recs().find(x=>x.id===id);
 modal(`${x.id} · ${esc(x.cli)}`,`${S.user.rol==='CALIDAD'&&x.cal?`<p><button class="btn sec sm" onclick="reciboCal('${x.id}')">Comprobante de calidad</button></p>`:''}<div class="info"><span>Fecha: <b>${x.f} ${x.h}</b></span><span>Estatus: ${st(x)}</span><span>Asesor: <b>${esc(x.ase)}</b></span><span>Producto: <b>${x.prod}</b></span><span>Programado: <b>${fmt(x.cant)}</b></span><span>Entregado: <b>${fmt(x.ent)}</b> · saldo <b>${fmt(saldo(x))}</b></span><span>Transporte: ${trTxt(x)}</span>${x.causa?`<span>Causa: <b>${x.causa}</b></span>`:''}</div>
 ${x.cal?`<p style="font-size:12px"><b>Calidad:</b> ${x.cal.ok?'✔ Conforme':'✕ No conforme'} · ${x.cal.u} · ${x.cal.h} · ${esc(x.cal.nota)}</p>`:''}
 ${x.entregas.length?'<table><tr><th>Hora</th><th class="num">Cant.</th><th>Equipo</th><th>Motorista</th><th>Boleta SAP</th><th>Registró</th><th></th></tr>'+x.entregas.map((e,i)=>`<tr><td>${e.h}</td><td class="num">${fmt(e.c)}</td><td>${e.eq||e.placa||'—'}</td><td>${esc(e.mot)}</td><td>${e.bol||'—'}</td><td>${esc(e.u)}</td><td style="white-space:nowrap"><button class="btn sec sm" onclick="recibo('${x.id}',${i})">Comprobante</button>${e.foto&&/^http/.test(e.foto)?` <a class="btn sec sm" target="_blank" href="${esc(e.foto)}">Foto</a>`:''}</td></tr>`).join('')+'</table>':'<p class="muted">Aún sin entregas registradas.</p>'}`)}

function demoFoto(txt){const c=document.createElement('canvas');c.width=600;c.height=380;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,600,380);gr.addColorStop(0,'#8d8f88');gr.addColorStop(1,'#5f615b');g.fillStyle=gr;g.fillRect(0,0,600,380);
 g.fillStyle='#c9cbc4';for(let i=0;i<5;i++)g.fillRect(40+i*110,200-i%2*30,90,140+i%2*30);g.fillStyle='#fff';g.font='600 22px Poppins';g.textAlign='center';g.fillText(txt,300,60);return c.toDataURL()}
function drawRecibo(cv,o,cb){const W=720,img=new Image();img.onload=()=>{const ph=Math.round(img.height*(W-60)/img.width);const lines=o.rows.length;const H=150+ph+40+lines*34+90;cv.width=W;cv.height=H;const g=cv.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#12130F';g.fillRect(0,0,W,110);g.fillStyle=o.col;g.fillRect(0,110,W,8);
 g.fillStyle='#fff';g.font='700 30px Poppins';g.textAlign='left';g.fillText('DURACRETO',30,52);g.fillStyle='#F9D600';g.fillText('360',222,52);
 g.fillStyle='#cfcfc9';g.font='400 17px Poppins';g.fillText(o.sub,30,84);g.fillStyle='#fff';g.font='600 20px Poppins';g.textAlign='right';g.fillText(o.title,W-30,52);g.font='400 16px Poppins';g.fillStyle='#cfcfc9';g.fillText(o.folio,W-30,84);
 g.drawImage(img,30,140,W-60,ph);let y=140+ph+44;g.textAlign='left';
 o.rows.forEach(([k,v])=>{g.fillStyle='#6b6c68';g.font='400 17px Poppins';g.fillText(k,30,y);g.fillStyle='#1d1e1a';g.font='600 18px Poppins';g.fillText(String(v).slice(0,46),250,y);y+=34});
 g.fillStyle=o.okCol;g.fillRect(30,y,W-60,52);g.fillStyle='#fff';g.font='700 20px Poppins';g.textAlign='center';g.fillText(o.banner,W/2,y+34);cb&&cb()};img.src=o.foto}
function recibo(id,i){const x=recs().find(x=>x.id===id),e=x.entregas[i];const foto=e.fotoLocal||demoFoto(e.foto?'Foto guardada en Drive':'Sin foto');

const REPS={cumF:'Cumplimiento por fecha',desp:'Despachos programados y entregados',ase:'Cumplimiento por asesor',sal:'Saldos pendientes',cau:'Causas de incumplimiento',cal:'Validaciones de calidad (Prefabricados)',ent:'Detalle de entregas (motorista, equipo, boleta)'};
function repData(){const t=S.repT,d1=pd(fromIso($('#rD1').value)),d2=pd(fromIso($('#rD2').value)),bz=$('#rBiz').value,ase=$('#rAse').value;
 let r=[];['B','P'].filter(b=>bz==='T'||b===bz).forEach(b=>(b==='B'?D.B:D.P).forEach(x=>{const t2=pd(x.f);if(t2>=d1&&t2<=d2&&(!ase||x.ase===ase))r.push(Object.assign({neg:BIZ[b].n},x))}));
 r=r.filter(x=>x.req!=='pend');
 if(t==='cumF'){const g={};r.forEach(x=>{const k=x.neg+'|'+x.f;g[k]=g[k]||{_d:pd(x.f),Negocio:x.neg,Fecha:x.f,Despachos:0,Programado:0,Entregado:0,Completos:0,Parciales:0,'No realizados':0};const o=g[k];o.Despachos++;o.Programado+=x.cant;o.Entregado+=x.ent;if(x.st==='ent')o.Completos++;else if(x.st==='par')o.Parciales++;else if(x.st==='no')o['No realizados']++});
  const a=Object.values(g).sort((a,b)=>a._d-b._d).map(o=>{delete o._d;o['Cumplimiento %']=o.Programado?Math.round(o.Entregado/o.Programado*1000)/10:0;o['OTIF %']=o.Despachos?Math.round(o.Completos/o.Despachos*1000)/10:0;return o});
  if(a.length){const T={Negocio:'TOTAL',Fecha:'',Despachos:0,Programado:0,Entregado:0,Completos:0,Parciales:0,'No realizados':0};a.forEach(o=>['Despachos','Programado','Entregado','Completos','Parciales','No realizados'].forEach(k=>T[k]+=o[k]));T['Cumplimiento %']=T.Programado?Math.round(T.Entregado/T.Programado*1000)/10:0;T['OTIF %']=T.Despachos?Math.round(T.Completos/T.Despachos*1000)/10:0;a.push(T)}return a}
 if(t==='desp')return r.map(x=>({Negocio:x.neg,ID:x.id,Fecha:x.f,Hora:x.h,Cliente:x.cli,Asesor:x.ase,Tipo:x.tipo,Producto:x.prod,Programado:x.cant,Entregado:x.ent,Saldo:Math.max(0,x.cant-x.ent),Transporte:x.tr==='P'?'Transportes Platino':'Cliente',Estatus:x.st==='ent'?'Entregado':x.st==='par'?'Parcial':x.st==='no'?'No realizado':'Pendiente',Causa:x.causa}));
 if(t==='ase'){const g={};r.forEach(x=>{const k=x.neg+'|'+x.ase;g[k]=g[k]||{Negocio:x.neg,Asesor:x.ase,Despachos:0,Programado:0,Entregado:0};g[k].Despachos++;g[k].Programado+=x.cant;g[k].Entregado+=x.ent});return Object.values(g).map(o=>Object.assign(o,{Cumplimiento:o.Programado?Math.round(o.Entregado/o.Programado*1000)/10+' %':'—'})).sort((a,b)=>b.Programado-a.Programado)}
 if(t==='sal')return r.filter(x=>x.cant>x.ent&&x.st!=='no').map(x=>({Negocio:x.neg,ID:x.id,Fecha:x.f,Cliente:x.cli,Asesor:x.ase,Producto:x.prod,Programado:x.cant,Entregado:x.ent,Saldo:x.cant-x.ent}));
 if(t==='cau'){const g={};r.filter(x=>x.causa).forEach(x=>{g[x.causa]=(g[x.causa]||0)+1});return Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([c,n])=>({Causa:c,Despachos:n}))}
 if(t==='cal')return r.filter(x=>x.cal).map(x=>({ID:x.id,Fecha:x.f,Cliente:x.cli,Producto:x.prod,Cantidad:x.cant,Resultado:x.cal.ok?'Cumple':'No cumple',Validó:x.cal.u,Hora:x.cal.h,Nota:x.cal.nota}));
 if(t==='ent'){const o=[];r.forEach(x=>x.entregas.forEach(e=>o.push({Negocio:x.neg,ID:x.id,Fecha:x.f,Hora:e.h,Cliente:x.cli,Producto:x.prod,Despachado:e.c,Equipo:e.eq||e.placa,Motorista:e.mot,'Boleta SAP':e.bol,Registró:e.u,Notas:e.nota})));return o}}

 if(t==='prod')b.innerHTML='<table><tr><th>Producto</th><th>Negocio</th><th>Unidad</th><th>Requiere validación de Calidad</th></tr>'+prods().map(p=>({p})).map(c=>`<tr><td>${esc(c.p)}</td><td>${BIZ[S.biz].n}</td><td>${BIZ[S.biz].u}</td><td>${S.biz==='P'?'Sí':'No'}</td></tr>`).join('')+'</table>';
 if(t==='cau')b.innerHTML='<table><tr><th>Causa</th><th>Responsable</th></tr>'+D.cau.map(c=>[c.c,c.r]).map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('')+'</table>';
 if(t==='bit')b.innerHTML=D.bit.length?'<table><tr><th>Fecha y hora</th><th>Registro</th><th>Antes</th><th>Ahora</th><th>Quién</th><th>Detalle</th></tr>'+D.bit.map(b=>`<tr><td>${esc(b.h)}</td><td>${esc(b.c)}</td><td>${esc(b.a)}</td><td>${esc(b.n)}</td><td>${esc(b.u)}</td><td>${esc(b.m)}</td></tr>`).join('')+'</table>':'<div class="empty">Sin cambios registrados.</div>'}
async function editCli(n){n=decodeURIComponent(n);const c=D.cli.find(c=>c.n===n);if(!c)return;
 modal('Cliente · '+esc(c.n),`<div class="fld"><label>Nombre</label><input id="kN" value="${esc(c.n)}"></div><div class="two"><div class="fld"><label>Asesor</label><select id="kA">${ASES.filter(a=>a.act||a.n===c.a).map(a=>`<option ${a.n===c.a?'selected':''}>${esc(a.n)}</option>`).join('')}</select></div><div class="fld"><label>Tipo</label><select id="kT">${['Distribuidor','Proyecto','Consumidor final'].map(t=>`<option ${t===c.t?'selected':''}>${t}</option>`).join('')}</select></div></div>
 <div class="fld"><label>Transporte habitual</label><select id="kR"><option value="P" ${c.tr==='P'?'selected':''}>Transportes Platino</option><option value="C" ${c.tr!=='P'?'selected':''}>Transporte del cliente</option></select></div><button class="btn dk" style="width:100%" id="kS">Guardar</button>`);
 $('#kS').onclick=async()=>{if(await guardar('ruta_catalogo',{tabla:'cliente',rec:{antes:c.n,n:$('#kN').value.trim(),a:$('#kA').value,t:$('#kT').value,tr:$('#kR').value}},'Cliente actualizado')){closeModal();render()}}}
async function nuevoEquipo(){const c=(prompt('Código del equipo (ej. R-12)')||'').trim().toUpperCase();if(!c)return;const t=/^CF/.test(c)?'Camión plataforma':'Rastra';
 if(await guardar('ruta_catalogo',{tabla:'equipo',rec:{c,t,e:'Activa',ejes:t==='Rastra'?2:''}},'Equipo agregado: '+esc(c)))render()}

(async function boot(){try{await cargarTodo();$('#carga').remove();render()}catch(e){if(e.message!=='sesion')$('#cargaT').innerHTML=esc(e.message)+'<br><button class="btn" style="margin-top:12px" onclick="location.reload()">Reintentar</button>'}})();
setInterval(()=>{if(document.visibilityState==='visible'&&CARGADO&&Date.now()-CARGADO>120000&&!$('#mod').classList.contains('on'))reload(1)},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CARGADO&&Date.now()-CARGADO>60000&&!$('#mod').classList.contains('on'))reload(1)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

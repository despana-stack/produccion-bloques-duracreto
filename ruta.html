<style>
:root{--neg:#12130F;--am:#F9D600;--nar:#F49A29;--gris:#A0A19F;--hueso:#F2F2EE;
--bg:#F4F4F1;--card:#fff;--tx:#1d1e1a;--mut:#6b6c68;--bd:#e3e3de;--soft:#F4F4F1;--hov:#fafaf6;
--ok:#2E9B57;--warn:#E08A00;--bad:#D64534;--info:#3A6EA5;--biz:#F9D600}
body.dark{--bg:#121310;--card:#1c1d19;--tx:#ECECE6;--mut:#a3a49e;--bd:#30312c;--soft:#25261f;--hov:#23241f}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13.5px}
button{font-family:inherit}
/* header */
.hdr{background:var(--neg);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:4px solid var(--biz);position:sticky;top:0;z-index:30}
.ib{width:38px;height:38px;border-radius:10px;border:0;background:#ffffff14;color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib:hover{background:#ffffff26}
.logo{font-weight:700;font-size:17px;letter-spacing:.4px;line-height:1.1}.logo span{color:var(--am)}.logo small{display:block;font-weight:400;font-size:10.5px;color:#cfcfc9;letter-spacing:0}@media(max-width:440px){.logo{font-size:14px;letter-spacing:0}}
.sp{flex:1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;color:#cfcfc9;padding:9px 11px;border-radius:9px;font-size:12.5px;white-space:nowrap;cursor:pointer;position:relative;font-weight:500}
.nav button:hover{background:#ffffff12;color:#fff}.nav button.on{background:#ffffff1c;color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 var(--biz)}
.nav .bd{background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;margin-left:5px;font-weight:600}
.bizw{position:relative}.bizdd{display:none;position:absolute;top:36px;left:0;background:var(--card);color:var(--tx);border-radius:12px;box-shadow:0 10px 30px #0005;padding:6px;min-width:230px;z-index:40}
.bizdd.on{display:block}.bizdd div{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}.bizdd div:hover{background:var(--soft)}.bizdd div.dis{opacity:.5;cursor:default}.bizdd div.on{font-weight:600}
.demosel{background:#ffffff14;color:#fff;border:1px solid #ffffff2a;font-size:11.5px;padding:7px 8px;border-radius:9px;max-width:210px}.demosel option{color:#1d1e1a}
@media(max-width:1560px){.hdr .logo small{display:none}.demosel{max-width:150px}}
@media(max-width:1300px){.hdr{flex-wrap:wrap}.nav{order:10;flex-basis:100%;padding-top:4px}}
.strip{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd);font-size:12.5px;position:sticky;top:62px;z-index:29}
.bchip{padding:3px 10px;border-radius:20px;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent}
.bchip.B{background:#F9D600;color:#12130F}.bchip.P{background:#12130F;color:#F2F2EE;border-color:#555}
.demo-user{margin-left:auto;font-size:11.5px;color:var(--mut)}
/* drawer menu */
.mnu{position:fixed;top:0;left:-320px;width:300px;height:100%;background:var(--card);z-index:60;transition:left .22s;box-shadow:6px 0 30px #0004;overflow-y:auto;display:flex;flex-direction:column}
.mnu.on{left:0}.ovl{position:fixed;inset:0;background:#0006;z-index:55;display:none}.ovl.on{display:block}
.mnu .who{background:var(--neg);color:#fff;padding:18px 16px;border-bottom:4px solid var(--biz)}.mnu .who b{display:block;font-size:15px}.mnu .who span{font-size:11.5px;color:#cfcfc9}
.mnu h6{margin:14px 16px 6px;font-size:10.5px;letter-spacing:.8px;color:var(--mut);text-transform:uppercase}
.mi{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;border-left:4px solid transparent}
.mi:hover{background:var(--hov)}.mi.on{border-left-color:var(--biz);background:var(--soft);font-weight:600}
.mi .ico{width:22px;text-align:center}.mi .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px;font-weight:600}
.mi.dis{opacity:.5;cursor:default}.pro{margin-left:auto;font-size:10px;background:var(--soft);padding:2px 6px;border-radius:6px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #8885}
.mnu select{margin:0 16px 10px;width:calc(100% - 32px)}
/* layout */
main{padding:16px;max-width:1400px;margin:auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mut);font-size:11.5px}
h2{font-size:17px;margin:2px 0 12px}
.demo{background:#FFF8CC;color:#4a4100;border:1px solid #F0DC6A;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:14px}
body.dark .demo{background:#3a3510;color:#f5e9a8;border-color:#5b5320}
.kpi{border-top:4px solid var(--biz)}.kpi .l{font-size:11.5px;color:var(--mut)}.kpi .v{font-size:23px;font-weight:700;margin:2px 0}.kpi .s{font-size:11.5px}
.up{color:var(--ok)}.dn{color:var(--bad)}.muted{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--hov)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:nowrap}
.s-prog{background:#E9E9E4;color:#555}.s-cal{background:#ECE3F7;color:#6a3fa0}.s-lib{background:#E3ECF7;color:#2f5d8f}.s-par{background:#FFE9C7;color:#9a5b00}
.s-ent{background:#DDF2E4;color:#237a44}.s-no{background:#FBDCD8;color:#b23a2b}.s-rech{background:#FBDCD8;color:#b23a2b}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--mut);white-space:nowrap}.tag.pl{background:#12130F;color:#F9D600}
.btn{border:0;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;background:var(--am);color:#12130F;font-size:12.5px}
.btn.sec{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.dk{background:#12130F;color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:5px 9px;font-size:11.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,textarea{font-family:inherit;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:12.5px}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datebar input{font-weight:600}
/* calendar */
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calg .h{font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.cell{border:1px solid var(--bd);border-radius:9px;min-height:78px;padding:6px;font-size:11px;cursor:pointer;background:var(--card);position:relative}
.cell.out{opacity:.35}.cell.sel{outline:3px solid var(--biz);outline-offset:-1px}.cell.today .n{background:var(--neg);color:#fff;border-radius:6px;padding:0 5px}
.cell .n{font-weight:600;display:inline-block}.cell .q{font-weight:700;font-size:12.5px;margin-top:3px}
.cell .m{height:6px;border-radius:4px;background:var(--soft);margin-top:4px;overflow:hidden}.cell .m i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--bd)}
.chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.chk.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}.chk.half .bx{background:var(--nar);border-color:var(--nar);color:#fff}.chk.no .bx{background:var(--bad);border-color:var(--bad);color:#fff}
.chk.done .t{text-decoration:line-through;color:var(--mut)}.chk .t b{font-weight:600}.chk .t small{display:block;color:var(--mut);font-size:11px}
.pbar{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;margin:4px 0 10px}.pbar i{display:block;height:100%;background:var(--ok)}
.hbar{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.alert{display:flex;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:7px;align-items:center;border:1px solid var(--bd);background:var(--soft)}
.alert .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.alert b{display:block;font-size:12.5px}.alert span{font-size:11.5px;color:var(--mut)}
/* list cards for despachador */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.tabs button.on{background:#12130F;color:#F9D600;border-color:#12130F}.tabs button b{background:var(--bad);color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;font-size:10px}
.dl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.di{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;border-left:5px solid var(--gris)}
.di:hover{box-shadow:0 4px 14px #0001}.di .top{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut)}
.di .c{font-weight:600;font-size:14px;margin:4px 0 2px}.di .p{font-size:12.5px}.di .ft{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.di.lib{border-left-color:var(--info)}.di.cal{border-left-color:#8a63c7}.di.par{border-left-color:var(--nar)}.di.ent{border-left-color:var(--ok)}.di.no{border-left-color:var(--bad)}
/* modal */
.mod{position:fixed;inset:0;background:#0007;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto}.mod.on{display:flex}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:620px;box-shadow:0 20px 50px #0005;overflow:hidden}
.mbox.w{max-width:900px}
.mhd{background:#12130F;color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--biz)}.mhd b{font-size:15px}
.mhd .x{margin-left:auto;background:#ffffff1c;border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.mbd{padding:16px}
.fld{margin-bottom:11px}.fld label{display:block;font-size:11.5px;font-weight:600;margin-bottom:4px}.fld input,.fld select,.fld textarea{width:100%}
.fld .h{font-size:10.5px;color:var(--mut);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}}
.auto{position:relative}.sug{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 20px #0003;z-index:5;max-height:240px;overflow:auto;display:none}
.sug div{padding:7px 10px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:6px}.sug div:hover{background:var(--soft)}.sug small{color:var(--mut)}
.ro{background:var(--soft)!important}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);color:var(--tx);padding:9px;cursor:pointer;font-size:12px}
.seg button.on{background:#12130F;color:#F9D600;font-weight:600}
.check{border-radius:10px;padding:10px 12px;font-size:12px;margin:4px 0 12px}
.check.ok{background:#E3F5EA;border:1px solid #BFE6CD;color:#1d5a35}.check.no{background:#FDEEEC;border:1px solid #F3C4BD;color:#8f2a1f}.check.wa{background:#FFF4E2;border:1px solid #F4D7A6;color:#7a4b00}
.info{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.info b{font-weight:600}
.mini{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:6px}
.mini div{border-radius:6px;padding:4px 0;text-align:center;font-size:10px;cursor:pointer;color:#fff;font-weight:600;line-height:1.2}.mini div small{display:block;font-weight:400;font-size:9px;opacity:.9}
.mini div.sel{outline:3px solid var(--tx);outline-offset:1px}
.trips{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:12px}
.trips table td{padding:4px}.trips input{padding:5px 6px;width:100%}
.photo{border:2px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.photo img{max-width:100%;max-height:200px;border-radius:8px;display:block;margin:0 auto 6px}
.clock{font-weight:700;font-size:15px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12130F;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-size:12.5px;display:none;border-left:4px solid var(--am);max-width:90%}
.rc canvas{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:10px;box-shadow:0 4px 18px #0002}
.share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wa{background:#25D366;color:#fff}.ml{background:#3A6EA5;color:#fff}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.subtabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.subtabs button.on{background:#12130F;color:#F9D600;border-color:#12130F}
.pill{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#FDEEEC;color:#b23a2b;font-weight:600}.pill.g{background:#DDF2E4;color:#237a44}.pill.o{background:#FFF1D6;color:#8a5600}
.empty{padding:30px;text-align:center;color:var(--mut)}
a{color:var(--info)}body.dark a{color:#8db8ea}

.gwrap{display:grid;gap:14px;margin-bottom:14px}.gks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gk{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--biz);border-radius:12px;padding:10px 12px}.gk .l{font-size:11.5px;color:var(--mut)}.gk .v{font-size:21px;font-weight:700;margin:2px 0}.gk .s{font-size:11.5px;color:var(--mut)}.gk .s b{color:var(--tx)}
.gcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;overflow-x:auto}.gcard h4{margin:0 0 4px;font-size:13.5px}
.glg{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-bottom:8px}.glg i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gbar:hover rect[rx]{opacity:.8}
.rsec{margin-bottom:22px}.rtit{display:flex;align-items:center;gap:10px;font-size:15px;margin:4px 0 10px}.rtit small{font-weight:400;color:var(--mut);font-size:12px}
.rhoy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.rhoy b{display:block;font-size:20px}.rhoy span{font-size:11px;color:var(--mut)}
@media(max-width:800px){.gks{grid-template-columns:1fr 1fr}}html,body{overflow-x:hidden}
@media(max-width:600px){main{padding:10px}.card{padding:12px}.logo small{display:none}.demosel{max-width:120px}
.cell{min-height:54px;padding:3px;font-size:9.5px;border-radius:7px}.cell .q{font-size:10px}.cell .muted{display:none}.calg{gap:3px}
.kpi .v{font-size:19px}.hbar{grid-template-columns:100px 1fr 38px}.strip{top:58px}.mini{grid-template-columns:repeat(7,1fr)}
table{display:block;overflow-x:auto}.info{grid-template-columns:1fr}}
.ib .gl{display:inline-block;line-height:1}.ib.spin .gl{animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}
.who{color:#cfcfc9;font-size:11.5px;text-align:right;line-height:1.25;white-space:nowrap}.who b{color:#fff;display:block;font-size:12px}
.ib.on::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.ib.off::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

<script>
const _now=new Date();const TODAY=_now.getDate()+'/'+(_now.getMonth()+1)+'/'+_now.getFullYear();
const asesAct=()=>ASES.filter(a=>a.act).map(a=>a.n);
const fechaLarga=()=>{const d=new Date();return DIAS[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+' de '+d.getFullYear()};
const $=s=>document.querySelector(s);
const fmt=n=>n===Infinity?'sin límite':Math.round(n||0).toLocaleString('es-HN');
const pct=x=>isFinite(x)?Math.round(x*100)+' %':'—';
const pd=s=>{const[d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d)};
const fd=d=>d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
const iso=s=>{const d=pd(s);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromIso=v=>{const[y,m,d]=v.split('-').map(Number);return d+'/'+m+'/'+y};
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const largo=s=>{const d=pd(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd(d)};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===================== Conexión con Duracreto 360 (misma sesión, mismos usuarios) ===================== */
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SS='dc_bloques_sesion_v2',THM='dc_bloques_tema',RBIZ='dc_ruta_negocio',RSEC='dc_ruta_seccion';
const API_URL=String(window.API_URL||'').trim();
let SES=store.get(SS);
if(!SES||!SES.token||!SES.ruta){location.replace('./')}
async function api(action,payload={}){let r;
 try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:SES&&SES.token},payload))})}catch(e){throw new Error('Sin conexión. Revise el internet e intente de nuevo.')}
 const j=await r.json();if(!j.ok&&j.error==='sesion'){store.del(SS);location.replace('./');throw new Error('sesion')}return j}
const D={B:[],P:[],cli:[],eqs:[],capB:[],capP:[],prodB:[],prodP:[],invB:[],invP:[],prodD:[],conteo:{B:'',P:''},cau:[],bit:[]};
const AUT={B:[],P:[]};let ASES=[],CFG={tolerancia:.1,capB:28000,capP:6},CARGADO=0;
const ST={Programado:'prog',Parcial:'par',Entregado:'ent','No realizado':'no','Saldo cerrado':'ent'};
const RQ={Pendiente:'pend',Aprobada:'ok',Rechazada:'rech'};
const isoDMY=v=>v?fromIso(String(v).slice(0,10)):'';
function conv(x){const o=Object.assign({},x);o.f=isoDMY(x.f);o.cerr=x.st==='Saldo cerrado';o.st=ST[x.st]||'prog';o.req=RQ[x.req]||'';
 o.entregas=(x.entregas||[]).map(e=>Object.assign({},e,{fe:isoDMY(e.fe)}));o.sol=o.st==='par'&&o.cant>o.ent;
 if(o.cal)o.cal=Object.assign({},o.cal,{fe:isoDMY(o.cal.fe)});return o}
const letras=t=>(/bloq/i.test(t)?'B':'')+(/prefa/i.test(t)?'P':'')||'B';
/* Rendimiento (24-nov), mismo patrón del núcleo: lo último traído se guarda en el dispositivo (por usuario) y se muestra al instante;
   luego se actualiza en segundo plano (solo gira ⟳). ⟳, deslizar y recargar la página (F5) traen todo del servidor con pantalla de carga. */
const CKR='dc_ruta_cache_v1';
let CACHE_R=null;
function leerCacheR(){const c=store.get(CKR);return c&&SES&&c.u===SES.u&&c.neg?c:null}
function guardarCacheR(b,j){try{const c=leerCacheR()||{u:SES.u,neg:{}};c.neg[b]=j;c.t=Date.now();localStorage.setItem(CKR,JSON.stringify(c))}catch(e){store.del(CKR)}}
const cargaForzada=()=>{try{const n=performance.getEntriesByType('navigation')[0];return !!n&&n.type==='reload'}catch(e){return false}};
/* Vendido llega compacto: {c:[clientes],p:[productos],v:[vendedores],r:[[fecha,ic,ip,iv,planta,cant,L,docs]],desde} */
const PLV=['','San Pedro Sula','Tegucigalpa'];
const vendDe=V=>V&&V.r?V.r.map(x=>({f:x[0],c:V.c[x[1]],p:V.p[x[2]],v:V.v[x[3]],pl:PLV[x[4]]||'',q:x[5],l:x[6],n:x[7]})):(Array.isArray(V)?V:[]);
async function cargarNeg(b){const j=await api('ruta_data',{neg:b});if(!j.ok)throw new Error(j.error||'No se pudo leer '+BIZ[b].n);
 aplicarNeg(b,j);guardarCacheR(b,j)}
function aplicarNeg(b,j){
 D[b]=j.despachos.map(conv);AUT[b]=j.autorizaciones||[];CFG=Object.assign(CFG,j.cfg||{});
 const c=j.cat;D['cap'+b]=c.capacidades;D['prod'+b]=c.productos.map(p=>p.p);D['inv'+b]=j.inventario.items;D['mov'+b]=j.movimientos||[];D.conteo[b]=j.inventario.conteo||'';
 if(b==='P'){D.conteosP=j.inventario.conteos||{};D.miPl=j.planta||'';D.P.forEach(x=>{if(!x.pl)x.pl='San Pedro Sula'});D.avisoMin=!!j.avisoMin}
 D['ped'+b]=(j.pedidos||[]).map(x=>Object.assign(x,{fd:isoDMY(x.f)}));D['vend'+b]=vendDe(j.vendido);D['vendDesde'+b]=(j.vendido&&j.vendido.desde)||'';if(j.sapHora)D.sapHora=j.sapHora;if(j.sapDesde)D.sapDesde=j.sapDesde;(D.pedPuede=D.pedPuede||{})[b]=!!j.puedePedido;
 if(b==='B')D.prodD=(j.inventario.produccion||[]).map(p=>({f:isoDMY(p.f),p:p.p,u:p.u}));
 D.cli=c.clientes.map(k=>Object.assign({},k,{b:letras(k.b),k:0}));D.eqs=c.equipos;D.cau=c.causas;D.bit=c.bitacora||[];
 ASES=c.asesores.map(a=>({n:a.n,act:a.act}));
 if(SES.ruta.rol!==j.rol||String(SES.ruta.negocios)!==String(j.negocios)){SES.ruta={rol:j.rol,negocios:j.negocios};store.set(SS,SES)}}
/* Mientras Fernando no cargue sus catálogos: asesores y clientes salen también del historial de despachos */
const NO_ASES=['','sin asesor','kenneth romero'];
function completarCatalogos(){const todos=D.B.concat(D.P).slice().sort((a,b)=>pd(a.f)-pd(b.f));
 const ya=new Set(ASES.map(a=>nz(a.n)));
 todos.concat(D.cli.map(c=>({ase:c.a}))).forEach(x=>{const n=String(x.ase||'').trim();if(!NO_ASES.includes(nz(n))&&!ya.has(nz(n))){ya.add(nz(n));ASES.push({n,act:true})}});
 ASES.sort((a,b)=>a.n.localeCompare(b.n,'es'));
 const cli=new Map(D.cli.map(c=>[nz(c.n),c]));
 todos.forEach(x=>{const n=String(x.cli||'').trim();if(!n)return;const k=nz(n);const b=D.B.includes(x)?'B':'P';let c=cli.get(k);
  if(!c){c={n,alias:'',t:x.tipo||'Distribuidor',a:'',tr:x.tr||'C',b:'',k:0,hist:1};cli.set(k,c);D.cli.push(c)}
  if(c.hist){if(x.ase&&!NO_ASES.includes(nz(x.ase)))c.a=x.ase;if(x.tipo)c.t=x.tipo;c.tr=x.tr||c.tr}
  if(!c.b.includes(b))c.b+=b});
 D.cli.sort((a,b)=>a.n.localeCompare(b.n,'es'))}
function trasCargar(){completarCatalogos();
 const k={};D.B.concat(D.P).forEach(x=>{const n=nz(x.cli);k[n]=(k[n]||0)+1});D.cli.forEach(c=>c.k=k[nz(c.n)]||0)}
/* Primero el negocio que el usuario está viendo; el otro después (en segundo plano si «otros» no se espera) */
const bizOrden=()=>[S.biz].concat(S.user.biz.filter(b=>b!==S.biz));
async function cargarTodo(soloActual){const [a,...otros]=bizOrden();await cargarNeg(a);trasCargar();CARGADO=Date.now();
 const resto=Promise.all(otros.map(cargarNeg)).then(()=>{trasCargar();return true});
 if(soloActual){resto.catch(()=>{});return {resto}}await resto}
async function guardar(action,payload,okMsg){const b=$('#mbox button.dk,#mbox button.ok,#mbox button.no');
 document.body.classList.add('busy');try{const j=await api(action,Object.assign({neg:S.biz},payload));
  if(!j.ok){if(j.pendiente){espera(j.error)}else toast('✖ '+esc(j.error||'No se pudo guardar'));return null}
  const {resto}=await cargarTodo(true);resto.then(()=>{if(!$('#mod').classList.contains('on'))refrescarVista()}).catch(()=>{});if(okMsg)toast(okMsg);return j}
 catch(e){toast('✖ '+esc(e.message));return null}finally{document.body.classList.remove('busy')}}
function espera(msg){render();modal('Debe esperar autorización',`<div class="check wa" style="font-size:13px">⏳ <b>${esc(msg)}</b></div><p class="muted" style="font-size:12px">Fernando Murillo recibió el aviso. Cuando lo apruebe le llegará una notificación: vuelva a abrir este despacho y registre la misma cantidad. Si lo rechaza, despache como máximo el saldo.</p><button class="btn dk" style="width:100%" onclick="closeModal()">Entendido</button>`)}

/* Foto: se reduce en el teléfono antes de enviarla (máx. 1280 px) */
function reducirFoto(dataUrl){return new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=()=>ok(dataUrl);im.src=dataUrl})}

const esIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSoportado=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;

function cargarScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar Firebase'));document.head.appendChild(s)})}
async function firebaseMsg(){if(fbMsg)return fbMsg;const v='10.12.5';await cargarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await cargarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-messaging-compat.js`);if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE);fbMsg=firebase.messaging();return fbMsg}
async function tokenPush(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;const m=await firebaseMsg();return m.getToken({vapidKey:window.FIREBASE_VAPID,serviceWorkerRegistration:reg})}
const nombreDisp=()=>{const u=navigator.userAgent;return (esIOS?'iPhone/iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Otro')+(instalada()?' · app instalada':' · navegador')};
async function panelPush(){if(pushActivo()){toast('Los avisos ya están activados en este dispositivo.');return}

 try{const p=await Notification.requestPermission();if(p!=='granted'){toast('No se dio permiso para los avisos');return}
  const tk=await tokenPush();const j=await api('suscribir',{pushToken:tk,disp:nombreDisp()});if(!j.ok)throw new Error(j.error);store.set(PTK,tk);try{await api('probarPush')}catch(e){}
  toast('Avisos activados en este dispositivo');renderShell()}catch(e){toast('No se pudieron activar los avisos: '+esc(e.message))}}

/* ---------- usuarios y permisos (demo) ---------- */
const ROLN={ADMIN:'Administrador',PROGRAMADOR:'Programador de despachos',DESPACHO:'Despachador',CALIDAD:'Control de Calidad',CONSULTA:'Consulta'};
const BIZ={B:{n:'Bloques',c:'#F9D600',u:'unid.',cap:28000,capL:'28,000 unid./día'},P:{n:'Prefabricados',c:'#F2F2EE',u:'piezas',cap:6,capL:'6 viajes/día'}};
/* ========== RESUMEN: comprometido, entregado y pendiente por cliente o por producto ========== */
function rangoRes(k){const h=pd(TODAY);
 if(k==='hoy')return [h,h];
 if(k==='sem'){const d=new Date(h);d.setDate(h.getDate()-((h.getDay()+6)%7));const f=new Date(d);f.setDate(d.getDate()+6);return [d,f]}
 if(k==='mesant')return [new Date(h.getFullYear(),h.getMonth()-1,1),new Date(h.getFullYear(),h.getMonth(),0)];
 if(k==='pers'){const a=S.resD1?pd(fromIso(S.resD1)):new Date(h.getFullYear(),h.getMonth(),1),b=S.resD2?pd(fromIso(S.resD2)):h;return a<=b?[a,b]:[b,a]}
 return [new Date(h.getFullYear(),h.getMonth(),1),new Date(h.getFullYear(),h.getMonth()+1,0)]}
const RESP={hoy:'Hoy',sem:'Esta semana',mes:'Este mes',mesant:'Mes anterior',pers:'Elegir fechas…'};
const ESTO=['Atrasado','Esta semana','Programado','Completo','Cerrado'];
function estadoDesp(x){if(x.st==='ent'&&!x.cerr)return 'Completo';if(x.st==='no'||x.cerr)return 'Cerrado';const d=pd(x.f),h=pd(TODAY);
 if(d<h)return 'Atrasado';if(d<=pd(addD(TODAY,6)))return 'Esta semana';return 'Programado'}
const abierto=x=>x.st==='prog'||x.st==='par';
const pillEst=e=>`<span class="rpill r-${{'Atrasado':'a','Esta semana':'s','Programado':'p','Completo':'c','Cerrado':'x'}[e]}">${e}</span>`;
function resDatos(){const k=S.resP||'mes',[d1,d2]=rangoRes(k),b=S.biz,q=nz(S.resQ||'');
 return (b==='B'?D.B:D.P).filter(x=>{const t=pd(x.f);return t>=d1&&t<=d2&&x.req!=='pend'&&x.req!=='rech'&&(!q||nz(x.cli).includes(q)||nz(x.prod).includes(q)||nz(x.ase).includes(q))})}
/* Vendido (24-nov): facturado en SAP en el período (facturas − notas de crédito válidas), con el mismo buscador */
const VPID={};
function pedirVendido(b,desde){const hasta=D['vendDesde'+b];if(!hasta||desde>=hasta||VPID[b+desde])return;VPID[b+desde]=1;
 const h=fromIso(hasta),y=pd(h);y.setDate(y.getDate()-1);
 api('ruta_vendido',{neg:b,desde,hasta:iso(fd(y))}).then(j=>{if(!j.ok)return;D['vend'+b]=vendDe(j.vendido).concat(D['vend'+b]);D['vendDesde'+b]=desde;if(S.sec==='res'&&S.biz===b)refrescarVista()}).catch(()=>{delete VPID[b+desde]})}
function resVend(){const k=S.resP||'mes',[d1,d2]=rangoRes(k),b=S.biz,q=nz(S.resQ||'');pedirVendido(b,iso(fd(d1)));
 return (D['vend'+b]||[]).filter(v=>{const t=pd(fromIso(v.f));return t>=d1&&t<=d2&&(!q||nz(v.c).includes(q)||nz(v.p).includes(q)||nz(v.v).includes(q))})}
/* Pendientes que quedaron de antes del período (para avisar que existen) */
function pendAntes(){const [d1]=rangoRes(S.resP||'mes'),b=S.biz;return (b==='B'?D.B:D.P).filter(x=>pd(x.f)<d1&&abierto(x)&&saldo(x)>0&&x.req!=='pend'&&x.req!=='rech')}
/* Programado (24-nov): solo lo que sigue vigente = lo entregado + el saldo abierto. Lo «No realizado» y el resto de un saldo cerrado no cuentan
   (muchos se volvieron a programar en otro despacho y se contarían dos veces). Así Programado − Entregado = Pendiente. */
const progEf=x=>abierto(x)?Math.max(x.cant,x.ent):x.ent;
function agrupar(r,clave){const g={};r.forEach(x=>{const k=clave(x);const o=g[k]=g[k]||{k,x,comp:0,ent:0,pend:0,atr:0,sem:0,n:0,abiertos:0,dias:0,prox:null,est:'Cerrado',clientes:new Set(),hijos:[]};
  const e=estadoDesp(x),s=abierto(x)?saldo(x):0;o.comp+=progEf(x);o.ent+=x.ent;o.pend+=s;o.n++;o.clientes.add(x.cli);o.hijos.push(x);
  if(abierto(x)){o.abiertos++;if(e==='Atrasado'){o.atr+=s;o.dias=Math.max(o.dias,Math.round((pd(TODAY)-pd(x.f))/864e5))}if(e==='Esta semana')o.sem+=s;if(e!=='Atrasado'&&(!o.prox||pd(x.f)<pd(o.prox)))o.prox=x.f}
  if(ESTO.indexOf(e)<ESTO.indexOf(o.est))o.est=e});
 return Object.values(g)}
function resTablaCliente(r){const cl=agrupar(r,x=>x.cli).filter(c=>S.resL==='todos'||c.pend>0).sort((a,b)=>ESTO.indexOf(a.est)-ESTO.indexOf(b.est)||b.pend-a.pend);
 const AB=S.resOpen||(S.resOpen=new Set());
 return {n:cl.length,html:cl.map((c,ci)=>{const pr=agrupar(c.hijos,x=>x.prod).sort((a,b)=>b.pend-a.pend),multi=pr.length>1,ab=multi&&AB.has(c.k);
  return `<tbody class="rgrp"><tr class="rcli ${multi?'rexp':''} ${ab?'abierto':''}" ${multi?`data-c="${ci}" data-k="${esc(c.k)}" title="Ver el detalle por producto"`:''}><td><b>${esc(c.k)}</b><small>${esc(c.x.ase)} · ${c.n} despacho${c.n>1?'s':''}</small></td><td>${!multi?esc(pr[0].k):`<span class="rver"><span class="rcar">▸</span>${pr.length} productos</span>`}</td>
   <td class="num">${fmt(c.comp)}</td><td class="num">${fmt(c.ent)}</td><td class="num"><b>${fmt(c.pend)}</b></td><td>${barraAv(c.ent,c.comp)}</td><td>${c.dias?`<b class="dn">${c.dias} d</b>`:c.prox?esc(c.prox):'—'}</td><td>${pillEst(c.est)}</td></tr>
   ${multi?pr.map(p=>`<tr class="rsub" data-p="${ci}" ${ab?'':'hidden'}><td></td><td>${esc(p.k)}</td><td class="num">${fmt(p.comp)}</td><td class="num">${fmt(p.ent)}</td><td class="num">${fmt(p.pend)}</td><td>${barraAv(p.ent,p.comp)}</td><td>${p.dias?`<span class="dn">${p.dias} d</span>`:p.prox?esc(p.prox):'—'}</td><td>${pillEst(p.est)}</td></tr>`).join(''):''}</tbody>`}).join(''),
  filas:cl.flatMap(c=>agrupar(c.hijos,x=>x.prod).map(p=>({Cliente:c.k,Asesor:c.x.ase,Producto:p.k,Programado:p.comp,Entregado:p.ent,Pendiente:p.pend,'% entregado':p.comp?Math.round(p.ent/p.comp*1000)/10:0,'Días de atraso':p.dias,'Próxima entrega':p.prox||'',Estado:p.est})))}}
function resTablaProducto(r){const b=S.biz,inv=b==='B'?(D.invB||[]):invItems('Ambas','P'),cont=!!D.conteo[b];
 const vp={};resVend().forEach(v=>vp[v.p]=(vp[v.p]||0)+v.q);
 const pr=agrupar(r,x=>x.prod).filter(c=>S.resL==='todos'||c.pend>0).sort((a,b)=>b.pend-a.pend);
 const fila=p=>{const i=inv.find(z=>z.p===p.k),disp=cont&&i?i.disp:null;return {p,disp,falta:disp==null?null:Math.max(0,p.pend-disp)}};
 const L=pr.map(fila);
 return {n:pr.length,html:`<tbody>${L.map(({p,disp,falta})=>`<tr class="rcli"><td><b>${esc(p.k)}</b><small>${p.clientes.size} cliente${p.clientes.size>1?'s':''} · ${p.abiertos} despacho${p.abiertos!==1?'s':''} abierto${p.abiertos!==1?'s':''}</small></td>
  <td class="num">${vp[p.k]?fmt(vp[p.k]):'—'}</td><td class="num">${fmt(p.comp)}</td><td class="num">${fmt(p.ent)}</td><td class="num"><b>${fmt(p.pend)}</b></td><td class="num ${p.atr?'dn':''}">${p.atr?fmt(p.atr):'—'}</td><td class="num">${p.sem?fmt(p.sem):'—'}</td>
  <td class="num">${disp==null?'<span class="muted">sin conteo</span>':fmt(disp)}</td><td class="num">${falta==null?'—':falta?`<b class="dn">${fmt(falta)}</b>`:'<span class="up">cubierto</span>'}</td></tr>`).join('')}</tbody>`,
  filas:L.map(({p,disp,falta})=>({Producto:p.k,Clientes:p.clientes.size,'Despachos abiertos':p.abiertos,'Vendido (SAP)':vp[p.k]||0,Programado:p.comp,Entregado:p.ent,Pendiente:p.pend,'Pendiente atrasado':p.atr,'Vence esta semana':p.sem,'Inventario disponible':disp==null?'':disp,'Por producir':falta==null?'':falta}))}}
const barraAv=(e,p)=>`<div class="rav"><div class="gtrack sm"><i style="width:${Math.min(100,p?e/p*100:0)}%"></i></div><span>${p?Math.round(e/p*100):0} %</span></div>`;
function vRes(){const k=S.resP||'mes',[d1,d2]=rangoRes(k),ant=pendAntes(),vista=S.resV||'cli',b=S.biz,r=resDatos(),u=BIZ[b].u;
 const t=sumas(r);t.p=r.reduce((s,x)=>s+progEf(x),0);const noR=r.reduce((s,x)=>s+x.cant,0)-t.p,nNo=r.filter(x=>progEf(x)<x.cant).length;const pend=r.filter(abierto).reduce((s,x)=>s+saldo(x),0),atr=r.filter(x=>abierto(x)&&estadoDesp(x)==='Atrasado'),sem=r.filter(x=>abierto(x)&&estadoDesp(x)==='Esta semana');
 const T=vista==='cli'?resTablaCliente(r):resTablaProducto(r);

 <div class="rks">${(()=>{const V=resVend(),vq=V.reduce((s,v)=>s+v.q,0),vl=V.reduce((s,v)=>s+v.l,0),nc=new Set(V.map(v=>v.c)).size;return kp('Vendido',fmt(vq),`L ${fmt(Math.round(vl))} sin ISV · ${nc} cliente${nc!==1?'s':''} · SAP`,'vd')})()}${kp('Programado',fmt(t.p),noR>0?`${t.n} despachos · no cuenta ${fmt(noR)} no realizado o de saldos cerrados (${nNo})`:t.n+' despachos programados')}${kp('Entregado',fmt(t.e),pctTxt(t.e,t.p)+' de lo programado','ok')}${kp('Pendiente',fmt(pend),r.filter(abierto).length+' despachos abiertos','pe')}
  ${kp('Atrasado',fmt(atr.reduce((s,x)=>s+saldo(x),0)),atr.length+' despachos con fecha vencida',atr.length?'al':'')}${kp('Vence esta semana',fmt(sem.reduce((s,x)=>s+saldo(x),0)),sem.length+' despachos')}</div>
 <div class="card"><div class="tools"><div class="seg" style="min-width:250px"><button class="${vista==='cli'?'on':''}" data-v="cli">Por cliente</button><button class="${vista==='prod'?'on':''}" data-v="prod">Por producto</button></div>

  <div class="tsc"><table class="rtab">${vista==='cli'?'<thead><tr><th>Cliente</th><th>Producto</th><th class="num">Programado</th><th class="num">Entregado</th><th class="num">Pendiente</th><th>Avance</th><th>Atraso / próxima</th><th>Estado</th></tr></thead>':'<thead><tr><th>Producto</th><th class="num">Vendido</th><th class="num">Programado</th><th class="num">Entregado</th><th class="num">Pendiente</th><th class="num">Atrasado</th><th class="num">Vence esta semana</th><th class="num">Inventario disponible</th><th class="num">Por producir</th></tr></thead>'}
  ${T.n?T.html:`<tbody><tr><td colspan="8" class="empty">${S.resL==='todos'?'Sin despachos programados en el período.':'Nada pendiente en el período. Toque «Todos» para ver lo completo.'}</td></tr></tbody>`}</table></div></div>
 ${ant.length?`<div class="rant">⚠ Además hay <b>${fmt(ant.reduce((s,x)=>s+saldo(x),0))} ${u}</b> pendientes de <b>${ant.length} despacho${ant.length>1?'s':''}</b> programados antes del ${fd(d1)} que no se han entregado. <a href="#" id="zAnt">Verlos</a></div>`:''}
 <p class="muted" style="font-size:11px">Vendido = lo facturado en SAP en el período (facturas menos notas de crédito, crédito y contado)${D.sapHora?' · SAP actualizado '+esc(D.sapHora.split(' · ')[0]):''}. Programado = lo vigente del período: lo entregado más el saldo de los despachos abiertos (lo «No realizado» y el resto de los saldos cerrados no cuentan, porque normalmente se volvió a programar en otro despacho). Por eso Programado − Entregado = Pendiente. Pendiente = saldo de los despachos abiertos (no incluye saldos cerrados ni no realizados). Atrasado = pendiente con fecha programada vencida.</p>`;
 document.querySelectorAll('.rperb [data-p]').forEach(x=>x.onclick=()=>{S.resP=x.dataset.p;if(x.dataset.p==='pers'&&!S.resD1){S.resD1=iso(fd(d1));S.resD2=iso(fd(d2))}render()});

const recs=(b=S.biz)=>b==='B'?D.B:D.P;

function capOf(prod,eqT){const c=caps().find(c=>c.p===prod);if(!c)return null;return {'Camión plataforma':c.cam,'Rastra':c.ras,'Rastra 2 ejes':c.r2,'Rastra 3 ejes':c.r3}[eqT]||null}

 if(x.st==='ent')return[x.cerr?'Saldo cerrado':'Entregado','s-ent','ent'];
 if(x.st==='no')return['No realizado','s-no','no'];
 if(x.cal&&!x.cal.ok)return['Rechazado por calidad','s-rech','no'];
 if(x.st==='par')return['Parcial · saldo '+fmt(saldo(x)),'s-par','par'];

function invLibre(prod,hasta,pl){if(S.biz==='P'){pl=pl||D.miPl||'San Pedro Sula';if(!(D.conteosP||{})[pl])return Infinity}else if(!D.conteo[S.biz])return Infinity;
 const i=invDe(prod,pl);if(!i)return Infinity;const h=iso(hasta);let cura=0;Object.entries(i.curLib||{}).forEach(([d,q])=>{if(d<=h)cura+=q});
 return i.disp+cura-compProx(prod,pl)}

/* Actualización automática (cada 2 min): trae datos nuevos sin perder filtros, fechas ni búsquedas de la pantalla.
   Si la persona está escribiendo o eligiendo algo, espera a la siguiente vuelta. */
/* Redibuja la sección actual conservando lo escrito en filtros y la posición (refresco en segundo plano) */
function refrescarVista(){const ae=document.activeElement;if(ae&&$('#main').contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
 const snap=[...document.querySelectorAll('#main input[id],#main select[id]')].map(e=>[e.id,e.value]),y=window.scrollY,sec=S.sec;render();
 if(S.sec===sec){snap.forEach(([id,v])=>{const e=document.getElementById(id);if(e&&e.value!==v&&e.type!=='file'){e.value=v;e.dispatchEvent(new Event('change'));e.dispatchEvent(new Event('input'))}});window.scrollTo(0,y)}}
let refrescando=false;
async function refrescoFondo(){if(refrescando)return;refrescando=true;$('#bReload').classList.add('spin');
 try{const {resto}=await cargarTodo(true);if(!$('#mod').classList.contains('on'))refrescarVista();await resto;if(!$('#mod').classList.contains('on'))refrescarVista()}
 catch(e){}finally{refrescando=false;$('#bReload').classList.remove('spin')}}
async function reload(silencio){if(silencio)return refrescoFondo();
 const ae=document.activeElement;if(silencio&&ae&&$('#main').contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
 const snap=[...document.querySelectorAll('#main input[id],#main select[id]')].map(e=>[e.id,e.value]),y=window.scrollY,sec=S.sec;
 if(!silencio)$('#main').style.opacity=.3;
 try{await cargarTodo();if(!$('#mod').classList.contains('on')){render();
   if(S.sec===sec){snap.forEach(([id,v])=>{const e=document.getElementById(id);if(e&&e.value!==v&&e.type!=='file'){e.value=v;e.dispatchEvent(new Event('change'));e.dispatchEvent(new Event('input'))}});window.scrollTo(0,y)}}
  if(!silencio)toast('Datos actualizados · '+nowHM())}
 catch(e){if(!silencio)toast('✖ '+esc(e.message))}finally{$('#main').style.opacity=1}}
/* Botón ⟳: recarga la app completa (datos y versión nueva), como en Duracreto 360. Antes recibía el evento como «silencio» y no se notaba. */
let refAviso=0;
$('#bReload').onclick=()=>{if($('#mod').classList.contains('on')&&Date.now()-refAviso>4000){refAviso=Date.now();toast('Toque otra vez para actualizar. Se perderá lo que lleva escrito en la ventana abierta.');return}
 $('#bReload').classList.add('spin');$('#main').style.opacity=.3;setTimeout(()=>location.reload(),150)};

 return h}

 const rt=carga(addD(f,1))/cap();if(rt>.85)a.push(['#F49A29','▲',`Mañana está al ${pct(rt)} de la capacidad`,'Considera mover programaciones a otro día']);
 const nr=recs().filter(x=>x.st==='no'&&pd(x.f)<pd(f)&&pd(x.f)>=pd(addD(f,-7))&&!x.rep);if(nr.length)a.push(['#D64534','✕',`${nr.length} no realizados en los últimos 7 días`,'Reprogramar o cerrar con el asesor']);
 if(!D.conteo[S.biz])a.push(['#A0A19F','▤','Inventario sin conteo inicial','Mientras no se cargue el conteo físico, la programación no se bloquea por inventario']);
 if(S.biz==='B'&&D.conteo.B){const lo=D.invB.filter(i=>i.disp<10000&&i.disp>0&&recs().some(x=>x.prod===i.p&&pd(x.f)>=pd(addD(f,-30))));lo.forEach(i=>a.push(['#F49A29','▼',`${i.p}: quedan ${fmt(i.disp)} en patio`,'Coordinar producción con planta']))}
 if(AUT[S.biz].length)a.unshift(['#F49A29','!',`${AUT[S.biz].length} despacho${AUT[S.biz].length>1?'s':''} por encima del saldo esperan autorización`,'Hasta 10 % más · ve a Saldos y solicitudes']);
 const rq=pendReq();if(rq.length)a.unshift(['#3A6EA5','＋',`${rq.length} despacho${rq.length>1?'s':''} sin programar por aprobar`,'Clientes que llegaron por pocas unidades · ve a Saldos y solicitudes']);
 return a.length?a.map(x=>`<div class="alert"><div class="ic" style="background:${x[0]}">${x[1]}</div><div><b>${x[2]}</b><span>${x[3]}</span></div></div>`).join(''):'<div class="empty">Sin alertas.</div>'}
function asesorBars(f){const r=recs().filter(x=>x.f===f);const g={};
 r.forEach(x=>{g[x.ase]=g[x.ase]||[0,0];g[x.ase][0]+=x.cant;g[x.ase][1]+=x.ent});
 const a=Object.entries(g).sort((a,b)=>b[1][0]-a[1][0]).slice(0,9);if(!a.length)return '<div class="empty">Sin datos.</div>';
 return a.map(([n,[p,e]])=>{const v=p?e/p:0;return `<div class="hbar"><span>${n}</span><div class="bar"><i style="width:${v*100}%;background:${v>=.85?'#2E9B57':v>=.7?'#F49A29':'#D64534'}"></i></div><span class="num">${pct(v)}</span></div>`}).join('')}
function causas(f){const g={};recs().filter(x=>x.f===f&&x.causa).forEach(x=>g[x.causa]=(g[x.causa]||0)+1);
 const a=Object.entries(g).sort((a,b)=>b[1]-a[1]);if(!a.length)return '<div class="empty">Sin incumplimientos.</div>';const m=a[0][1];
 return a.map(([c,n])=>`<div class="hbar" style="grid-template-columns:150px 1fr 26px"><span>${c}</span><div class="bar"><i style="width:${n/m*100}%;background:var(--tx)"></i></div><span class="num">${n}</span></div>`).join('')}

 modal(`${x.id} · ${esc(x.cli)}`,`${S.user.rol==='CALIDAD'&&x.cal?`<p><button class="btn sec sm" onclick="reciboCal('${x.id}')">Comprobante de calidad</button></p>`:''}<div class="info"><span>Fecha: <b>${x.f} ${x.h}</b></span><span>Estatus: ${st(x)}</span><span>Asesor: <b>${esc(x.ase)}</b></span><span>Producto: <b>${x.prod}</b></span><span>Programado: <b>${fmt(x.cant)}</b></span><span>Entregado: <b>${fmt(x.ent)}</b> · saldo <b>${fmt(saldo(x))}</b></span><span>Transporte: ${trTxt(x)}</span>${x.causa?`<span>Causa: <b>${esc(x.causa)}</b>${respCausa(x.causa)?` <span class="muted">(${esc(respCausa(x.causa))})</span>`:''}</span>`:''}</div>

 ${x.cal?`<p style="font-size:12px"><b>Calidad:</b> ${x.cal.ok?'✔ Conforme':'✕ No conforme'} · ${x.cal.u} · ${x.cal.h} · ${esc(x.cal.nota)}</p>`:''}
 ${x.entregas.length?'<table><tr><th>Hora</th><th class="num">Cant.</th><th>Equipo</th><th>Motorista</th><th>Boleta SAP</th><th>Registró</th><th></th></tr>'+x.entregas.map((e,i)=>`<tr><td>${e.h}</td><td class="num">${fmt(e.c)}</td><td>${e.eq||e.placa||'—'}</td><td>${esc(e.mot)}</td><td>${e.bol||'—'}</td><td>${esc(e.u)}</td><td style="white-space:nowrap"><button class="btn sec sm" onclick="recibo('${x.id}',${i})">Comprobante</button>${e.foto&&/^http/.test(e.foto)?` <a class="btn sec sm" target="_blank" href="${esc(e.foto)}">Foto</a>`:''}</td></tr>`).join('')+'</table>':'<p class="muted">Aún sin entregas registradas.</p>'}`)}

 $('#pAse').onchange=draw;$('#pTxt').oninput=draw;draw()}

function lineaProg(idP,idC,prod,cant,n){return `<div class="pline" id="${idP}Ln">${n?`<div class="plhd"><b>Otro producto</b><button type="button" class="btn sec sm" data-del="${idP}">Quitar</button></div>`:''}<div class="two"><div class="fld"><label>Producto</label>${prodSel(idP,prod)}${tapaBox(idP)}</div><div class="fld"><label>Cantidad total (${BIZ[S.biz].u})</label><input type="number" id="${idC}" value="${cant}" min="1"></div></div></div>`}

 <div class="two"><div class="fld"><label>Asesor <span class="muted" style="font-weight:400">(se llena solo, puedes cambiarlo)</span></label><select id="fAse"><option value="">— Selecciona —</option>${asesAct().map(a=>`<option ${a===F.ase?'selected':''}>${a}</option>`).join('')}</select></div>

 <div class="fld"><label>Fecha de entrega · disponibilidad de los próximos 14 días</label><div class="mini" id="fMini"></div><div class="legend" style="margin-top:4px"><span><i style="background:#2E9B57"></i>Holgado</span><span><i style="background:#F49A29"></i>Ajustado</span><span><i style="background:#D64534"></i>Saturado</span></div></div>
 <div class="two"><div class="fld"><label>Fecha</label><input type="date" id="fFec" value="${iso(F.f)}"></div><div class="fld"><label>Hora</label><input type="time" id="fHora" value="${F.h}"></div></div>

 const pedDe=(i,prod,cli,pl)=>{if(F.reprogDe)return null;if(i===0&&F.pedido){const x=pedidos().find(z=>z.id===F.pedido);if(x&&x.prod===prod)return x}

const GC={app:{},pdf:{}};
const pctTxt=(e,p)=>p?Math.round(e/p*1000)/10+' %':'—';
const pctN=(e,p)=>p?Math.min(1.1,e/p):0;
function repFilas(){const d1=pd(fromIso($('#rD1').value)),d2=S.repT==='dia'?d1:pd(fromIso($('#rD2').value)),bz=$('#rBiz').value,ase=$('#rAse').value;

 return r.filter(x=>x.req!=='pend'&&x.req!=='rech')}
function sumas(r){const o={p:0,e:0,n:r.length,c:0};r.forEach(x=>{o.p+=x.cant;o.e+=x.ent;if(x.st==='ent'&&!x.cerr)o.c++});return o}

/* Medidor: % grande + barra + cifras */
function medidor(t,s,sub){const p=pctN(s.e,s.p);return `<div class="gm"><div class="gm-h"><span>${t}</span><b>${pctTxt(s.e,s.p)}</b></div><div class="gtrack"><i style="width:${Math.min(100,p*100)}%"></i></div><div class="gm-s">${fmt(s.e)} de ${fmt(s.p)} · ${sub}</div></div>`}
/* Filas horizontales: [{lbl,sub,p,e}] — pista = programado, relleno = despachado */
function filasBarras(filas){const max=Math.max(1,...filas.map(f=>Math.max(f.p,f.e)));
 return `<div class="gh">${filas.map(f=>`<div class="gh-r" title="${esc(f.lbl)} · programado ${fmt(f.p)} · despachado ${fmt(f.e)} · ${pctTxt(f.e,f.p)}"><div class="gh-l"><b>${esc(f.lbl)}</b>${f.sub?`<small>${esc(f.sub)}</small>`:''}</div>
  <div class="gh-b"><div class="gtrack sm" style="width:${Math.max(2,f.p/max*100)}%"><i style="width:${Math.min(100,pctN(f.e,f.p)*100)}%"></i></div></div><div class="gh-v"><b>${pctTxt(f.e,f.p)}</b><small>${fmt(f.e)} / ${fmt(f.p)}</small></div></div>`).join('')}</div>`}
/* Columnas por día: programado (pista) con despachado dentro; % debajo */
function columnasDia(filas){const max=Math.max(1,...filas.map(f=>Math.max(f.p,f.e))),paso=Math.ceil(filas.length/20);
 const tope=(()=>{const m=Math.pow(10,Math.floor(Math.log10(max)));return Math.ceil(max/m)*m})();
 return `<div class="gc"><div class="gc-y">${[1,.5,0].map(k=>`<span>${tope*k>=1000?Math.round(tope*k/100)/10+'k':Math.round(tope*k)}</span>`).join('')}</div><div class="gc-a">
  ${filas.map((f,i)=>`<div class="gc-c" title="${esc(f.lbl)} · programado ${fmt(f.p)} · despachado ${fmt(f.e)} · ${pctTxt(f.e,f.p)}"><div class="gc-t"><div class="gc-p" style="height:${f.p/tope*100}%"></div><div class="gc-e" style="height:${f.e/tope*100}%"></div></div>
  <div class="gc-x">${i%paso===0?esc(f.lbl.split('/').slice(0,2).join('/')):''}</div><div class="gc-pc ${f.p&&f.e/f.p<.7?'bajo':''}">${f.p?Math.round(f.e/f.p*100):'–'}</div></div>`).join('')}</div></div>
  <div class="gnote">Barra clara = programado · barra sólida = despachado · número = % de cumplimiento del día</div>`}
function graficosCumpl(){const r=repFilas();if(!r.length)return '';
 const t=sumas(r),pl=sumas(r.filter(x=>x.tr==='P')),cl=sumas(r.filter(x=>x.tr!=='P'));
 let h=`<div class="gcard"><div class="gms">${medidor('Cumplimiento total',t,t.n+' despachos')}${medidor('Transportes Platino',pl,pl.n+' despachos')}${medidor('Cliente recoge',cl,cl.n+' despachos')}</div></div>`;
 if(S.repT==='cumF'){const g={};r.forEach(x=>{g[x.f]=g[x.f]||{lbl:x.f,_d:pd(x.f),p:0,e:0};g[x.f].p+=x.cant;g[x.f].e+=x.ent});
  h+=`<div class="gcard"><h4>Programado contra despachado por día</h4>${columnasDia(Object.values(g).sort((a,b)=>a._d-b._d))}</div>`}
 else{const orden=r.slice().sort((a,b)=>a.h.localeCompare(b.h));
  [['P','Transportes Platino'],['C','Cliente recoge']].forEach(([tp,n])=>{const f=orden.filter(x=>(x.tr==='P')===(tp==='P'));if(!f.length)return;
   h+=`<div class="gcard"><h4>${n} · ${f.length} despacho${f.length>1?'s':''}</h4>${leyenda()}${filasBarras(f.map(x=>({lbl:x.cli,sub:x.h+' · '+x.prod,p:x.cant,e:x.ent})))}</div>`})}
 return h}

const RX_PLAT=/platino|transporte|equipo|rastra|cami[oó]n|motorista|flete|cabezal/i;
function respCausa(c){const z=(D.cau||[]).find(k=>k.c===c);return z&&z.r?z.r:(RX_PLAT.test(c||'')?'Transportes Platino':'')}
const esCausaPlat=c=>!!c&&/platino/i.test(respCausa(c));

/* Despachos Platino con fecha ya cumplida (hasta hoy) */
const platFilas=()=>repFilas().filter(x=>x.tr==='P'&&pd(x.f)<=pd(TODAY));
const incumplido=x=>noEnt(x)>0;
function semanaDe(f){const d=pd(f),l=new Date(d);l.setDate(d.getDate()-((d.getDay()+6)%7));return l}
function graficosPlat(){const r=platFilas();if(!r.length)return '<div class="gcard"><div class="empty">No hay despachos de Transportes Platino en el período.</div></div>';
 const t=sumas(r),inc=r.filter(incumplido),pl=inc.filter(x=>esCausaPlat(x.causa)),sinC=inc.filter(x=>!x.causa);
 const uInc=inc.reduce((s,x)=>s+noEnt(x),0),uPl=pl.reduce((s,x)=>s+noEnt(x),0);
 const kp=(l,v,s,c)=>`<div class="rk ${c||''}"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
 let h=`<div class="rks">${kp('Despachos con Platino',fmt(t.n),fmt(t.p)+' programado')}${kp('Cumplimiento',pctTxt(t.e,t.p),fmt(t.e)+' entregado','ok')}${kp('Despachos completos',pctTxt(t.c,t.n),t.c+' de '+t.n,'pe')}
  ${kp('Incumplidos por causa de Platino',fmt(pl.length),fmt(uPl)+' no entregado','al')}${kp('Peso de Platino en el incumplimiento',pctTxt(uPl,uInc),'del total no entregado ('+fmt(uInc)+')')}</div>`;
 // por causa
 const g={};inc.forEach(x=>{const c=x.causa||'Sin causa registrada';g[c]=g[c]||{c,n:0,u:0};g[c].n++;g[c].u+=noEnt(x)});
 const cs=Object.values(g).sort((a,b)=>b.u-a.u),mx=Math.max(1,...cs.map(c=>c.u));
 h+=`<div class="gcard"><h4>¿Por qué no se entregó? · despachos con Platino incumplidos</h4><div class="pc">${cs.map(c=>{const pt=esCausaPlat(c.c);return `<div class="pc-r ${pt?'pt':''}"><div class="pc-l"><b>${esc(c.c)}</b><small>${esc(c.c==='Sin causa registrada'?'Falta registrar la causa':respCausa(c.c)||'—')}</small></div>
  <div class="pc-b"><i style="width:${Math.max(2,c.u/mx*100)}%"></i></div><div class="pc-v"><b>${fmt(c.u)}</b><small>${c.n} desp. · ${pctTxt(c.u,uInc)}</small></div></div>`}).join('')}</div>
  <div class="gnote">Barra oscura = causa atribuible a Transportes Platino · cifras = unidades no entregadas${sinC.length?` · <b>${sinC.length}</b> incumplidos sin causa registrada`:''}</div></div>`;
 // por semana
 const w={};r.forEach(x=>{const s=semanaDe(x.f),k=+s;w[k]=w[k]||{s,n:0,p:0,e:0,pi:0,pu:0};const o=w[k];o.n++;o.p+=x.cant;o.e+=x.ent;if(incumplido(x)&&esCausaPlat(x.causa)){o.pi++;o.pu+=noEnt(x)}});
 const ws=Object.values(w).sort((a,b)=>a.s-b.s);
 h+=`<div class="gcard"><h4>Evolución por semana</h4><table class="rtab"><thead><tr><th>Semana</th><th class="num">Despachos</th><th class="num">Programado</th><th class="num">Entregado</th><th>Cumplimiento</th><th class="num">Incumplidos por Platino</th><th class="num">No entregado por Platino</th></tr></thead><tbody>
  ${ws.map(o=>{const f=new Date(o.s);f.setDate(f.getDate()+6);return `<tr class="rcli"><td><b>${fd(o.s).slice(0,-5)} al ${fd(f).slice(0,-5)}</b></td><td class="num">${o.n}</td><td class="num">${fmt(o.p)}</td><td class="num">${fmt(o.e)}</td><td>${barraAv(o.e,o.p)}</td><td class="num ${o.pi?'dn':''}">${o.pi||'—'}</td><td class="num ${o.pu?'dn':''}">${o.pu?fmt(o.pu):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
 // por tipo de equipo
 const q={};r.forEach(x=>{const k=x.eqT||'Sin tipo de equipo';q[k]=q[k]||{k,n:0,p:0,e:0,pi:0};q[k].n++;q[k].p+=x.cant;q[k].e+=x.ent;if(incumplido(x)&&esCausaPlat(x.causa))q[k].pi++});
 h+=`<div class="gcard"><h4>Por tipo de equipo</h4><table class="rtab"><thead><tr><th>Tipo de equipo</th><th class="num">Despachos</th><th>Cumplimiento</th><th class="num">Incumplidos por Platino</th><th class="num">% de sus despachos</th></tr></thead><tbody>
  ${Object.values(q).sort((a,b)=>b.n-a.n).map(o=>`<tr class="rcli"><td><b>${esc(o.k)}</b></td><td class="num">${o.n}</td><td>${barraAv(o.e,o.p)}</td><td class="num ${o.pi?'dn':''}">${o.pi||'—'}</td><td class="num">${pctTxt(o.pi,o.n)}</td></tr>`).join('')}</tbody></table></div>`;

const NC_SAP=c=>/segunda/i.test(c)?'Traslado de primera a segunda (BLQPT → BLQPT2)':/desecho/i.test(c)?'Salida a ripio / desecho':/da[ñn]o/i.test(c)?'Salida por daño / avería':'Salida';
function filtNc(){return S.ncF||(S.ncF={d1:iso(fd(new Date(pd(TODAY).getFullYear(),pd(TODAY).getMonth(),1))),d2:iso(TODAY),c:'',p:''})}
async function vNcq(){const F=filtNc(),k=F.d1+'|'+F.d2;
 if(!S.ncD||S.ncD.k!==k){$('#main').innerHTML='<div class="card"><div class="empty">Leyendo lo registrado por Calidad en Duracreto 360…</div></div>';
  try{const j=await api('ruta_noconf',{neg:'B',desde:F.d1,hasta:F.d2});if(!j.ok)throw new Error(j.error||'No se pudo leer');S.ncD={k,L:j.filas}}
  catch(e){$('#main').innerHTML=`<div class="card"><div class="empty">${esc(e.message)}${/desconocida/i.test(e.message)?' · falta publicar la nueva versión de Apps Script':''}</div></div>`;return}
  if(S.sec!=='ncq')return}
 const T=S.ncD.L,cls=[...new Set(T.map(r=>r.c))].sort(),prs=[...new Set(T.map(r=>r.p))].sort();
 const L=T.filter(r=>(!F.c||r.c===F.c)&&(!F.p||r.p===F.p)).sort((a,b)=>b.reg.localeCompare(a.reg));
 const tc={};L.forEach(r=>{tc[r.c]=tc[r.c]||{n:0,q:0};tc[r.c].n++;tc[r.c].q+=r.q});
 const mx={};L.forEach(r=>{mx[r.p]=mx[r.p]||{};mx[r.p][r.c]=(mx[r.p][r.c]||0)+r.q});const cs=Object.keys(tc).sort();
 const sub=`Registrado del ${isoDMY(F.d1)} al ${isoDMY(F.d2)}${F.c?' · '+F.c:''}${F.p?' · '+F.p:''}`;
 const tabTot=`<table class="nctot"><tr><th>Producto</th>${cs.map(c=>`<th class="num">${esc(c)}</th>`).join('')}<th class="num">Total</th></tr>${Object.keys(mx).sort().map(p=>`<tr><td><b>${esc(p)}</b></td>${cs.map(c=>`<td class="num">${mx[p][c]?fmt(mx[p][c]):'—'}</td>`).join('')}<td class="num"><b>${fmt(Object.values(mx[p]).reduce((a,b)=>a+b,0))}</b></td></tr>`).join('')}</table>`;
 const tabDet=`<table class="ncdet"><tr><th>Registrado</th><th>Producción del lote</th><th>Producto</th><th>Clasificación</th><th class="num">Cantidad</th><th>Movimiento en SAP</th><th>Grupo</th><th>Registró</th><th>Observación</th><th>Foto</th></tr>${L.map(r=>`<tr><td>${esc(isoDMY(r.f))} ${esc(r.reg.slice(11,16))}</td><td>${esc(isoDMY(r.fp))}</td><td><b>${esc(r.p)}</b></td><td>${esc(r.c)}</td><td class="num"><b>${fmt(r.q)}</b></td><td>${esc(NC_SAP(r.c))}</td><td class="muted">${esc(r.g)}</td><td class="muted">${esc(r.u)}</td><td class="muted">${esc(r.obs)}</td><td>${/^https?:/.test(r.foto)?`<a href="${esc(r.foto)}" target="_blank" rel="noopener">Ver</a>`:'—'}</td></tr>`).join('')}</table>`;
 $('#main').innerHTML=`<div class="rhead"><div><h2 style="margin:0">Salidas de Calidad · Bloques</h2><div class="rper">Lo que Calidad registra en Duracreto 360 (No conformes) para cargarlo en SAP · por fecha de registro</div></div></div>
 <div class="card" style="margin-bottom:14px"><div class="tools" style="margin:0"><input type="date" id="nD1" value="${F.d1}"><input type="date" id="nD2" value="${F.d2}">
  <select id="nC"><option value="">Todas las categorías</option>${cls.map(c=>`<option ${c===F.c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <select id="nP"><option value="">Todos los productos</option>${prs.map(p=>`<option ${p===F.p?'selected':''}>${esc(p)}</option>`).join('')}</select>
  <span class="sp"></span><button class="btn sec sm" id="nX">Excel</button><button class="btn sec sm" id="nF">PDF</button></div></div>
 <div class="mtot" style="margin-bottom:14px">${cs.map(c=>`<div class="${/desecho|da[ñn]o/i.test(c)?'rip':''}"><span>${esc(c)}</span><b>${fmt(tc[c].q)}</b><small>${tc[c].n} registros · ${esc(NC_SAP(c))}</small></div>`).join('')||'<span class="muted">Sin registros de Calidad en el filtro.</span>'}</div>
 ${L.length?`<div class="card" style="margin-bottom:14px"><h3>Totales por producto</h3><div style="overflow-x:auto">${tabTot}</div></div>
 <div class="card"><h3>Detalle <small>${L.length} registros</small></h3><div style="overflow-x:auto;max-height:520px">${tabDet}</div></div>`:''}`;
 const set=(id,k)=>$(id).onchange=e=>{F[k]=e.target.value;vNcq()};set('#nD1','d1');set('#nD2','d2');set('#nC','c');set('#nP','p');
 $('#nX').onclick=()=>{if(!window.XLSX){toast('No se pudo cargar el generador de Excel');return}const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L.map(r=>({'Fecha de registro':isoDMY(r.f),Hora:r.reg.slice(11,16),'Producción del lote':isoDMY(r.fp),Producto:r.p,'Producto en Duracreto 360':r.pd,'Clasificación':r.c,Cantidad:r.q,'Movimiento en SAP':NC_SAP(r.c),Grupo:r.g,'Registró':r.u,'Observación':r.obs,Foto:r.foto,ID:r.id}))),'Detalle');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.keys(mx).sort().map(p=>Object.assign({Producto:p},...cs.map(c=>({[c]:mx[p][c]||0})),{Total:Object.values(mx[p]).reduce((a,b)=>a+b,0)}))),'Totales');
  XLSX.writeFile(wb,'Despachos_Salidas_Calidad_'+F.d1+'_'+F.d2+'.xlsx')};

 if(t==='ase')b.innerHTML=`<div class="tools"><span class="muted">Solo los asesores <b>activos</b> aparecen al programar. Los inactivos se conservan en el histórico.</span><span class="sp"></span><button class="btn sec" onclick="S.sec='rep';S.repT='cumF';render()">⬇ Reporte de cumplimiento por fechas</button><button class="btn" onclick="nuevoAsesor()">+ Asesor</button></div><table><tr><th>Asesor</th><th class="num">Clientes asignados</th><th>Estado</th><th></th></tr>`+ASES.map((a,i)=>`<tr><td><b>${esc(a.n)}</b></td><td class="num">${D.cli.filter(c=>c.a===a.n).length}</td><td>${a.act?'<span class="pill g">Activo</span>':'<span class="pill">Inactivo</span>'}</td><td><button class="btn sec sm" onclick="togAse(${i})">${a.act?'Desactivar':'Activar'}</button></td></tr>`).join('')+'</table>';

 if(t==='prod')b.innerHTML='<table><tr><th>Producto</th><th>Negocio</th><th>Unidad</th><th>Requiere validación de Calidad</th></tr>'+prods().map(p=>({p})).map(c=>`<tr><td>${esc(c.p)}</td><td>${BIZ[S.biz].n}</td><td>${BIZ[S.biz].u}</td><td>${S.biz==='P'?'Sí':'No'}</td></tr>`).join('')+'</table>';

async function editCli(n){n=decodeURIComponent(n);const c=D.cli.find(c=>c.n===n);if(!c)return;
 modal('Cliente · '+esc(c.n),`<div class="fld"><label>Nombre</label><input id="kN" value="${esc(c.n)}"></div><div class="two"><div class="fld"><label>Asesor</label><select id="kA">${ASES.filter(a=>a.act||a.n===c.a).map(a=>`<option ${a.n===c.a?'selected':''}>${esc(a.n)}</option>`).join('')}</select></div><div class="fld"><label>Tipo</label><select id="kT">${['Distribuidor','Proyecto','Consumidor final'].map(t=>`<option ${t===c.t?'selected':''}>${t}</option>`).join('')}</select></div></div>
